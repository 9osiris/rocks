        // --- FIBRE LIVE — immersive voice conversation ---
        
        // TypeScript-style interface definitions for enhanced orb configuration
        // (Using JSDoc comments for type documentation in vanilla JS)
        
        /**
         * @typedef {Object} Particle
         * @property {number} angle - Orbital angle in radians
         * @property {number} radius - Distance from center (normalized 0-1)
         * @property {number} speed - Angular velocity
         * @property {number} size - Particle size in pixels (1-4px)
         * @property {number} opacity - Base opacity (0-1)
         * @property {number} z - Z-depth for 3D effect (-1 to 1)
         * @property {number} phase - Orbital phase offset
         * @property {string} color - RGB color based on orb phase
         */
        
        /**
         * @typedef {Object} OrbConfiguration
         * @property {Object} particleCount - Particle counts per phase
         * @property {number} particleCount.idle
         * @property {number} particleCount.listen
         * @property {number} particleCount.think
         * @property {number} particleCount.speak
         * @property {[number, number]} particleSizeRange - Min and max particle size in pixels
         * @property {number} particleConnectionThreshold - Distance threshold for particle connections in pixels
         * @property {number} particleConnectionMinCount - Minimum particle count to render connections
         * @property {number} targetFPS - Target frames per second
         * @property {number} frameBudget - Frame time budget in milliseconds
         * @property {number} transitionDuration - Phase transition duration in milliseconds
         * @property {number} particleCountTransition - Particle count transition duration in milliseconds
         * @property {number} audioSampleRate - Audio sampling rate in Hz
         * @property {number} audioSmoothingFactor - Exponential moving average factor
         * @property {number} audioScaleMin - Minimum scale multiplier
         * @property {number} audioScaleMax - Maximum scale multiplier
         * @property {number} audioThreshold - Amplitude threshold for pulse waves
         * @property {number} minFPS - Minimum FPS before quality reduction
         * @property {number} mobileParticleReduction - Particle reduction factor for mobile (0-1)
         * @property {Object} orbSize - Responsive sizing configuration
         * @property {Object} lighting - Phase-specific lighting configuration
         */
        
        /**
         * @typedef {Object} AnimationState
         * @property {'idle'|'listen'|'think'|'speak'} currentPhase - Current orb phase
         * @property {'idle'|'listen'|'think'|'speak'} previousPhase - Previous orb phase
         * @property {number} transitionProgress - Transition progress (0-1)
         * @property {number} transitionStartTime - Transition start timestamp
         * @property {number} audioAmplitude - Raw audio amplitude (0-1)
         * @property {number} smoothedAmplitude - Smoothed amplitude via EMA (0-1)
         * @property {number} lastAmplitudePeak - Timestamp of last amplitude peak
         * @property {number} lastFrameTime - Previous frame timestamp
         * @property {number} frameCount - Total frame count
         * @property {number} fps - Current frames per second
         * @property {number} droppedFrames - Count of dropped frames
         * @property {number} activeParticleCount - Current active particle count
         * @property {number} targetParticleCount - Target particle count for current phase
         * @property {Particle[]} particlePool - Pool of particle objects
         */
        
        // Enhanced Orb Configuration Object
        const ORB_CONFIG = {
            // Particle settings
            particleCount: {
                idle: 48,
                listen: 48,
                think: 72,
                speak: 48,
            },
            particleSizeRange: [1, 4], // pixels
            particleConnectionThreshold: 60, // pixels
            particleConnectionMinCount: 60,
            
            // Animation settings
            targetFPS: 60,
            frameBudget: 16.67, // ms
            transitionDuration: 600, // ms for phase changes
            particleCountTransition: 1000, // ms for count changes
            
            // Audio reactive settings
            audioSampleRate: 60, // Hz
            audioSmoothingFactor: 0.15, // Exponential moving average
            audioScaleMin: 1.0,
            audioScaleMax: 1.15,
            audioThreshold: 0.3, // Amplitude threshold for pulse waves
            
            // Performance thresholds
            minFPS: 30, // Triggers particle reduction
            mobileParticleReduction: 0.3, // 30% reduction on mobile
            
            // Responsive sizing
            orbSize: {
                desktop: { min: 280, max: 340 }, // pixels
                mobile: '78vw',
            },
            
            // Lighting and color configuration by phase
            lighting: {
                listen: {
                    colors: ['#3b82f6', '#60a5fa', '#93c5fd'],
                    shadowColor: 'rgba(91,141,239,.28)',
                    shadowRadius: [50, 70], // [min, max] pixels
                },
                speak: {
                    colors: ['#f59e0b', '#fbbf24', '#fde68a'],
                    shadowColor: 'rgba(200,215,230,.32)',
                    shadowRadius: [48, 72],
                },
                think: {
                    colors: ['#6366f1', '#8b5cf6', '#a78bfa'],
                    shadowColor: 'rgba(139,92,246,.25)',
                    shadowRadius: [40, 60],
                },
                idle: {
                    colors: ['#64748b', '#94a3b8', '#cbd5e1'],
                    shadowColor: 'rgba(100,116,139,.15)',
                    shadowRadius: [30, 45],
                },
            },
        };
        
        const FibreLiveOrb = ({ phase, levelRef, compact = false }) => {
            const canvasRef = useRef(null);
            const phaseRef = useRef(phase);
            const particlesRef = useRef([]);
            const lastFrameTimeRef = useRef(0);
            const smoothedAmplitudeRef = useRef(0); // Enhanced: EMA smoothed amplitude
            const lastAmplitudePeakRef = useRef(0); // Enhanced: Track amplitude peaks
            phaseRef.current = phase;
            
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let raf = 0;
                let t = 0;
                
                // Enhanced particle initialization with z-depth and phase offset
                const initParticles = (count) => {
                    const particles = [];
                    for (let i = 0; i < count; i++) {
                        particles.push({
                            angle: (i / count) * Math.PI * 2,
                            radius: 0.55 + (i % 5) * 0.06,
                            speed: 0.4 + (i % 7) * 0.08,
                            size: 1 + Math.random() * 3, // 1-4px range
                            baseOpacity: 0.15 + (i % 3) * 0.08,
                            z: Math.sin((i / count) * Math.PI * 4) * 0.8, // Z-depth -0.8 to 0.8
                            phase: (i / count) * Math.PI * 2, // Orbital phase offset
                            ellipseRatio: 0.85 + Math.random() * 0.3, // Elliptical variation
                            color: 'rgba(255,255,255,1)',
                        });
                    }
                    return particles;
                };
                
                // Initialize particles based on compact mode
                const targetCount = compact ? 12 : ORB_CONFIG.particleCount.idle;
                particlesRef.current = initParticles(targetCount);
                
                const draw = (currentTime) => {
                    const dpr = window.devicePixelRatio || 1;
                    const w = canvas.clientWidth;
                    const h = canvas.clientHeight;
                    if (!w || !h) { raf = requestAnimationFrame(draw); return; }
                    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
                        canvas.width = Math.round(w * dpr);
                        canvas.height = Math.round(h * dpr);
                    }
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    ctx.clearRect(0, 0, w, h);
                    
                    const ph = phaseRef.current;
                    const rawLevel = levelRef.current || 0;
                    
                    // Enhanced: Apply exponential moving average for smooth amplitude changes (Task 6.2)
                    smoothedAmplitudeRef.current += (rawLevel - smoothedAmplitudeRef.current) * ORB_CONFIG.audioSmoothingFactor;
                    const level = smoothedAmplitudeRef.current;
                    
                    // Enhanced: Track amplitude peaks for pulse waves (Task 6.3)
                    if (rawLevel > ORB_CONFIG.audioThreshold && currentTime - lastAmplitudePeakRef.current > 300) {
                        lastAmplitudePeakRef.current = currentTime;
                    }
                    
                    const cx = w / 2;
                    const cy = h / 2;
                    const baseR = Math.min(w, h) * (compact ? 0.34 : 0.26);
                    const deltaTime = lastFrameTimeRef.current ? (currentTime - lastFrameTimeRef.current) / 1000 : 0.016;
                    lastFrameTimeRef.current = currentTime;
                    
                    t += ph === 'think' ? 0.026 : (ph === 'listen' || ph === 'speak') ? 0.034 : 0.016;
                    
                    // Enhanced: Audio-reactive orb scaling (Task 6.3)
                    let pulse = 1;
                    if (ph === 'speak') {
                        // Map smoothed amplitude to scale range (1.0 to 1.15)
                        const audioScale = ORB_CONFIG.audioScaleMin + (level * (ORB_CONFIG.audioScaleMax - ORB_CONFIG.audioScaleMin));
                        pulse = audioScale;
                    } else if (ph === 'listen') {
                        pulse = 1 + level * 0.42;
                    } else if (ph === 'think') {
                        pulse = 1 + Math.sin(t * 2.4) * 0.06;
                    } else {
                        pulse = 1 + Math.sin(t * 1.1) * 0.03;
                    }

                    // Aurora wash behind blob
                    const wash = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 2.2);
                    wash.addColorStop(0, ph === 'speak' ? 'rgba(200,220,255,0.18)' : 'rgba(220,228,240,0.12)');
                    wash.addColorStop(0.55, 'rgba(180,190,210,0.06)');
                    wash.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = wash;
                    ctx.fillRect(0, 0, w, h);

                    // Update particle count based on phase (if not compact)
                    if (!compact) {
                        const targetParticleCount = ORB_CONFIG.particleCount[ph] || ORB_CONFIG.particleCount.idle;
                        if (particlesRef.current.length < targetParticleCount) {
                            // Add particles gradually
                            particlesRef.current.push(...initParticles(1));
                        } else if (particlesRef.current.length > targetParticleCount) {
                            // Remove particles gradually
                            particlesRef.current.pop();
                        }
                    }

                    // Enhanced particle rendering with z-depth and audio-reactive modulation
                    const particles = particlesRef.current;
                    const particlePositions = []; // Store positions for connection lines
                    
                    particles.forEach((p, i) => {
                        // Enhanced: Audio-reactive particle speed modulation (Task 6.4)
                        const audioSpeedBoost = (ph === 'speak' && level > 0.05) ? (1 + level * 0.8) : 1;
                        
                        // Update particle angle with audio-reactive speed
                        p.angle += p.speed * 0.012 * audioSpeedBoost;
                        
                        // Calculate z-depth effect (oscillates based on angle)
                        p.z = Math.sin(p.angle * 2 + t) * 0.7;
                        
                        // Z-depth based opacity (particles further back are more transparent)
                        const zOpacity = 0.3 + (p.z + 1) * 0.35; // Maps -1,1 to 0.3,1.0
                        
                        // Phase-specific behavior
                        let radiusModifier = 1;
                        let angleOffset = 0;
                        
                        if (ph === 'listen') {
                            // Particles drift toward center
                            radiusModifier = 0.95 + Math.sin(t * 2 + i) * 0.05;
                        } else if (ph === 'speak') {
                            // Particles emanate outward in waves - enhanced with audio reactivity
                            const audioWave = level > 0.05 ? level * 0.3 : 0;
                            radiusModifier = 1 + audioWave + Math.sin(t * 3 + i) * 0.1;
                        } else if (ph === 'think') {
                            // Complex rotation patterns
                            angleOffset = Math.sin(t * 1.5 + i * 0.3) * 0.5;
                        }
                        
                        const pr = baseR * p.radius * pulse * radiusModifier + (ph === 'listen' || ph === 'speak' ? level * 12 : 0);
                        // Elliptical orbit
                        const px = cx + Math.cos(p.angle + angleOffset + t * 0.3) * pr * p.ellipseRatio;
                        const py = cy + Math.sin(p.angle + angleOffset + t * 0.25) * pr;
                        
                        particlePositions.push({ x: px, y: py, z: p.z });
                        
                        // Enhanced: Audio-reactive particle size (Task 6.4)
                        const audioSizeBoost = (ph === 'speak' && level > 0.05) ? level * 1.5 : 0;
                        
                        // Draw particle with z-depth opacity
                        ctx.beginPath();
                        ctx.arc(px, py, p.size + audioSizeBoost, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,255,255,${p.baseOpacity * zOpacity})`;
                        ctx.fill();
                    });
                    
                    // Draw connection lines between nearby particles (only when count > 60)
                    if (!compact && particles.length > ORB_CONFIG.particleConnectionMinCount) {
                        ctx.strokeStyle = `rgba(255,255,255,0.1)`;
                        ctx.lineWidth = 0.5;
                        
                        for (let i = 0; i < particlePositions.length; i++) {
                            for (let j = i + 1; j < particlePositions.length; j++) {
                                const p1 = particlePositions[i];
                                const p2 = particlePositions[j];
                                const dx = p2.x - p1.x;
                                const dy = p2.y - p1.y;
                                const distance = Math.sqrt(dx * dx + dy * dy);
                                
                                if (distance < ORB_CONFIG.particleConnectionThreshold) {
                                    const opacity = (1 - distance / ORB_CONFIG.particleConnectionThreshold) * 0.15;
                                    ctx.strokeStyle = `rgba(255,255,255,${opacity})`;
                                    ctx.beginPath();
                                    ctx.moveTo(p1.x, p1.y);
                                    ctx.lineTo(p2.x, p2.y);
                                    ctx.stroke();
                                }
                            }
                        }
                    }

                    // Layered blob rendering (keep existing)
                    [
                        { scale: 1, alpha: 0.62, speed: 1, stroke: 0.45, hue: 0 },
                        { scale: 0.86, alpha: 0.38, speed: 1.4, stroke: 0.28, hue: 12 },
                        { scale: 0.72, alpha: 0.22, speed: 1.75, stroke: 0.16, hue: -8 },
                    ].forEach((layer, li) => {
                        const audioBoost = (ph === 'listen' || ph === 'speak') ? level * 34 : (ph === 'think' ? Math.sin(t * 3.5) * 6 : 0);
                        const r = baseR * layer.scale * pulse + audioBoost;
                        ctx.beginPath();
                        const pts = compact ? 72 : 120;
                        for (let i = 0; i <= pts; i++) {
                            const a = (i / pts) * Math.PI * 2;
                            const wobble = Math.sin(a * 3 + t * layer.speed + layer.hue * 0.02) * (compact ? 7 : 12)
                                + Math.sin(a * 5 - t * 1.5 * layer.speed + li) * (compact ? 5 : 8)
                                + Math.cos(a * 2 + t * 0.8) * (compact ? 4 : 7)
                                + Math.sin(a * 7 + t * 2.1) * 3;
                            const rad = r + wobble;
                            const x = cx + Math.cos(a) * rad;
                            const y = cy + Math.sin(a) * rad;
                            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        const g = ctx.createRadialGradient(cx - r * 0.25, cy - r * 0.3, 0, cx, cy, r * 1.3);
                        g.addColorStop(0, `rgba(255,255,255,${layer.alpha})`);
                        g.addColorStop(0.38, `rgba(210,220,235,${layer.alpha * 0.55})`);
                        g.addColorStop(0.72, `rgba(160,175,195,${layer.alpha * 0.2})`);
                        g.addColorStop(1, 'rgba(100,110,130,0)');
                        ctx.fillStyle = g;
                        ctx.fill();
                        ctx.strokeStyle = `rgba(255,255,255,${layer.stroke})`;
                        ctx.lineWidth = compact ? 1.2 : 1.8;
                        ctx.stroke();
                    });

                    // drifting specular
                    const hx = cx + Math.sin(t * 0.9) * baseR * 0.32;
                    const hy = cy + Math.cos(t * 0.65) * baseR * 0.24;
                    const spec = ctx.createRadialGradient(hx, hy, 0, hx, hy, baseR * 0.55);
                    spec.addColorStop(0, 'rgba(255,255,255,0.72)');
                    spec.addColorStop(0.45, 'rgba(255,255,255,0.18)');
                    spec.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = spec;
                    ctx.beginPath();
                    ctx.arc(hx, hy, baseR * 0.5, 0, Math.PI * 2);
                    ctx.fill();

                    raf = requestAnimationFrame(draw);
                };
                draw();
                return () => cancelAnimationFrame(raf);
            }, [levelRef, compact]);
            return <canvas ref={canvasRef} className="fibre-live-orb-canvas" aria-hidden="true" />;
        };

            if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
            const d = new Date(ts);
            const today = new Date(); today.setHours(0,0,0,0);
            const msgDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            if (today - msgDay === 86400000) return 'Yesterday';

        const MessageBubble = ({ role, content, ts, imageThumb, isLatest, isFresh, onSpeak, onCopy, onRegenerate, onEdit, typeSpeed, isStreaming, quickReplies, onQuickReply, onOpenArtifact, searchQuery, isLatestMsg, onRevealTick, msgReaction, onReaction, isEdited, isSpeaking, speakProgress, tokenUsage, showTokenUsage }) => {

            const { display: typedAnswer, complete: typeComplete } = useTypewriter(
                segments.length ? segments.filter(s => s.type === 'answer').map(s => s.content).join('\n\n') : (answer || ''),

            const uiReady = !isStreaming && !revealActive && (!shouldType || typeComplete);
            const [copied, setCopied] = useState(false);
            // Reaction is persisted in the message object via onReaction; local state is just the optimistic display
            const [reaction, setReaction] = useState(msgReaction);
            useEffect(() => { setReaction(msgReaction); }, [msgReaction]);
            if (role === 'system_display') return null;

            const plain = stripThinking(content || '');
            const matchesSearch = !searchQuery || plain.toLowerCase().includes(searchQuery.toLowerCase());

            // Highlight matching search text within a plain string
            const highlightSearchText = (text, query) => {
                if (!query || !text) return text;
                const idx = text.toLowerCase().indexOf(query.toLowerCase());
                if (idx === -1) return text;
                return [
                    text.slice(0, idx),
                    <mark key="m" className="sonnet-search-mark">{text.slice(idx, idx + query.length)}</mark>,
                    text.slice(idx + query.length)
                ];
            };

            const copy = () => {
                navigator.clipboard.writeText(plain);
                setCopied(true);
                onCopy && onCopy('Copied', 'success');
                setTimeout(() => setCopied(false), 2000);
            };

            const isUser = role === 'user';
            const hasCode = !isUser && /```/.test(content || '');

            return (
                <div className={`sonnet-msg no-avatar ${role === 'error' ? '' : ''}${isUser ? 'user' : 'assistant'}${searchQuery && !matchesSearch ? ' dimmed' : ''}${searchQuery && matchesSearch ? ' highlighted' : ''}${isLatestMsg ? ' latest' : ''}`}>
                    <div className="sonnet-bubble-wrap">
                        {role === 'error' ? (
                            <div className="sonnet-error-card">
                                <div className="sonnet-error-header">
                                    <Icon name="warning-circle" size={15} weight="fill" />
                                    <span>Something went wrong</span>
                                </div>
                                <p className="sonnet-error-body">{content}</p>
                                {onRegenerate && (
                                    <button type="button" className="sonnet-error-retry" onClick={onRegenerate}>
                                        <Icon name="arrow-clockwise" size={13} /> Try again
                                    </button>
                                )}
                            </div>
                        ) : isUser ? (
                            <>
                                {imageThumb && <img src={imageThumb} alt="" style={{ maxWidth: 200, borderRadius: 12, marginBottom: 8, border: '1px solid var(--border)' }} />}
                                <div className="sonnet-bubble user">{searchQuery && matchesSearch ? highlightSearchText(content, searchQuery) : content}</div>
                                {isEdited && <span className="sonnet-edited-badge"><Icon name="pencil-simple" size={9} /> edited</span>}
                            </>
                        ) : segments.length && (segments.some(s => s.type === 'answer' && s.content) || segments.some(s => s.type === 'thinking' && s.content)) ? (
                            <>
                                {segments.map((seg, idx) => {
                                    if (idx > segPhase) return null;
                                    const isCurrent = idx === segPhase && (isStreaming || revealActive);
                                    const isDone = idx < segPhase;
                                    if (seg.type === 'thinking') {
                                        return (
                                            <ThinkingBlock
                                                key={idx}
                                                content={seg.content}
                                                isActive={isCurrent}
                                                isStreamingPhase={isStreaming && !!(seg.partial || (idx === segments.length - 1 && seg.type === 'thinking'))}
                                                onRevealTick={onRevealTick}
                                                onRevealComplete={() => { if (idx === segPhase) setSegPhase(p => p + 1); }}
                                            />
                                        );
                                    }
                                    return (
                                        <div key={idx} className={`sonnet-bubble assistant${isCurrent && isStreaming ? ' streaming' : ''}`}>
                                            {shouldReveal && isCurrent ? (
                                                <StreamMarkdown content={seg.content} isReceiving={isStreaming} onRevealTick={onRevealTick} onRevealComplete={() => { setRevealActive(false); if (idx === segPhase) setSegPhase(p => p + 1); }} />
                                            ) : shouldType && isCurrent ? (
                                                <><Markdown content={typedAnswer} /><span className="typing-cursor" /></>
                                            ) : (
                                                <Markdown content={seg.content} />
                                            )}
                                        </div>
                                    );
                                })}
                            </>
                        ) : (
                            <>
                                {thinking && (
                                    <ThinkingBlock
                                        content={thinking}
                                        isActive={!thinkingRevealDone}
                                        isStreamingPhase={isStreaming && !answer}
                                        onRevealTick={onRevealTick}
                                        onRevealComplete={() => setThinkingRevealDone(true)}
                                    />
                                )}
                                {(answerReady || answer || !thinking) && (
                                    <div className={`sonnet-bubble assistant${isStreaming && answerReady ? ' streaming' : ''}${isSpeaking ? ' is-speaking' : ''}`}>
                                        {shouldReveal && answerReady ? (
                                            <StreamMarkdown content={answer || ''} isReceiving={isStreaming} onRevealTick={onRevealTick} onRevealComplete={() => setRevealActive(false)} />
                                        ) : shouldType ? (
                                            <><Markdown content={typedAnswer} /><span className="typing-cursor" /></>
                                        ) : answerReady ? (
                                            <Markdown content={answer || content} />
                                        ) : null}
                                        {isSpeaking && (
                                            <div className="sonnet-speak-overlay">
                                                <VoiceWaveform active />
                                                <span className="sonnet-speak-label">
                                                    {FIBRE_ORAL_LABEL}
                                                    {speakProgress?.total > 1 ? ` · ${speakProgress.current}/${speakProgress.total}` : ''}
                                                </span>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </>
                        )}
                        {ts && (
                            <div className="sonnet-msg-time" title={new Date(ts).toLocaleString()}>
                                {new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                                {!isUser && plain.length > 800 && (
                                    <span className="sonnet-read-time"> · {Math.max(1, Math.round(plain.trim().split(/\s+/).filter(Boolean).length / 200))} min read</span>
                                )}
                            </div>
                        )}
                        {!isUser && role !== 'error' && uiReady && (
                            <>
                                <div className="sonnet-msg-actions">
                                    <button type="button" className="sonnet-action-btn" onClick={copy}><Icon name={copied ? 'check' : 'copy'} size={12} /> {copied ? 'Copied' : 'Copy'}</button>
                                    <button type="button" className={`sonnet-action-btn${isSpeaking ? ' speaking' : ''}`} onClick={() => onSpeak(stripThinking(content))} title={isSpeaking ? 'Stop' : `Listen with ${FIBRE_ORAL_LABEL}`}>
                                        {isSpeaking ? <VoiceWaveform active /> : <Icon name="speaker-high" size={12} />}
                                        {isSpeaking ? 'Stop' : 'Listen'}
                                    </button>
                                    {onRegenerate && <button type="button" className="sonnet-action-btn" onClick={onRegenerate}><Icon name="arrow-clockwise" size={12} /> Retry</button>}
                                    {hasCode && onOpenArtifact && <button type="button" className="sonnet-action-btn" onClick={() => onOpenArtifact(plain)}><Icon name="sidebar-simple" size={12} /> Open</button>}
                                    <span style={{ marginLeft: 4, display: 'inline-flex', gap: 2 }}>
                                    <button type="button" className={`sonnet-action-btn sonnet-reaction-btn${reaction === 'up' ? ' active' : ''}`} title="Good response" onClick={() => { const next = reaction === 'up' ? null : 'up'; setReaction(next); onReaction?.(next); }}>
                                        <Icon name="thumbs-up" size={12} weight={reaction === 'up' ? 'fill' : 'regular'} />
                                    </button>
                                    <button type="button" className={`sonnet-action-btn sonnet-reaction-btn${reaction === 'down' ? ' active down' : ''}`} title="Bad response" onClick={() => { const next = reaction === 'down' ? null : 'down'; setReaction(next); onReaction?.(next); }}>
                                        <Icon name="thumbs-down" size={12} weight={reaction === 'down' ? 'fill' : 'regular'} />
                                    </button>
                                    </span>
                                </div>
                                {isLatest && uiReady && quickReplies?.length > 0 && (
                                    <div className="sonnet-quick-replies">
                                        {quickReplies.map((q, i) => (
                                            <button key={i} type="button" className="sonnet-quick-reply" style={{ animationDelay: `${i * 0.05}s` }} title={q.length > 40 ? q : undefined} onClick={() => onQuickReply(q)}>
                                                <Icon name={getIconForText(q)} size={11} style={{ opacity: 0.65, flexShrink: 0 }} />
                                                {q.length > 48 ? q.slice(0, 45) + '…' : q}
                                            </button>
                                        ))}
                                    </div>
                                )}
                                {isLatestMsg && showTokenUsage && tokenUsage && !isStreaming && (
                                    <div className="sonnet-token-usage">
                                        <Icon name="lightning" size={10} weight="fill" />
                                        {tokenUsage.prompt_tokens?.toLocaleString()} in · {tokenUsage.completion_tokens?.toLocaleString()} out · {(tokenUsage.prompt_tokens + tokenUsage.completion_tokens)?.toLocaleString()} total
                                    </div>
                                )}
                            </>
                        )}
                        {isUser && onEdit && (
                            <div className="sonnet-msg-actions" style={{ opacity: 1 }}>
                                <button type="button" className="sonnet-action-btn" onClick={() => onEdit(content)}><Icon name="pencil-simple" size={12} /> Edit</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const ThinkingIndicator = ({ message, liveContent }) => {
            const [displayed, setDisplayed] = useState('');
            const [elapsed, setElapsed] = useState(0);
            const prevMsgRef = useRef('');
            const startRef = useRef(Date.now());
            useEffect(() => {
                startRef.current = Date.now();
                setElapsed(0);
                const clock = setInterval(() => setElapsed(Math.floor((Date.now() - startRef.current) / 1000)), 1000);
                return () => clearInterval(clock);
            }, []);
            useEffect(() => {
                const target = message || 'Thinking';
                if (target === prevMsgRef.current) return;
                prevMsgRef.current = target;
                setDisplayed('');
                let i = 0;
                const tick = setInterval(() => {
                    i++;
                    setDisplayed(target.slice(0, i));
                    if (i >= target.length) clearInterval(tick);
                }, 26);
                return () => clearInterval(tick);
            }, [message]);
            // Live word count from streaming thinking content
            const liveWords = liveContent ? liveContent.trim().split(/\s+/).filter(Boolean).length : 0;
            return (
                <div className="sonnet-msg assistant no-avatar thinking-indicator">
                    <div className="sonnet-status">
                        <SelvetLogo size={20} active className="sonnet-status-logo" />
                        <span className="sonnet-thinking-text">{displayed}<span className="sonnet-thinking-cursor" /></span>
                        {elapsed >= 3 && <span className="sonnet-thinking-elapsed">{elapsed}s</span>}
                        {liveWords > 0 && <span className="sonnet-thinking-wordcount">{liveWords}w</span>}
                    </div>
                </div>
            );
        };


        const WelcomeScreen = ({ onSuggestion, settings, onOpenPrompts, toolToggles, onToggleTool, history }) => {
            const [suggestions, setSuggestions] = useState([
                { text: 'Explain quantum computing simply', icon: 'atom' },

                { text: 'What happened in the news today?', icon: 'newspaper' },
                { text: 'Help me plan a project timeline', icon: 'calendar-blank' },
            ]);
            const [suggestionsLoading, setSuggestionsLoading] = useState(true);
            const genRef = useRef(0);

            const loadSuggestions = useCallback(async () => {
                const gen = ++genRef.current;
                setSuggestionsLoading(true);
                try {
                    const picks = await generateSelvetPicks(history, settings);
                    if (gen !== genRef.current) return;
                    if (picks.length) {
                        setSuggestions(picks.slice(0, 4).map(p => ({ text: p.prompt, icon: getIconForText(p.label + ' ' + p.prompt) })));
                    }
                } finally {
                    if (gen === genRef.current) setSuggestionsLoading(false);
                }
            }, [history, settings]);

            useEffect(() => {
                loadSuggestions();
                return () => { genRef.current++; };
            }, [loadSuggestions]);

            const pills = [
                { id: 'web', label: 'Web', icon: 'globe', tool: 'web', hint: 'Search the web for real-time information' },
                { id: 'code', label: 'Code', icon: 'code', tool: 'code', hint: 'Optimize for coding and technical tasks' },
                { id: 'vision', label: 'Vision', icon: 'image', tool: 'vision', hint: 'Analyze images — paste or drag to attach' },
            ];
            const h = new Date().getHours();
            const greetWord = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
            const greet = settings?.userName ? `${greetWord}, ${settings.userName}` : greetWord;
            const isReturning = (history || []).filter(c => c.title && !/^(New chat|New thread)$/i.test(c.title)).length >= 3;
            const subtitles = isReturning
                ? ['Pick up where you left off, or start fresh.', 'What are we working on today?', 'Ready when you are.', 'Back again — what\'s on your mind?']
                : ['Thoughtful answers, deep reasoning, and built-in tools.', 'Ask anything. Think deeper. Build faster.', 'Your AI that reasons, creates, and connects.'];
            const subtitleIdx = new Date().getDate() % subtitles.length;
            return (
                <div className="sonnet-welcome">
                    <SelvetLogoHover size={56} />
                    <h1>{greet} — ask <span className="accent">Fibre</span>.</h1>
                    <p>{subtitles[subtitleIdx]}</p>
                    <div className="sonnet-cats">
                        {pills.map(p => (
                            <button key={p.id} type="button" title={p.hint}
                                className={`sonnet-pill${p.tool && toolToggles?.[p.tool] ? ' active' : ''}`}
                                onClick={() => p.action === 'prompts' ? onOpenPrompts() : onToggleTool?.(p.tool)}>
                                <Icon name={p.icon} size={13} /> {p.label}
                            </button>
                        ))}
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, margin: '0 0 12px' }}>
                        <p className="sonnet-pick-sub" style={{ margin: 0 }}>Generated by AI, for you.</p>
                        <button type="button" className="sonnet-icon-btn" title="Refresh suggestions" style={{ padding: '3px', opacity: suggestionsLoading ? 0.4 : 0.7 }}
                            disabled={suggestionsLoading} onClick={loadSuggestions}>
                            <Icon name="arrows-clockwise" size={13} style={suggestionsLoading ? { animation: 'spin 1s linear infinite' } : {}} />
                        </button>
                    </div>
                    <div className="sonnet-suggestions">
                        {(suggestionsLoading ? Array(4).fill(null) : suggestions).map((s, i) => (
                            <button key={i} type="button" className={`sonnet-suggestion${suggestionsLoading ? ' skeleton' : ''}`} disabled={suggestionsLoading}
                                style={suggestionsLoading ? { minHeight: 64, minWidth: 0 } : {}}
                                onClick={() => s && onSuggestion(s.text)}>
                                {s && <span className="sonnet-suggestion-icon"><Icon name={s.icon} size={14} /></span>}
                                <span className="sonnet-suggestion-text">{suggestionsLoading ? '' : s.text}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const CommandPalette = ({ open, onClose, commands }) => {
            const [q, setQ] = useState(''); const [idx, setIdx] = useState(0); const ref = useRef(null);
            const filtered = commands.filter(c => c.label.toLowerCase().includes(q.toLowerCase()) || (c.desc || '').toLowerCase().includes(q.toLowerCase()) || (c.category || '').toLowerCase().includes(q.toLowerCase()));
            useEffect(() => { if (open) { setQ(''); setIdx(0); setTimeout(() => ref.current?.focus(), 40); } }, [open]);
            if (!open) return null;
            const run = (c) => { c.action(); onClose(); };
            // Build grouped list with category headers
            const groups = [];
            let lastCat = null;
            filtered.forEach((c, i) => {
                const cat = c.category || 'General';
                if (cat !== lastCat && !q) { groups.push({ type: 'header', label: cat }); lastCat = cat; }
                groups.push({ type: 'item', cmd: c, flatIdx: i });
            });
            return (
                <div className="sonnet-cmd-overlay" onClick={onClose}>
                    <div className="sonnet-cmd-box" onClick={e => e.stopPropagation()}>
                        <input ref={ref} className="sonnet-cmd-input" placeholder="Search commands…" value={q} onChange={e => { setQ(e.target.value); setIdx(0); }}
                            onKeyDown={e => {
                                if (e.key === 'ArrowDown') { e.preventDefault(); setIdx(i => Math.min(i + 1, filtered.length - 1)); }
                                if (e.key === 'ArrowUp') { e.preventDefault(); setIdx(i => Math.max(i - 1, 0)); }
                                if (e.key === 'Enter' && filtered[idx]) { e.preventDefault(); run(filtered[idx]); }
                                if (e.key === 'Escape') onClose();
                            }} />
                        <div className="sonnet-cmd-list">
                            {filtered.length === 0 && (
                                <div className="sonnet-cmd-empty">
                                    <Icon name="magnifying-glass" size={20} />
                                    <span>No commands match "{q}"</span>
                                </div>
                            )}
                            {groups.map((g, gi) => g.type === 'header'
                                ? <div key={`h-${gi}`} className="sonnet-cmd-category">{g.label}</div>
                                : (
                                    <button key={g.cmd.id} type="button" className={`sonnet-cmd-item ${g.flatIdx === idx ? 'active' : ''}`} onClick={() => run(g.cmd)} onMouseEnter={() => setIdx(g.flatIdx)}>

                                        <div><div style={{ fontWeight: 500, fontSize: 13 }}>{g.cmd.label}</div>{g.cmd.desc && <div style={{ fontSize: 11, color: 'var(--muted2)' }}>{g.cmd.desc}</div>}</div>

                            </div>
                            <div className="sonnet-field">
                                <label>Composer voice input</label>
                                <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
                                    {[{ id: 'fibre', label: FIBRE_ORAL_LABEL }, { id: 'browser', label: 'Browser' }].map(opt => (
                                        <button key={opt.id} type="button"
                                            className={`sonnet-btn-ghost${(draft.sttEngine || 'fibre') === opt.id || (opt.id === 'fibre' && draft.sttEngine === 'whisper') ? ' active' : ''}`}

                                {(draft.sttEngine || 'fibre') !== 'browser' && draft.sttEngine !== 'browser' && (

                                            <div className="sonnet-fibre-oral-sub">Voice in · listen out</div>

                                    </div>

                            </div>
                            <div className="sonnet-settings-divider" />
                            <div className="sonnet-field">
                                <label style={{ display: 'flex', justifyContent: 'space-between' }}>
                                    <span>Frequency penalty</span>
                                    <span style={{ color: 'var(--muted)', fontWeight: 400 }}>{(draft.frequencyPenalty || 0).toFixed(1)}</span>
                                </label>
                                <input type="range" min="0" max="2" step="0.1" value={draft.frequencyPenalty || 0}
                                    onChange={e => setDraft({ ...draft, frequencyPenalty: parseFloat(e.target.value) })}

        const ArtifactPanel = ({ open, onClose, content }) => {

            const blocks = [];
            const re = /```(\w*)\n([\s\S]*?)```/g;
            let m;
            const src = content || '';
            while ((m = re.exec(src)) !== null) blocks.push({ lang: m[1] || 'code', code: m[2] });
            if (!blocks.length) blocks.push({ lang: 'code', code: src });
            const allCode = blocks.map(b => b.code).join('\n\n');
            const copyAll = () => { navigator.clipboard.writeText(allCode); setCopied(true); setTimeout(() => setCopied(false), 2000); };

            return (
                <aside className={`sonnet-artifacts ${open ? '' : 'hidden'}`}>

            const triggerLabel = `${model.label} · ${mode.label}`;

                const estH = menuRef.current?.offsetHeight || 360;
                const base = calcMenuPos(rect, estH, true);
                const left = isMobile ? 8 : Math.min(Math.max(8, rect.right - menuW), window.innerWidth - menuW - 8);
                setFlyoutLeft(!isMobile && left + menuW + 240 > window.innerWidth);
                setPos({ top: base.top, left, width: menuW, up: base.up });
            }, []);

            useLayoutEffect(() => {
                if (!open) return;

                    setOpen(false); setShowMore(false); setShowEffort(false);

        const ChatItemMenu = ({ isStarred, onStar, onRename, onDelete, onDuplicate }) => {

        const SelvetPickPanel = ({ items, loading, hoverIdx, setHoverIdx, onSelect, onClose, onRefresh }) => {
            const panelRef = useRef(null);
            const itemCount = loading ? 0 : (items || []).length;

            useEffect(() => {
                const el = panelRef.current;
                if (!el) return;
                el.focus();
            }, []);

            useEffect(() => {
                const onKey = (e) => {
                    if (loading) return;
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        setHoverIdx(i => (i + 1) % itemCount);
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        setHoverIdx(i => (i - 1 + itemCount) % itemCount);
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        const item = items[hoverIdx];
                        if (item) { onSelect(item.prompt); onClose(); }
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        onClose();
                    }
                };
                document.addEventListener('keydown', onKey);
                return () => document.removeEventListener('keydown', onKey);
            }, [loading, items, hoverIdx, itemCount, onSelect, onClose, setHoverIdx]);

            return (
                <div ref={panelRef} className="sonnet-pick-panel" role="dialog" aria-label="Fibre's choice" tabIndex={-1} style={{ outline: 'none' }}>

        const IDEPanel = ({ workspace, setWorkspace, activeFile, setActiveFile, onClose, onAskAboutFile, onReopenFolder, onShowToast }) => {
            const [expanded, setExpanded] = useState(new Set());

            useEffect(() => {
                if (!workspace?.files) return;
                const paths = Object.keys(workspace.files);
                const tops = new Set();
                paths.forEach(p => {
                    const i = p.indexOf('/');
                    if (i > 0) tops.add(p.slice(0, i));
                });
                setExpanded(tops);
            }, [workspace?.name]);

            if (!workspace) return null;
            const paths = Object.keys(workspace.files).sort();
            const tree = buildIdeTree(paths);
            const content = activeFile ? (workspace.files[activeFile] ?? '') : '';
            const setContent = (val) => {
                if (!activeFile) return;
                setWorkspace(w => ({ ...w, files: { ...w.files, [activeFile]: val } }));
            };

            const toggleFolder = (folderPath) => {
                setExpanded(prev => {
                    const next = new Set(prev);
                    if (next.has(folderPath)) next.delete(folderPath);
                    else next.add(folderPath);
                    return next;
                });
            };

            const fileIcon = (name) => {

                return 'file-text';
            };

            const renderTree = (node, depth = 0) => {
                const dirs = Object.keys(node.dirs).sort();
                const files = [...node.files].sort((a, b) => a.name.localeCompare(b.name));
                return (
                    <>

                                <>
                                    <div className="sonnet-ide-tab">

                                                e.preventDefault();

        const CustomDropdown = ({ value, onChange, options, triggerClass, inline, align = 'left', direction = 'down', placeholder }) => {
            const [open, setOpen] = useState(false);
            const [pos, setPos] = useState({ top: 0, left: 0, width: 220 });
            const triggerRef = useRef(null);
            const menuRef = useRef(null);
            const selected = options.find(o => o.id === value);

            const updatePos = useCallback(() => {
                if (!triggerRef.current) return;
                const r = triggerRef.current.getBoundingClientRect();
                const estH = Math.min(options.length * 48 + 16, 320);
                const preferUp = direction === 'up';
                const base = calcMenuPos(r, estH, preferUp);
                const w = Math.max(r.width, 220);
                const left = align === 'right' ? Math.min(r.right - w, window.innerWidth - w - 8) : base.left;
                setPos({ ...base, left, width: w });
            }, [align, direction, options.length]);

            useLayoutEffect(() => {
                if (!open) return;
                updatePos();
                const close = (e) => {
                    if (triggerRef.current?.contains(e.target) || menuRef.current?.contains(e.target)) return;
                    setOpen(false);
                };
                const onScroll = () => updatePos();
                document.addEventListener('mousedown', close);
                window.addEventListener('resize', updatePos);
                window.addEventListener('scroll', onScroll, true);
                return () => {
                    document.removeEventListener('mousedown', close);
                    window.removeEventListener('resize', updatePos);
                    window.removeEventListener('scroll', onScroll, true);
                };
            }, [open, updatePos]);

            const menu = open ? ReactDOM.createPortal(
                <div ref={menuRef} className={`sonnet-dd-menu${pos.up ? ' up' : ''}`}
                    style={{ top: pos.top, left: pos.left, width: pos.width, maxHeight: 'min(320px, calc(100vh - 24px))', overflowY: 'auto' }}>
                    {options.map(o => (
                        <button key={o.id} type="button"
                            className={`sonnet-dd-item${value === o.id ? ' selected' : ''}`}
                            onClick={() => { onChange(o.id); setOpen(false); }}>
                            <div>
                                <span className="sonnet-dd-item-label">{o.label}</span>
                                {o.sub && <span className="sonnet-dd-item-sub">{o.sub}</span>}
                            </div>
                            {value === o.id && <Icon name="check" size={14} weight="bold" />}
                        </button>
                    ))}
                </div>,
                document.body
            ) : null;

            const cls = inline ? `sonnet-model-inline${open ? ' open' : ''}` : `sonnet-dd-trigger${open ? ' open' : ''} ${triggerClass || ''}`;
            return (
                <div className="sonnet-dd">
                    <button ref={triggerRef} type="button" className={cls} onClick={() => setOpen(o => !o)}>
                        {selected?.label || placeholder || 'Select'}
                        <Icon name="caret-down" size={11} className="sonnet-dd-chevron" />
                    </button>
                    {menu}
                </div>
            );
        };


        const ShortcutsModal = ({ open, onClose }) => {
            if (!open) return null;
            const rows = [
                { keys: ['Ctrl', 'K'], desc: 'Command palette' },
                { keys: ['Ctrl', 'N'], desc: 'New chat' },
                { keys: ['Ctrl', 'F'], desc: 'Search conversation' },
                { keys: ['Ctrl', 'D'], desc: 'Toggle dark mode' },
                { keys: ['Ctrl', 'E'], desc: 'Export transcript' },
                { keys: ['Enter'], desc: 'Send message' },
                { keys: ['Shift', 'Enter'], desc: 'New line' },
                { keys: ['↑'], desc: 'Recall previous message' },
                { keys: ['/'], desc: 'Focus input' },
                { keys: ['?'], desc: 'Keyboard shortcuts' },
                { keys: ['Esc'], desc: 'Close / clear' },

        const EditMessageModal = ({ open, content, onClose, onSave }) => {
            const [draft, setDraft] = useState(content || '');
            const ref = useRef(null);
            useEffect(() => { if (open) { setDraft(content || ''); setTimeout(() => ref.current?.focus(), 50); } }, [open, content]);
            if (!open) return null;
            const charCount = draft.length;
            const wordCount = draft.trim().split(/\s+/).filter(Boolean).length;
            return (
                <div className="sonnet-modal-overlay" onClick={onClose}>
                    <div className="sonnet-modal" onClick={e => e.stopPropagation()}>
                        <div className="sonnet-modal-head">

                            <button type="button" className="sonnet-icon-btn" onClick={onClose}><Icon name="x" size={16} /></button>
                        </div>
                        <div className="sonnet-modal-body">
                            <textarea ref={ref} className="sonnet-edit-textarea" value={draft} onChange={e => setDraft(e.target.value)}
                                onKeyDown={e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); onSave(draft.trim()); } }} />
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 8 }}>
                                <p style={{ fontSize: 11, color: 'var(--muted2)', margin: 0 }}>Ctrl+Enter to save and resend.</p>
                                <span style={{ fontSize: 11, color: charCount > 2000 ? '#ef4444' : 'var(--muted2)' }}>{wordCount}w · {charCount} chars</span>
                            </div>
                        </div>
                        <div className="sonnet-modal-foot">
                            <button type="button" className="sonnet-btn-ghost" onClick={onClose}>Cancel</button>
                            <button type="button" className="sonnet-btn-primary" disabled={!draft.trim()} onClick={() => onSave(draft.trim())}>Save & resend</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        function SelvetApp() {
            const [history, setHistory] = useState(() => JSON.parse(localStorage.getItem('sonnet_history_v5')) || []);
            const [activeChat, setActiveChat] = useState(null);
            const [messages, setMessages] = useState([]);

            const [starredChats, setStarredChats] = useState(() => {

            const [renamingChat, setRenamingChat] = useState(null);
            const [sidebarTab, setSidebarTab] = useState('all'); // 'all' | 'starred'
            const [thinkingMessage, setThinkingMessage] = useState('Processing your request');
            const [listening, setListening] = useState(false);
            const [showScrollBtn, setShowScrollBtn] = useState(false);
            const [unreadCount, setUnreadCount] = useState(0);
            const [toast, setToast] = useState({ visible: false, message: '', type: 'info' });
            const toastQueueRef = useRef([]);
            const toastTimerRef = useRef(null);
            const [placeholderIdx, setPlaceholderIdx] = useState(0);
            const scrollRef = useRef(null);
            const inputRef = useRef(null);
            const freshMsgIdRef = useRef(null);
            const [imageFile, setImageFile] = useState(null);
            const [inputHistory, setInputHistory] = useState([]);
            const [inputHistoryIdx, setInputHistoryIdx] = useState(-1);
            const [quickReplies, setQuickReplies] = useState([]);
            const abortRef = useRef(null);
            const fibreOralCancelRef = useRef(false);
            const fibreOralAbortRef = useRef(null);
            const activeAudioRef = useRef(null);
            const fibreOralKeepAliveRef = useRef(null);
            const voiceRecorderRef = useRef(null);
            const fileInputRef = useRef(null);
            const [sessionVisionMemory, setSessionVisionMemory] = useState(null);
            const [fullModeConvo, setFullModeConvo] = useState(null);
            const [sidebarOpen, setSidebarOpen] = useState(() => {
                const saved = localStorage.getItem('sonnet_sidebar');
                if (saved !== null) return saved === 'true';

            });
            const [commandOpen, setCommandOpen] = useState(false);
            const [artifactOpen, setArtifactOpen] = useState(false);
            const [artifactContent, setArtifactContent] = useState('');
            const [toolToggles, setToolToggles] = useState({ web: true, vision: true, code: false, research: false, json: false });
            const [lastTokenUsage, setLastTokenUsage] = useState(null);
            const [mentionOpen, setMentionOpen] = useState(false);
            const [dragOver, setDragOver] = useState(false);
            const [chatSearchOpen, setChatSearchOpen] = useState(false);
            const [chatSearchQuery, setChatSearchQuery] = useState('');
            const [editModal, setEditModal] = useState({ open: false, content: '', msgIdx: null });
            const chatSearchRef = useRef(null);
            const [ideOpen, setIdeOpen] = useState(false);
            const [ideWorkspace, setIdeWorkspace] = useState(null);
            const [ideActiveFile, setIdeActiveFile] = useState(null);
            const ideFolderRef = useRef(null);
            const [pickOpen, setPickOpen] = useState(false);
            const [pickHover, setPickHover] = useState(0);
            const [selvetPicks, setSelvetPicks] = useState(FALLBACK_SELVET_PICKS);
            const [picksLoading, setPicksLoading] = useState(false);
            const picksGenRef = useRef(0);
            const historyRef = useRef(history);
            const settingsRef = useRef(settings);
            historyRef.current = history;
            settingsRef.current = settings;
            const isHero = messages.length <= 1;

            useEffect(() => {
                if (!('speechSynthesis' in window)) return;
                const warm = () => window.speechSynthesis.getVoices();
                warm();
                window.speechSynthesis.addEventListener('voiceschanged', warm);
                return () => window.speechSynthesis.removeEventListener('voiceschanged', warm);
            }, []);

            const toggleTool = (id) => setToolToggles(t => ({ ...t, [id]: !t[id] }));

            // --- AUTO-GENERATE THREAD TITLE ---
            const generateTitle = async (userMessage, aiResponse) => {
                const msg = userMessage.trim();
                // For very short prompts, lean on AI reply context more heavily
                const userCtx = msg.length < 15
                    ? `User asked: "${msg}". AI replied about: "${(aiResponse || '').slice(0, 220)}"`
                    : `User message: "${msg.slice(0, 260)}"\nAI reply: "${(aiResponse || '').slice(0, 200)}"`;
                const title = await utilApiCall([
                    { role: 'system', content: 'Generate a concise, specific 3-5 word chat thread title that captures the exact topic. Use the most specific noun or action possible — not the genre. Good: "Fix Flask CORS Error", "Schwarzschild Radius Explained", "Paris 3-Day Itinerary", "React useMemo vs useCallback", "Sourdough Starter Troubleshoot". Bad: "Python Help", "Writing Request", "Code Question", "Travel Question". Capitalize each word. Return ONLY the title — no quotes, no punctuation at the end.' },
                    { role: 'user', content: userCtx }
                ], 90);
                return title ? title.replace(/^["']|["']$/g, '').replace(/[.!?]$/, '').trim().slice(0, 54) : null;
            };

            const PLACEHOLDERS = [
                'Message Fibre...',
                'Ask me anything...',
                'What would you like to know?',
                'Type a question or request...',
                'How can I help you today?',
            ];
            // Dynamic placeholder hint based on which tools are on
            const _toolPlaceholder = toolToggles.vision ? 'Describe an image or drop one here…'
                : toolToggles.web ? 'Ask anything — I\'ll search the web…'
                : toolToggles.code ? 'Ask me to write, fix, or explain code…'
                : null;

            useEffect(() => { localStorage.setItem('sonnet_effort', effort); }, [effort]);
            useEffect(() => { localStorage.setItem('sonnet_model', sonnetModel); }, [sonnetModel]);
            useEffect(() => { localStorage.setItem('sonnet_thinking_mode', thinkingMode); }, [thinkingMode]);

            // Rotate placeholder
            useEffect(() => {
                if (input) return;
                const len = messages.length <= 1 ? HERO_PLACEHOLDERS.length : PLACEHOLDERS.length;
                const t = setInterval(() => setPlaceholderIdx(i => (i + 1) % len), 3500);
                return () => clearInterval(t);
            }, [input, messages.length]);

            useEffect(() => {
                if (!pickOpen) return;
                const onKey = (e) => { if (e.key === 'Escape') setPickOpen(false); };
                document.addEventListener('keydown', onKey);
                return () => document.removeEventListener('keydown', onKey);
            }, [pickOpen]);

            const loadSelvetPicks = useCallback(async () => {
                const gen = ++picksGenRef.current;
                setPicksLoading(true);
                try {
                    const picks = await generateSelvetPicks(historyRef.current, settingsRef.current);
                    if (gen !== picksGenRef.current) return;
                    setSelvetPicks(picks?.length ? picks : FALLBACK_SELVET_PICKS);
                } catch {
                    if (gen === picksGenRef.current) setSelvetPicks(FALLBACK_SELVET_PICKS);
                } finally {
                    if (gen === picksGenRef.current) setPicksLoading(false);
                }
            }, []);

            useEffect(() => {
                if (isHero) loadSelvetPicks();
            }, [isHero, loadSelvetPicks]);

            useEffect(() => {
                if (pickOpen) loadSelvetPicks();
            }, [pickOpen, loadSelvetPicks]);

            const loadIdeWorkspace = (name, files) => {
                const sorted = Object.keys(files).sort();
                setIdeWorkspace({ name, files });
                setIdeActiveFile(sorted[0] || null);
                setIdeOpen(true);
                if (!sorted.length) showToast('No readable text files in this folder');
                else showToast(`Opened ${sorted.length} files`);
            };

            const openIdeFolder = async () => {
                try {
                    if (window.showDirectoryPicker) {
                        const dir = await window.showDirectoryPicker();
                        const files = await collectDirEntries(dir);
                        loadIdeWorkspace(dir.name, files);
                    } else {
                        ideFolderRef.current?.click();
                    }
                } catch (e) { if (e.name !== 'AbortError') showToast('Could not open folder'); }
            };

            const handleIdeFolderInput = async (e) => {
                const fileList = e.target.files;
                if (!fileList?.length) return;
                const files = {};
                for (const f of fileList) {
                    const rel = (f.webkitRelativePath || f.name).replace(/\\/g, '/');
                    if (shouldSkipIdePath(rel)) continue;
                    if (shouldReadIdeFile(f.name, f.size)) {
                        try { files[rel] = await f.text(); } catch (err) { /* skip */ }
                    }
                }
                const name = fileList[0].webkitRelativePath?.split('/')[0] || 'Project';
                loadIdeWorkspace(name, files);
                e.target.value = '';
            };

            const askAboutIdeFile = (path, content) => {
                handleSend(`In the IDE workspace, update or improve \`${path}\`. Apply changes using :::ide-edit or :::ide-patch blocks.\n\nCurrent file:\n\`\`\`\n${content.slice(0, 12000)}\n\`\`\``);
            };


            const _drainToastQueue = () => {
                if (toastQueueRef.current.length === 0) { setToast({ visible: false, message: '', type: 'info' }); return; }
                const next = toastQueueRef.current.shift();
                setToast({ visible: true, ...next });
                const dur = next.type === 'error' ? 3800 : 2500;
                toastTimerRef.current = setTimeout(_drainToastQueue, dur);
            };
            const showToast = (message, type = 'info') => {
                if (toastTimerRef.current) {
                    // Queue it — current toast is showing
                    toastQueueRef.current.push({ message, type });
                } else {
                    setToast({ visible: true, message, type });
                    const dur = type === 'error' ? 3800 : 2500;
                    toastTimerRef.current = setTimeout(() => { toastTimerRef.current = null; _drainToastQueue(); }, dur);
                }
            };
            const hideToast = () => { clearTimeout(toastTimerRef.current); toastTimerRef.current = null; toastQueueRef.current = []; setToast({ visible: false, message: '', type: 'info' }); };

            const attachImageFile = (file, fallbackName = 'pasted-image.png') => {
                if (!file?.type?.startsWith('image/')) return false;
                const r = new FileReader();
                r.onload = ev => {
                    setImageFile({ dataUrl: ev.target.result, name: file.name || fallbackName });
                    showToast('Image attached', 'info');
                    inputRef.current?.focus();
                };
                r.readAsDataURL(file);
                return true;
            };

            const attachImageFromClipboard = (clipboardData) => {
                if (!clipboardData) return false;
                const items = clipboardData.items;
                if (items?.length) {
                    for (let i = 0; i < items.length; i++) {
                        const item = items[i];
                        if (item.kind === 'file' && item.type.startsWith('image/')) {
                            const file = item.getAsFile();
                            if (file && attachImageFile(file)) return true;
                        }
                    }
                }
                const files = clipboardData.files;
                if (files?.length) {
                    for (let i = 0; i < files.length; i++) {
                        if (attachImageFile(files[i])) return true;
                    }
                }
                return false;
            };

            useEffect(() => {
                if (!activeChat && history.length === 0) createChat();
                else if (!activeChat && history.length > 0) loadChat(history[0].id);
            }, []);

            useEffect(() => { localStorage.setItem('sonnet_history_v5', JSON.stringify(history)); }, [history]);
            useEffect(() => { localStorage.setItem('sonnet_settings_v1', JSON.stringify(settings)); }, [settings]);
            useEffect(() => {
                localStorage.setItem('sonnet_dark', darkMode);
                document.documentElement.classList.toggle('dark', darkMode);
            }, [darkMode]);
            useEffect(() => { localStorage.setItem('sonnet_starred_v1', JSON.stringify(starredChats)); }, [starredChats]);
            useEffect(() => { localStorage.setItem('sonnet_sidebar', sidebarOpen); }, [sidebarOpen]);

            // Mobile keyboard / visual viewport — keep composer above software keyboard
            useEffect(() => {
                const vv = window.visualViewport;
                if (!vv) return;
                const sync = () => {
                    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
                    document.documentElement.style.setProperty('--keyboard-offset', kb > 40 ? `${kb}px` : '0px');
                };
                sync();
                vv.addEventListener('resize', sync);
                vv.addEventListener('scroll', sync);
                return () => { vv.removeEventListener('resize', sync); vv.removeEventListener('scroll', sync); document.documentElement.style.removeProperty('--keyboard-offset'); };
            }, []);

            // Collapse sidebar drawer when entering mobile breakpoint
            useEffect(() => {
                const mq = window.matchMedia('(max-width: 900px)');
                const onChange = () => { if (mq.matches) setSidebarOpen(false); };
                mq.addEventListener('change', onChange);
                return () => mq.removeEventListener('change', onChange);
            }, []);

            // Cleanup sidebar debounce timer on unmount
            useEffect(() => () => { clearTimeout(sidebarSearchTimerRef.current); }, []);

            const toggleStar = (e, id) => {
                e.stopPropagation();
                setStarredChats(prev => prev.includes(id) ? prev.filter(s => s !== id) : [...prev, id]);
            };

            const startRename = (e, id) => {
                e.stopPropagation();
                setRenamingChat(id);
            };

            const finishRename = (id, val) => {
                const v = val.trim();
                if (v) setHistory(h => h.map(c => c.id === id ? { ...c, title: v } : c));
                setRenamingChat(null);
            };

            const saveSettings = (newSettings) => {
                setSettings(newSettings);
            };

            const getCustomSystemPrompt = () => {
                let extra = '';
                if (settings.customInstructions) extra += `\n\nUSER INSTRUCTIONS (high priority):\n${settings.customInstructions}`;
                if (settings.userName) extra += `\n\nThe user's name is ${settings.userName}. Use their name sparingly — only when it feels natural. Do NOT open every message with their name.`;
                return extra;
            };

            const stickToBottomRef = useRef(true);
            // Persist scroll position per chat so returning to a thread feels continuous
            const chatScrollPosRef = useRef({});

            const scrollToBottomIfNeeded = useCallback((force) => {
                const el = scrollRef.current;
                if (!el) return;
                const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 140;
                if (force || stickToBottomRef.current || nearBottom || processing) {
                    el.scrollTop = el.scrollHeight;
                    stickToBottomRef.current = true;
                }
            }, [processing]);

            // Auto-scroll on new messages
            useLayoutEffect(() => {
                scrollToBottomIfNeeded(processing);
            }, [messages, processing, fullModeConvo, scrollToBottomIfNeeded]);

            // Auto-scroll as typewriter / layout grows (ResizeObserver)
            useEffect(() => {
                const el = scrollRef.current;
                const inner = el?.querySelector('.sonnet-messages-inner');
                if (!inner) return;
                const ro = new ResizeObserver(() => scrollToBottomIfNeeded(processing));
                ro.observe(inner);
                return () => ro.disconnect();
            }, [activeChat, processing, scrollToBottomIfNeeded]);

            // Scroll-to-bottom detection + scroll position memory
            useEffect(() => {
                const el = scrollRef.current;
                if (!el) return;
                const handleScroll = () => {
                    const isNearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 100;
                    stickToBottomRef.current = isNearBottom;
                    const shouldShow = !isNearBottom && messages.length > 2;
                    setShowScrollBtn(shouldShow);
                    if (isNearBottom) setUnreadCount(0);
                    // Save scroll position for this chat (not while processing — position is in flux)
                    if (!processing && activeChat) {
                        chatScrollPosRef.current[activeChat] = el.scrollTop;
                    }
                };
                el.addEventListener('scroll', handleScroll);
                return () => el.removeEventListener('scroll', handleScroll);
            }, [messages.length, processing, activeChat]);

            // Auto-focus input after response
            useEffect(() => {
                if (!processing && inputRef.current) {
                    setTimeout(() => inputRef.current?.focus(), 100);
                }
            }, [processing]);

            // Keyboard shortcuts
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && settingsOpen) { setSettingsOpen(false); return; }
                    if (e.key === 'Escape' && chatSearchOpen) { setChatSearchOpen(false); setChatSearchQuery(''); return; }
                    if (e.key === 'Escape' && editModal.open) { setEditModal({ open: false, content: '', msgIdx: null }); return; }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'f' && messages.length > 2) {
                        e.preventDefault(); setChatSearchOpen(true);
                        setTimeout(() => chatSearchRef.current?.focus(), 40);
                        return;
                    }
                    if (e.key === 'Escape' && input) { setInput(''); if (inputRef.current) inputRef.current.style.height = 'auto'; }
                    if (e.key === '/' && !input && document.activeElement !== inputRef.current) { e.preventDefault(); inputRef.current?.focus(); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'd' && document.activeElement !== inputRef.current) {
                        e.preventDefault(); setDarkMode(d => !d);
                    }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'e' && messages.length > 2) {
                        e.preventDefault(); exportTranscript();
                    }
                };
                document.addEventListener('keydown', handleKeyDown);
                return () => document.removeEventListener('keydown', handleKeyDown);
            }, [input, settingsOpen, chatSearchOpen, editModal.open, messages.length]);

            const scrollToBottom = () => {
                scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior: 'smooth' });
            };

            const sidebarListRef = useRef(null);
            const chatSliderRef = useRef(null);
            const [intro, setIntro] = useState(true);
            const createChat = () => {
                const newChat = { id: Date.now().toString(), title: 'New thread', messages: [{ role: 'system_display', content: 'init' }], timestamp: Date.now() };
                setHistory(prev => [newChat, ...prev]);
                setActiveChat(newChat.id);
                setMessages(newChat.messages);
                setQuickReplies([]);
                if (window.innerWidth <= 900) setSidebarOpen(false);
                setSessionVisionMemory(null);
                // Scroll sidebar list to top so new chat is visible
                setTimeout(() => { if (sidebarListRef.current) sidebarListRef.current.scrollTop = 0; }, 60);
            };

            const [chatTransitionKey, setChatTransitionKey] = useState(0);
            const loadChat = (id) => {
                const chat = history.find(c => c.id === id);
                if (chat) {
                    // Save current chat's scroll position before switching
                    if (activeChat && scrollRef.current) {
                        chatScrollPosRef.current[activeChat] = scrollRef.current.scrollTop;
                    }
                    const cleanMsgs = chat.messages.map(m => m.streaming ? { ...m, streaming: false } : m);
                    freshMsgIdRef.current = null;
                    // Reset scroll-lock so restored position isn't immediately overridden by auto-scroll
                    stickToBottomRef.current = false;
                    setChatTransitionKey(k => k + 1);
                    setActiveChat(id);
                    setMessages(cleanMsgs);
                    if (window.innerWidth <= 900) setSidebarOpen(false);
                    setSessionVisionMemory(null);
                    setQuickReplies([]);
                    // Restore saved scroll position (defer until after messages paint)
                    const savedPos = chatScrollPosRef.current[id];
                    if (savedPos != null && scrollRef.current) {
                        setTimeout(() => {
                            if (scrollRef.current) scrollRef.current.scrollTop = savedPos;
                        }, 60);
                    }
                }
            };

            const deleteChat = (e, id) => {
                e.stopPropagation();
                const next = history.filter(c => c.id !== id);
                setHistory(next);
                // Only navigate away if the deleted chat was active; verify it actually exists before loading
                if (activeChat === id) {
                    const safeNext = next.find(c => c.id !== id);
                    safeNext ? loadChat(safeNext.id) : createChat();
                }
            };

            const toggleVoice = async () => {
                if (listening) {
                    const rec = voiceRecorderRef.current;
                    if (rec?.mediaRecorder?.state === 'recording') rec.mediaRecorder.stop();
                    else setListening(false);
                    return;
                }
                const useFibreOral = (settings.sttEngine || 'fibre') !== 'browser';
                if (useFibreOral && navigator.mediaDevices?.getUserMedia) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
