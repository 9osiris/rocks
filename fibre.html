                        const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
                        const mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
                        const chunks = [];
                        mediaRecorder.ondataavailable = (e) => { if (e.data?.size) chunks.push(e.data); };
                        mediaRecorder.onstop = async () => {
                            stream.getTracks().forEach(t => t.stop());
                            voiceRecorderRef.current = null;
                            setListening(false);
                            if (!chunks.length) return;
                            const blob = new Blob(chunks, { type: mime });
                            const text = await transcribeFibreOral(blob);
                            if (text) setInput(prev => (prev ? `${prev} ${text}` : text));
                            else showToast('Could not transcribe audio', 'error');
                        };
                        voiceRecorderRef.current = { mediaRecorder, stream };
                        mediaRecorder.start();
                        setListening(true);
                        setTimeout(() => {
                            if (voiceRecorderRef.current?.mediaRecorder?.state === 'recording') {
                                voiceRecorderRef.current.mediaRecorder.stop();
                            }
                        }, 28000);
                        return;
                    } catch (e) {
                        console.warn('[Fibre Oral] mic fallback:', e);
                    }
                }
                if (!('webkitSpeechRecognition' in window)) return alert('Voice input requires a Chromium browser or microphone permission.');
                const recognition = new window.webkitSpeechRecognition();
                recognition.continuous = false; recognition.lang = 'en-US';
                recognition.onstart = () => setListening(true);
                recognition.onend = () => setListening(false);
                recognition.onresult = (e) => setInput(prev => (prev ? prev + ' ' : '') + e.results[0][0].transcript);
                recognition.start();
            };

            const [speakingIdx, setSpeakingIdx] = React.useState(null);
            const [speakProgress, setSpeakProgress] = React.useState(null);

            const stopSpeaking = () => {
                fibreOralCancelRef.current = true;
                fibreOralAbortRef.current?.abort();
                fibreOralAbortRef.current = null;
                if (fibreOralKeepAliveRef.current) {
                    clearInterval(fibreOralKeepAliveRef.current);
                    fibreOralKeepAliveRef.current = null;
                }
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                const audio = activeAudioRef.current;
                if (audio) { audio.pause(); audio.src = ''; activeAudioRef.current = null; }
                setSpeakingIdx(null);
                setSpeakProgress(null);
            };

            const playFibreOralWav = (buffer, signal) => new Promise((resolve, reject) => {
                const blob = new Blob([buffer], { type: 'audio/wav' });
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                activeAudioRef.current = audio;
                const cleanup = (fn) => {
                    URL.revokeObjectURL(url);
                    if (activeAudioRef.current === audio) activeAudioRef.current = null;
                    fn();
                };
                const onAbort = () => { audio.pause(); cleanup(() => reject(new DOMException('Aborted', 'AbortError'))); };
                signal?.addEventListener('abort', onAbort, { once: true });
                audio.onended = () => { signal?.removeEventListener('abort', onAbort); cleanup(resolve); };
                audio.onerror = () => { signal?.removeEventListener('abort', onAbort); cleanup(() => reject(new Error('Playback failed'))); };
                audio.play().catch(e => cleanup(() => reject(e)));
            });

            const speakBrowserFallback = (text, idx) => {
                if (!('speechSynthesis' in window)) return false;
                window.speechSynthesis.cancel();
                const chunks = chunkTextForSpeech(text, 220);
                if (!chunks.length) return false;
                fibreOralCancelRef.current = false;
                setSpeakingIdx(idx);
                let chunkIdx = 0;
                const finish = () => {
                    if (fibreOralKeepAliveRef.current) { clearInterval(fibreOralKeepAliveRef.current); fibreOralKeepAliveRef.current = null; }
                    setSpeakingIdx(null);
                    setSpeakProgress(null);
                };
                const speakNext = () => {
                    if (fibreOralCancelRef.current || chunkIdx >= chunks.length) { finish(); return; }
                    const utter = new SpeechSynthesisUtterance(chunks[chunkIdx++]);
                    setSpeakProgress({ current: chunkIdx, total: chunks.length });
                    utter.rate = 0.96;
                    const v = pickBrowserVoice();
                    if (v) utter.voice = v;
                    utter.onend = speakNext;
                    utter.onerror = finish;
                    window.speechSynthesis.speak(utter);
                };
                fibreOralKeepAliveRef.current = setInterval(() => {
                    if (window.speechSynthesis.speaking) { window.speechSynthesis.pause(); window.speechSynthesis.resume(); }
                }, 8000);
                setTimeout(speakNext, 32);
                return true;
            };

            const speakFibreOralNeural = async (text, idx, voice) => {
                const chunks = chunkTextForSpeech(text);
                if (!chunks.length) return false;
                const ctrl = new AbortController();
                fibreOralAbortRef.current = ctrl;
                fibreOralCancelRef.current = false;
                setSpeakingIdx(idx);
                setSpeakProgress({ current: 0, total: chunks.length });
                let played = false;
                try {
                    for (let i = 0; i < chunks.length; i++) {
                        if (ctrl.signal.aborted || fibreOralCancelRef.current) break;
                        let line = chunks[i];
                        if (i === 0 && !/\[[\w\s]+\]/.test(line)) line = `[warm] ${line}`;
                        setSpeakProgress({ current: i + 1, total: chunks.length });
                        const result = await fetchFibreOralAudio(line, voice, ctrl.signal);
                        if (result.aborted || ctrl.signal.aborted) break;
                        if (!result.ok || !result.buffer) break;
                        await playFibreOralWav(result.buffer, ctrl.signal);
                        played = true;
                    }
                } catch (e) {
                    if (e.name !== 'AbortError') console.warn('[Fibre Oral]', e);
                } finally {
                    if (fibreOralAbortRef.current === ctrl) fibreOralAbortRef.current = null;
                    if (!fibreOralCancelRef.current) {
                        setSpeakingIdx(null);
                        setSpeakProgress(null);
                    }
                }
                return played && !fibreOralCancelRef.current;
            };

            const speakText = (text, idx) => {
                if (speakingIdx === idx) { stopSpeaking(); return; }
                const clean = stripMarkdownForSpeech(text);
                if (!clean.trim()) { showToast('Nothing to read in this message', 'error'); return; }
                stopSpeaking();
                const voice = settings.fibreOralVoice || settings.ttsVoice || 'hannah';
                (async () => {
                    const ok = await speakFibreOralNeural(clean, idx, voice);
                    if (!ok && !fibreOralCancelRef.current) {
                        if (!speakBrowserFallback(clean, idx)) {
                            showToast(`${FIBRE_ORAL_LABEL} could not play audio`, 'error');
                        }
                    }
                })();
            };

            const runLiveVoiceTurn = async (transcript) => {
                const userPrompt = transcript.trim();
                if (!userPrompt) return '';
                const userMsg = { role: 'user', content: userPrompt, ts: Date.now() };
                const tempMsgs = [...messages, userMsg];
                setMessages(tempMsgs);
                setHistory(h => h.map(c => c.id === activeChat ? { ...c, messages: tempMsgs, title: c.title === 'New thread' || c.title === 'New chat' ? (userPrompt.slice(0, 36) + (userPrompt.length > 36 ? '…' : '')) : c.title } : c));
                const systemPrompt = FIBRE_LIVE_SYSTEM + VOICE_LIVE_PROMPT;
                const convo = tempMsgs.filter(m => m.role === 'user' || m.role === 'assistant').slice(-10);
                const apiMsgs = [
                    { role: 'system', content: systemPrompt },
                    ...convo.map(m => ({ role: m.role, content: stripThinking(m.content) })),
                ];
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${API_KEY}` },
                        body: JSON.stringify({ model: FIBRE_LIVE_MODEL, messages: apiMsgs, temperature: 0.82, max_tokens: 120 }),
                    });
                    if (!res.ok) return '';
                    const data = await res.json();
                    const raw = data.choices?.[0]?.message?.content || '';
                    const answer = stripThinking(raw).trim();
                    if (!answer) return '';
                    const asst = { role: 'assistant', content: answer, ts: Date.now() };
                    const final = [...tempMsgs, asst];
                    setMessages(final);
                    setHistory(h => h.map(c => c.id === activeChat ? { ...c, messages: final } : c));
                    return stripMarkdownForSpeech(answer);
                } catch (e) {
                    console.warn('[Fibre Live]', e);
                    return '';
                }
            };

            const speakLiveText = async (text) => {
                const clean = stripMarkdownForSpeech(text);
                if (!clean.trim()) return false;
                stopSpeaking();
                const voice = settings.fibreOralVoice || settings.ttsVoice || 'hannah';
                const ok = await speakFibreOralNeural(clean, 'live', voice);
                if (!ok && !fibreOralCancelRef.current) return speakBrowserFallback(clean, 'live');
                return ok;
            };

            const handleSend = async (manualInput = null, _unused = null, _isEdited = false) => {
                const rawText = typeof manualInput === 'string' ? manualInput : input;
                const userPrompt = rawText.trim().replace(/\s{3,}/g, '\n\n');
                const hadImage = !!imageFile;
                // Use what the user typed; only fall back when they send an image with no message
                const effectivePrompt = userPrompt || (hadImage ? 'What is in this image?' : '');
                if (!effectivePrompt || processing) return;
                if (!hadImage && effectivePrompt.length < 1) return;

                const currentModel = SONNET_MODELS[sonnetModel];
                // Detect continuation messages — "continue", "go on", "more", etc.
                // In adaptive mode these should inherit the previous response's depth rather than resetting
                const _isContinuation = /^(continue|go on|keep going|more|elaborate|expand|go ahead|carry on|and then|what else|what next|finish it|keep writing|don't stop|next|proceed)\.?!?$/i.test(effectivePrompt.trim());
                const _prevThinkingMode = messages.slice().reverse().find(m => m.role === 'assistant')?._thinkingMode;
                const activeThinkingMode = thinkingMode === 'adaptive'
                    ? (_isContinuation && _prevThinkingMode ? _prevThinkingMode : detectAdaptiveThinking(effectivePrompt))
                    : thinkingMode;
                const currentThinking = THINKING_MODES[activeThinkingMode] || THINKING_MODES.thinking;
                const isFirstMessage = messages.length <= 1;
                if (effectivePrompt !== inputHistory[0]) setInputHistory(prev => [effectivePrompt, ...prev.slice(0, 49)]);
                setInputHistoryIdx(-1);
                setQuickReplies([]);
                // Create thumbnail for display (does NOT affect API payload)
                let imageThumb = null;
                if (imageFile) {
                    imageThumb = await makeThumbnail(imageFile.dataUrl).catch(() => null);
                }
                // User message: show what they typed; fall back to the effective prompt for image-only sends
                const userMsgContent = userPrompt || (hadImage ? effectivePrompt : '');
                const userMsg = { role: 'user', content: userMsgContent, ts: Date.now(), ...(imageThumb ? { imageThumb } : {}), ...(_isEdited ? { _edited: true } : {}) };
                let tempMsgs = [...messages, userMsg];
                setMessages(tempMsgs);
                setInput('');
                setProcessing(true);
                stopSpeaking();
                setFullModeConvo(null);
                if(inputRef.current) inputRef.current.style.height = 'auto';

                // Temporary title until AI generates a proper one
                if (isFirstMessage) {
                    const tempTitle = effectivePrompt.length > 32 ? effectivePrompt.slice(0, 32) + '...' : effectivePrompt;
                    setHistory(h => h.map(c => c.id === activeChat ? { ...c, title: tempTitle } : c));
                }

                try {
                    // Status message reflects the user's actual question while vision runs
                    if (!currentThinking.multiModel) {
                        generateThinkingMessage(effectivePrompt).then(msg => setThinkingMessage(msg));
                    }

                    // Vision analysis if image attached — guided by what the user asked
                    let visionContext = '';
                    let visionFailed = false;
                    if (imageFile && toolToggles.vision) {
                        const capturedDataUrl = imageFile.dataUrl;
                        setImageFile(null);
                        visionContext = await analyzeImage(capturedDataUrl, effectivePrompt) || '';
                        if (visionContext) {
                            // Pin description to this message so follow-up turns can reference it
                            tempMsgs = tempMsgs.map((m, i) =>
                                i === tempMsgs.length - 1 ? { ...m, visionData: visionContext } : m
                            );
                            setSessionVisionMemory(visionContext);
                        } else {
                            visionFailed = true;
                        }
                    } else if (imageFile) {
                        setImageFile(null);
                    }

                    const toolContext = (toolToggles.web || toolToggles.research) ? await checkTools(effectivePrompt) : '';

                    // Build a short context hash from the last assistant reply (prevents cross-conversation cache collisions)
                    const _lastAiContent = messages.slice().reverse().find(m => m.role === 'assistant')?.content || '';
                    const _ctxHash = _miniHash(_lastAiContent);

                    // Cache hit — skip API call for repeated identical prompts without image/tool context
                    if (!imageFile && !toolContext && !visionContext && !currentThinking.multiModel) {
                        const cached = getCachedResponse(effectivePrompt, sonnetModel, activeThinkingMode, _ctxHash);
                        if (cached) {
                            const finalMsgs = [...tempMsgs, { role: 'assistant', content: cached, ts: Date.now() }];
                            setMessages(finalMsgs);
                            setHistory(h => h.map(c => c.id === activeChat ? { ...c, messages: finalMsgs } : c));
                            setProcessing(false);
                            if (settings.showQuickReplies !== false) {
                                generateQuickReplies(stripThinking(cached), effectivePrompt).then(replies => {
                                    if (replies.length) setQuickReplies(replies);
                                });
                            }
                            return;
                        }
                    }

                    const customChunk = getCustomSystemPrompt();
                let systemPrompt = getBasePrompt(settings) + customChunk + currentModel.prompt + currentThinking.prompt;
                    if (toolToggles.code) systemPrompt += '\n\nCODE MODE: You are in code expert mode. Prioritize complete, runnable code examples, best practices, and clear explanations.';
                    if (toolToggles.research) systemPrompt += '\n\nRESEARCH MODE: Provide thorough, well-sourced analysis. Use live data when available. Explore multiple perspectives and cite facts clearly.';
                    if (toolToggles.json) systemPrompt += '\n\nJSON MODE: Respond with valid JSON only. No markdown fences, no prose outside the JSON object.';
                    
                // multiModel parallel block runs after conversationMsgs — see below

                const resolvedModelForPrompt = currentThinking.model || currentModel.model;
                const hasNativeReasoning = resolvedModelForPrompt.startsWith('openai/gpt-oss');
                if (currentThinking.thinking) {
                    systemPrompt += THINKING_CTRL_PROMPT;
                    systemPrompt += `\n\nReasoning depth: ${getThinkingDepthHint(effectivePrompt, activeThinkingMode)}`;
                }

                    // Build clean conversation history — strips display artifacts before sending
                    const cleanForApi = (content) => stripThinking(content)
                        .replace(/ ?📎/g, '')                                            // image indicator
                        .replace(/\[Vision context from attached image:[\s\S]*?\]/g, '') // injected vision context
                        .replace(/\[The user attached an image[\s\S]*?\]/g, '')         // failed vision note
                        .replace(/\[REAL-TIME[\s\S]*?\]/g, '')                         // tool context that leaked
                        .replace(/\[Vision context:[\s\S]*?\]/g, '')
                        .trim();

                    // Long-context truncation: keep the first 2 messages for continuity + last N
                    const allConvMsgs = messages.filter(m => m.role === 'user' || m.role === 'assistant');
                    const CONTEXT_WINDOW = 24;
                    const wasTruncated = allConvMsgs.length > CONTEXT_WINDOW + 2;
                    const trimmedMsgs = wasTruncated
                        ? [...allConvMsgs.slice(0, 2), ...allConvMsgs.slice(-CONTEXT_WINDOW)]
                        : allConvMsgs;
                    // Inject truncation notice into the systemPrompt instead of polluting message roles
                    if (wasTruncated) {
                        const skipped = allConvMsgs.length - CONTEXT_WINDOW - 2;
                        systemPrompt += `\n\nCONVERSATION CONTEXT: This is a long conversation. ${skipped} middle message(s) have been omitted to fit context. The first exchange and the most recent ${CONTEXT_WINDOW} messages are included. Maintain consistency with everything shown.`;
                    }
                    const conversationMsgs = trimmedMsgs
                        .filter(m => m.role === 'user' || m.role === 'assistant')
                        .slice(-40)
                        .map(m => {
                            const clean = cleanForApi(m.content);
                            // Re-inject stored image description so the AI can reference it in follow-ups
                            if (m.visionData) {
                                return { role: m.role, content: `[Image attached — description: ${m.visionData}]\n\n${clean}`.trim() };
                            }
                            return { role: m.role, content: clean };
                        })
                        .filter(m => m.content.length > 0);

                    // Continuity anchor + active image memory pin
                    if (conversationMsgs.length > 0) {
                        systemPrompt += `\n\nCONTINUITY: You are mid-conversation. Maintain complete consistency with everything previously said regardless of mode or model changes.`;
                    }

                    // Short follow-up detection — anchor ambiguous short messages to the last AI response
                    const followUpWords = effectivePrompt.trim().split(/\s+/).length;
                    const isFollowUp = followUpWords <= 5 && /^(why|how|what|when|who|where|explain|more|elaborate|example|examples|prove|show me|continue|go on|keep going|and\?|but why|so\?|really\?|how so|what if|ok but|wait|huh|seriously|give me one|another one|what about|what does that mean|what else|what next|can you|tell me|expand|detail|clarify|any other|is that|are you sure|are there|does it|do they|could you)/i.test(effectivePrompt.trim());
                    if (isFollowUp && conversationMsgs.length >= 2) {
                        const lastAi = conversationMsgs.slice().reverse().find(m => m.role === 'assistant');
                        if (lastAi) {
                            systemPrompt += `\n\nFOLLOW-UP: The user's short message "${effectivePrompt}" almost certainly refers to your previous response. For context, your previous response began: "${lastAi.content.slice(0, 350).replace(/\n+/g, ' ')}"`;
                        }
                    }

                    // Tone consistency — detect the conversation's register and reinforce it
                    if (conversationMsgs.length >= 4) {
                        const userMsgs = conversationMsgs.filter(m => m.role === 'user');
                        const totalLen = userMsgs.reduce((s, m) => s + m.content.length, 0);
                        const avgLen = totalLen / Math.max(userMsgs.length, 1);
                        const allShortCasual = avgLen < 60 && !userMsgs.some(m => /```|\b(function|class|algorithm|implement|architecture)\b/i.test(m.content));
                        const allTechnical = userMsgs.some(m => /```|\b(function|class|algorithm|API|SQL|regex|async|runtime|complexity)\b/i.test(m.content));
                        if (allShortCasual) systemPrompt += `\n\nTONE: This conversation has been casual and conversational throughout. Keep that register — concise, relaxed, no unnecessary structure.`;
                        else if (allTechnical) systemPrompt += `\n\nTONE: This conversation has been technical. Stay precise and structured.`;
                    }
                    if (sessionVisionMemory) {
                        systemPrompt += `\n\nACTIVE IMAGE: The user shared an image earlier this session. Its description: ${sessionVisionMemory}\nWhen the user asks anything visual or references the image, use this description — do not say you cannot see it.`;
                    }
                    if (ideOpen && ideWorkspace?.files && Object.keys(ideWorkspace.files).length > 0) {
                        systemPrompt += buildIdeWorkspacePrompt(ideWorkspace, ideActiveFile);
                    }

                    // ===== FULL MODE: parallel sub-agents → writer synthesis =====
                    const abortCtrl = new AbortController();
                    abortRef.current = abortCtrl;

                    let savedFullModeTurns = null;
                    let fullModeAgentContext = null;
                    if (currentThinking.multiModel) {
                        try {
                            const fmcHistory = [
                                ...conversationMsgs,
                                { role: 'user', content: [toolContext || '', effectivePrompt].filter(Boolean).join('\n\n') }
                            ];
                            const agentBasePrompt = getBasePrompt(settings) + customChunk;

                            const streamTurn = async (model, messages, extra, onChunk) => {
                                const modelsToTry = [model, LLAMA_70B, AI_MODEL, FAST_MODEL, HARMONIC_MODEL].filter((m, i, a) => m && a.indexOf(m) === i);
                                const thinkingOpts = { thinking: model.startsWith('qwen/') || model.startsWith('openai/gpt-oss'), effort: 'medium' };
                                const result = await streamGroqChat({
                                    models: modelsToTry,
                                    messages,
                                    keys: [API_KEY, FALLBACK_KEY, UTIL_KEY, ...COMPLETE_FALLBACK_KEYS],
                                    signal: abortCtrl.signal,
                                    temperature: 0.65,
                                    extra,
                                    mode: 'both',
                                    thinkingOpts,
                                    onChunk: ({ content, reasoning }) => {
                                        if (!content && !reasoning) return;
                                        let dReasoning = reasoning || '';
                                        let dAnswer = content || '';
                                        if (!dReasoning && content) {
                                            const ex = extractThinking(content);
                                            dReasoning = ex.thinking;
                                            dAnswer = ex.answer || stripThinking(content);
                                        } else if (reasoning && content) {
                                            dAnswer = stripThinking(content);
                                        }
                                        onChunk({ reasoning: dReasoning, answer: dAnswer });
                                    },
                                });
                                if (!result) return { reasoning: '', answer: '' };
                                let finalReasoning = result.thinking?.trim() || '';
                                let finalAnswer = result.content?.trim() || '';
                                if (!finalReasoning && finalAnswer) {
                                    const ex = extractThinking(finalAnswer);
                                    finalReasoning = ex.thinking;
                                    finalAnswer = ex.answer || stripThinking(finalAnswer);
                                }
                                if (!finalAnswer && finalReasoning) {
                                    const mini = await streamGroqChat({
                                        models: [FAST_MODEL, LLAMA_70B, AI_MODEL],
                                        messages: [
                                            { role: 'system', content: 'Turn the internal reasoning into a clear, substantive expert answer. No thinking tags.' },
                                            { role: 'user', content: `Question:\n${effectivePrompt}\n\nReasoning:\n${finalReasoning.slice(0, 8000)}` },
                                        ],
                                        keys: [API_KEY, FALLBACK_KEY, UTIL_KEY, ...COMPLETE_FALLBACK_KEYS],
                                        signal: abortCtrl.signal,
                                        temperature: 0.65,
                                        mode: 'content',
                                        thinkingOpts: { thinking: false },
                                    });
                                    finalAnswer = mini?.content?.trim() || '';
                                }
                                return { reasoning: finalReasoning, answer: finalAnswer || stripThinking(result.content || '') };
                            };

                            const initAgents = SUB_AGENTS.map(a => ({ ...a, reasoning: '', answer: '', done: false }));
                            setFullModeConvo({ active: true, phase: 'agents', agents: initAgents });
                            setThinkingMessage('Running sub-agents in parallel…');

                            const agentResults = await Promise.all(SUB_AGENTS.map(async (agent, idx) => {
                                try {
                                    const result = await streamTurn(
                                        agent.model,
                                        [{ role: 'system', content: agentBasePrompt + '\n\n' + agent.prompt },
                                         ...fmcHistory],
                                        { top_p: 0.9 },
                                        ({ reasoning, answer }) => {
                                            setFullModeConvo(prev => {
                                                if (!prev?.agents) return prev;
                                                const agents = prev.agents.map((ag, i) => i === idx ? { ...ag, reasoning, answer } : ag);
                                                return { ...prev, agents };
                                            });
                                        }
                                    );
                                    setFullModeConvo(prev => {
                                        if (!prev?.agents) return prev;
                                        const agents = prev.agents.map((ag, i) => i === idx ? { ...ag, ...result, done: true } : ag);
                                        return { ...prev, agents };
                                    });
                                    return { ...agent, ...result };
                                } catch (e) {
                                    console.warn(`[Full mode] ${agent.name} error:`, e);
                                    setFullModeConvo(prev => {
                                        if (!prev?.agents) return prev;
                                        const agents = prev.agents.map((ag, i) => i === idx ? { ...ag, answer: '(Agent unavailable)', done: true } : ag);
                                        return { ...prev, agents };
                                    });
                                    return { ...agent, reasoning: '', answer: '', done: true };
                                }
                            }));

                            savedFullModeTurns = agentResults.map(a => ({ role: a.name, reasoning: a.reasoning, answer: a.answer }));
                            const hasAny = agentResults.some(a => a.reasoning || a.answer);
                            if (hasAny) {
                                setThinkingMessage('Synthesizing agent outputs…');
                                setFullModeConvo(prev => prev ? { ...prev, phase: 'synthesizing' } : prev);
                                fullModeAgentContext = agentResults
                                    .filter(a => a.reasoning || a.answer)
                                    .map(a => `[${a.name} — reasoning]:\n${a.reasoning || '(none)'}\n\n[${a.name} — answer]:\n${a.answer || '(none)'}`)
                                    .join('\n\n');
                            } else {
                                setFullModeConvo(null);
                            }
                        } catch (e) {
                            console.warn('[Full mode] Conversation error:', e);
                            setFullModeConvo(null);
                        }
                    }

                    const apiMessages = [
                        { role: "system", content: systemPrompt },
                        ...conversationMsgs,
                        { role: "user", content: [toolContext ? `${toolContext}` : '', visionContext ? `[Vision context from attached image: ${visionContext}]` : visionFailed ? `[The user attached an image but the visual analysis service is currently unavailable. Acknowledge this warmly and offer to help in other ways.]` : '', effectivePrompt].filter(Boolean).join('\n\n') }
                    ];

                    // Smart fast-model routing: trivial queries in adaptive/instant mode use FAST_MODEL
                    const _isTrivialQuery = activeThinkingMode === 'instant' && !toolContext && !visionContext && !imageFile && effectivePrompt.trim().split(/\s+/).length <= 8 && !/```/.test(effectivePrompt);
                    // --- MODEL-SPECIFIC API PARAM BUILDER ---
                    const useModel = _isTrivialQuery ? FAST_MODEL : (currentThinking.model || currentModel.model);

                    const buildApiBody = (model, stream = false) => {
                        const isGptOss = model.startsWith('openai/gpt-oss');
                        const isQwen = model.startsWith('qwen/');
                        const temp = currentThinking.temperature;
                        const effortCfg = EFFORT_LEVELS.find(e => e.id === effort) || EFFORT_LEVELS[1];
                        const baseBody = {
                            model,
                            messages: apiMessages,
                            max_tokens: 8192,
                            temperature: temp,
                            stream,
                        };
                        if (stream) baseBody.stream_options = { include_usage: true };
                        if (settings.seed) baseBody.seed = parseInt(settings.seed, 10);
                        if (settings.frequencyPenalty) baseBody.frequency_penalty = settings.frequencyPenalty;
                        if (settings.presencePenalty) baseBody.presence_penalty = settings.presencePenalty;
                        if (toolToggles.json) {
                            baseBody.response_format = { type: 'json_object' };
                        }
                        if (isGptOss) {
                            const eff = effortCfg.effort;
                            if (eff && eff !== 'default' && currentThinking.thinking) {
                                baseBody.reasoning_effort = eff;
                            } else if (currentModel.reasoningEffort && currentThinking.thinking) {
                                baseBody.reasoning_effort = currentModel.reasoningEffort;
                            }
                            baseBody.top_p = 0.9;
                        } else if (isQwen) {
                            // Qwen3-32B recommended params (per Groq docs)
                            baseBody.top_p = currentThinking.thinking ? 0.95 : 0.8;
                            baseBody.top_k = 20;
                            baseBody.min_p = 0;
                            if (currentThinking.thinking) {
                                baseBody.reasoning_format = 'parsed'; // native reasoning output
                            }
                        } else {
                            baseBody.top_p = 0.9;
                        }
                        return baseBody;
                    };

                    const streamingKeys = [API_KEY, FALLBACK_KEY, ...COMPLETE_FALLBACK_KEYS];
                    const nonStreamingKeys = [UTIL_KEY, VISION_KEY, ...COMPLETE_FALLBACK_KEYS];
                    const modelsToTry = useModel !== FAST_MODEL ? [useModel, FAST_MODEL, 'llama-3.3-70b-versatile'] : [FAST_MODEL, 'llama-3.3-70b-versatile'];

                    const useJsonMode = toolToggles.json;
                    let runTwoPhase = currentThinking.thinking && !currentThinking.multiModel && !useJsonMode && activeThinkingMode !== 'instant';
                    let twoPhaseThinking = '';
                    const reasoningModel = REASONING_MODEL;
                    const writerModel = currentModel.model;
                    const writerModels = getWriterModels(writerModel);
                    const userApiContent = apiMessages[apiMessages.length - 1]?.content || effectivePrompt;
                    const writerSystemBase = getBasePrompt(settings) + customChunk + currentModel.prompt;
                    const effortCfg = EFFORT_LEVELS.find(e => e.id === effort) || EFFORT_LEVELS[1];
                    const reasoningEffort = effortCfg.effort === 'high' ? 'high' : effortCfg.effort === 'low' ? 'low' : 'medium';

                    const streamIdx = tempMsgs.length;
                    let accumulated = '';

                    const pushStream = (() => {
                        let streamRaf = null, pending = null;
                        return (content) => {
                            pending = content;
                            if (!streamRaf) {
                                streamRaf = requestAnimationFrame(() => {
                                    streamRaf = null;
                                    setMessages(prev => {
                                        const u = [...prev];
                                        if (u[streamIdx]?.streaming) u[streamIdx] = { role: 'assistant', content: pending, streaming: true };
                                        return u;
                                    });
                                });
                            }
                        };
                    })();

                    const ensureStreamBubble = (keepAgentPanel = false) => {
                        if (!keepAgentPanel) setFullModeConvo(null);
                        setMessages(prev => {
                            if (prev.length > streamIdx && prev[streamIdx]?.streaming) return prev;
                            return [...tempMsgs, { role: 'assistant', content: '', streaming: true }];
                        });
                    };

                    const liveDisplay = (text) => {
                        if (currentThinking.thinking) return text;
                        let r = text.replace(/<(?:thinking|think)>[\s\S]*?<\/(?:thinking|think)>\s*/g, '');
                        const s = Math.max(r.lastIndexOf('<thinking>'), r.lastIndexOf('<think>'));
                        if (s !== -1) r = r.slice(0, s);
                        return r.trimStart();
                    };

                    let fullModeDone = false;
                    if (fullModeAgentContext) {
                        ensureStreamBubble(true);
                        const fullSynMessages = [
                            { role: 'system', content: writerSystemBase + SYNTHESIS_PROMPT + SYNTHESIS_DEEP_PROMPT + currentThinking.prompt },
                            ...conversationMsgs.slice(-10),
                            { role: 'user', content: [
                                toolContext || '',
                                visionContext ? `[Vision context from attached image: ${visionContext}]` : '',
                                `Question:\n${effectivePrompt}`,
                                `---\nAgent analyses (synthesize into one expert answer — do not mention agents):\n${fullModeAgentContext.slice(0, 16000)}`,
                                '\nWrite a comprehensive, substantive answer that integrates the strongest insights from all agents.',
                            ].filter(Boolean).join('\n\n') },
                        ];
                        const fullSyn = await streamGroqChat({
                            models: getWriterModels(writerModel),
                            messages: fullSynMessages,
                            keys: streamingKeys,
                            signal: abortCtrl.signal,
                            temperature: 0.74,
                            mode: 'content',
                            thinkingOpts: { thinking: false },
                            onChunk: ({ content }) => {
                                accumulated = content;
                                pushStream(accumulated);
                            },
                            onUsage: (u) => { if (settings.showTokenUsage !== false) setLastTokenUsage(u); },
                        });
                        accumulated = fullSyn?.content?.trim() || accumulated;
                        fullModeDone = !!accumulated.trim();
                        if (fullModeDone) pushStream(accumulated);
                    }

                    // ═══ TWO-PHASE: reasoning model → writer model ═══
                    if (runTwoPhase && !fullModeDone) {
                        ensureStreamBubble();
                        setThinkingMessage('Reasoning through this…');

                        const reasoningSystem = systemPrompt + THINKING_CTRL_PROMPT + REASONING_ONLY_PROMPT
                            + `\n\nReasoning depth: ${getThinkingDepthHint(effectivePrompt, activeThinkingMode)}`;
                        const reasoningMessages = [
                            { role: 'system', content: reasoningSystem },
                            ...conversationMsgs,
                            { role: 'user', content: userApiContent },
                        ];

                        const phase1 = await streamGroqChat({
                            models: [reasoningModel, REASONING_MODEL, LLAMA_70B],
                            messages: reasoningMessages,
                            keys: streamingKeys,
                            signal: abortCtrl.signal,
                            temperature: currentThinking.temperature,
                            mode: 'reasoning',
                            thinkingOpts: { thinking: true, effort: reasoningEffort },
                            onChunk: ({ display }) => pushStream(display),
                            onUsage: (u) => { if (settings.showTokenUsage !== false) setLastTokenUsage(u); },
                        });

                        twoPhaseThinking = phase1?.thinking?.trim() || '';
                        if (!twoPhaseThinking) {
                            runTwoPhase = false;
                        } else {
                            setThinkingMessage('Crafting your answer…');
                            accumulated = `<thinking>${twoPhaseThinking}</thinking>\n\n`;
                            pushStream(accumulated);

                            const phase2MinWords = getTargetAnswerWords(countWords(twoPhaseThinking), { deep: activeThinkingMode === 'max' });
                            const synthesisMessages = [
                                { role: 'system', content: writerSystemBase + SYNTHESIS_PROMPT + (activeThinkingMode === 'max' ? SYNTHESIS_DEEP_PROMPT : '') },
                                ...conversationMsgs.slice(-10),
                                { role: 'user', content: [
                                    toolContext || '',
                                    visionContext ? `[Vision context from attached image: ${visionContext}]` : visionFailed ? `[The user attached an image but visual analysis is unavailable. Acknowledge warmly.]` : '',
                                    `Question:\n${effectivePrompt}`,
                                    `---\nInternal reasoning (use to inform your answer — do not quote verbatim or mention this section):\n${twoPhaseThinking.slice(0, 14000)}`,
                                    phase2MinWords > 80 ? `\nLENGTH: Write at least ${phase2MinWords} words. Match the depth of the reasoning with substantive prose.` : '',
                                ].filter(Boolean).join('\n\n') },
                            ];

                            const phase2 = await streamGroqChat({
                                models: writerModels,
                                messages: synthesisMessages,
                                keys: streamingKeys,
                                signal: abortCtrl.signal,
                                temperature: activeThinkingMode === 'max' ? 0.72 : Math.min(currentThinking.temperature, 0.75),
                                mode: 'content',
                                thinkingOpts: { thinking: false },
                                onChunk: ({ content }) => {
                                    accumulated = `<thinking>${twoPhaseThinking}</thinking>\n\n${content}`;
                                    pushStream(accumulated);
                                },
                                onUsage: (u) => { if (settings.showTokenUsage !== false) setLastTokenUsage(u); },
                            });

                            const answerText = phase2?.content?.trim() || '';
                            if (answerText) {
                                accumulated = `<thinking>${twoPhaseThinking}</thinking>\n\n${answerText}`;
                            } else {
                                const fallbackAnswer = await synthesizeAnswerFromThinking(effectivePrompt, twoPhaseThinking, writerSystemBase, conversationMsgs, {
                                    toolContext, visionContext, writerModel, keys: streamingKeys, signal: abortCtrl.signal,
                                    deep: activeThinkingMode === 'max',
                                });
                                accumulated = `<thinking>${twoPhaseThinking}</thinking>\n\n${fallbackAnswer || "I couldn't generate a response."}`;
                            }

                            accumulated = await ensureQualityAnswer(twoPhaseThinking, accumulated, effectivePrompt, writerSystemBase, conversationMsgs, {
                                toolContext, visionContext, writerModel, keys: streamingKeys, signal: abortCtrl.signal,
                                deep: activeThinkingMode === 'max',
                            });
                            pushStream(accumulated);
                        }
                    }

                    const hasFinalAnswer = stripThinking(accumulated).trim().length > 0;
                    const skipSinglePass = fullModeDone || (runTwoPhase && twoPhaseThinking && hasFinalAnswer);

                    // ═══ SINGLE-PASS (instant, JSON, full mode fallback, or two-phase fallback) ═══
                    if (!skipSinglePass && (!runTwoPhase || !twoPhaseThinking)) {
                    accumulated = accumulated || '';

                    let streamRes = null;
                    let resolvedModel = useModel;
                    if (!useJsonMode) streamModelLoop: for (const tryModel of modelsToTry) {
                        for (const sKey of streamingKeys) {
                            try {
                                const r = await fetch(API_URL, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sKey}` },
                                    body: JSON.stringify(buildApiBody(tryModel, true)),
                                    signal: abortCtrl.signal
                                });
                                if (r.ok) { streamRes = r; resolvedModel = tryModel; break streamModelLoop; }
                                if (r.status === 401 || r.status === 403) break streamModelLoop; // hard auth fail
                            } catch (fetchErr) {
                                if (fetchErr.name === 'AbortError') throw fetchErr;
                            }
                        }
                    }

                    if (streamRes) {
                        ensureStreamBubble();

                        const reader = streamRes.body.getReader();
                        const dec = new TextDecoder();
                        let buf = '';
                        let reasoningBuf = '';
                        let reasoningDone = false;
                        streamLoop: while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            buf += dec.decode(value, { stream: true });
                            const lines = buf.split('\n');
                            buf = lines.pop();
                            for (const line of lines) {
                                if (!line.startsWith('data: ')) continue;
                                const d = line.slice(6).trim();
                                if (d === '[DONE]') break streamLoop;
                                try {
                                    const parsed = JSON.parse(d);
                                    if (parsed.usage && settings.showTokenUsage !== false) {
                                        setLastTokenUsage(parsed.usage);
                                    }
                                    const deltaObj = parsed.choices?.[0]?.delta || {};
                                    const reasoning = deltaObj.reasoning || '';
                                    const delta = deltaObj.content || '';
                                    
                                    if (reasoning && currentThinking.thinking && !reasoningDone) {
                                        reasoningBuf += reasoning;
                                        accumulated = `<thinking>${reasoningBuf}`;
                                        pushStream(accumulated);
                                    }
                                    if (delta) {
                                        if (reasoningBuf && !reasoningDone) {
                                            reasoningDone = true;
                                            accumulated = `<thinking>${reasoningBuf}</thinking>\n\n${delta}`;
                                        } else {
                                            accumulated += delta;
                                        }
                                        pushStream(liveDisplay(accumulated));
                                    }
                                } catch {}
                            }
                        }
                        if (reasoningBuf && !reasoningDone && !accumulated) {
                            accumulated = `<thinking>${reasoningBuf}</thinking>`;
                        } else if (reasoningBuf && !reasoningDone) {
                            accumulated = `<thinking>${reasoningBuf}</thinking>\n\n` + accumulated;
                        }
                    } else {
                        // Non-streaming waterfall: preferred model → FAST_MODEL, × all keys each
                        let apiRes = null;
                        nonStreamModelLoop: for (const tryModel of modelsToTry) {
                            for (const k of nonStreamingKeys) {
                                try {
                                    const r = await fetch(API_URL, {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${k}` },
                                        body: JSON.stringify(buildApiBody(tryModel, false)),
                                        signal: abortCtrl.signal
                                    });
                                    if (r.ok) { apiRes = r; break nonStreamModelLoop; }
                                    if (r.status === 401 || r.status === 403) break nonStreamModelLoop;
                                } catch (fetchErr) {
                                    if (fetchErr.name === 'AbortError') throw fetchErr;
                                }
                            }
                        }
                        // Only throw (show error) if every model × key combination is exhausted
                        if (!apiRes?.ok) throw new Error('All API keys exhausted');
                        const data = await apiRes.json();
                        if (data.usage && settings.showTokenUsage !== false) setLastTokenUsage(data.usage);
                        const msgObj = data.choices?.[0]?.message || {};
                        const reasoning = msgObj.reasoning || '';
                        accumulated = msgObj.content || '';
                        if (reasoning && currentThinking.thinking) {
                            accumulated = `<thinking>${reasoning}</thinking>\n\n${accumulated}`;
                        }
                        if (!accumulated.trim()) accumulated = "I couldn't generate a response.";
                        freshMsgIdRef.current = streamIdx;
                    }
                    } // end single-pass

                    // Mandatory quality pass for any thinking response still imbalanced
                    const isDeepThinking = activeThinkingMode === 'max';
                    if (currentThinking.thinking && !currentThinking.multiModel && needsAnswerSynthesis(accumulated, { deep: isDeepThinking })) {
                        setThinkingMessage('Expanding your answer…');
                        const { thinking: innerThinking } = extractThinking(accumulated);
                        accumulated = await ensureQualityAnswer(innerThinking, accumulated, effectivePrompt, writerSystemBase, conversationMsgs, {
                            toolContext, visionContext, writerModel, keys: streamingKeys, signal: abortCtrl.signal,
                            deep: isDeepThinking,
                        });
                        pushStream(accumulated);
                    }

                    // Finalise content
                    let aiContent = accumulated || "I couldn't generate a response.";
                    if (!currentThinking.thinking) aiContent = stripThinking(aiContent);

                    if (ideOpen && ideWorkspace?.files) {
                        const edits = parseIdeEditsFromResponse(aiContent);
                        if (edits.length) applyIdeEdits(edits, ideWorkspace, setIdeWorkspace, setIdeActiveFile, showToast);
                    }

                    {
                        const finalMsgs = [...tempMsgs, { role: 'assistant', content: aiContent, ts: Date.now(), _thinkingMode: activeThinkingMode, ...(savedFullModeTurns ? { fullModeTurns: savedFullModeTurns } : {}) }];
                        setMessages(finalMsgs);
                        setHistory(h => h.map(c => c.id === activeChat ? { ...c, messages: finalMsgs } : c));
                        setFullModeConvo(null);
                        setProcessing(false);
                        if (settings.autoRead && aiContent) {
                            setTimeout(() => speakText(stripThinking(aiContent), streamIdx), 400);
                        }
                        if (!stickToBottomRef.current) setUnreadCount(n => n + 1);

                        if (isFirstMessage) {
                            generateTitle(effectivePrompt, stripThinking(aiContent)).then(t => {
                                if (t) setHistory(h => h.map(c => c.id === activeChat ? { ...c, title: t } : c));
                            });
                        }
                        setCachedResponse(effectivePrompt, sonnetModel, activeThinkingMode, aiContent, _ctxHash);
                        if (settings.showQuickReplies !== false) {
                            const strippedAi = stripThinking(aiContent);
                            // Skip quick replies for short/casual/emotional exchanges — they'd just feel intrusive
                            const _isPersonal = /\b(feel|feeling|stressed|anxious|sad|worried|struggling|lonely|hard time|difficult|overwhelmed|vent)\b/i.test(effectivePrompt);
                            const _isShortExchange = strippedAi.length < 120 && effectivePrompt.trim().split(/\s+/).length < 6;
                            if (!_isPersonal && !_isShortExchange) {
                                generateQuickReplies(strippedAi, effectivePrompt).then(replies => {
                                    if (replies.length) setQuickReplies(replies);
                                });
                            }
                        }
                    }
                } catch (e) {
                    if (e.name === 'AbortError') {
                        setFullModeConvo(null);
                        // Finalize whatever was streamed — keep partial content, remove streaming flag
                        setMessages(prev => {
                            const last = prev[prev.length - 1];
                            if (last?.streaming) {
                                const finalized = [...prev];
                                const finalContent = last.content || '(Generation stopped)';
                                finalized[finalized.length - 1] = { role: 'assistant', content: finalContent };
                                setHistory(h => h.map(c => c.id === activeChat ? { ...c, messages: finalized } : c));
                                return finalized;
                            }
                            return prev;
                        });
                        setProcessing(false);
                        return;
                    }
                    setFullModeConvo(null);
                    console.error('Send error:', e);
                    // Distinguish connection errors from API errors — give a more specific message
                    const isNetworkErr = e instanceof TypeError && e.message.includes('fetch');
                    const errText = isNetworkErr
                        ? "Couldn't reach the server — check your connection and try again."
                        : "Something went wrong on the AI side. Try again or switch to a different model.";
                    const errorMsg = { role: 'error', content: errText };
                    const errorMsgs = [...tempMsgs, errorMsg];
                    setMessages(errorMsgs);
                    setHistory(h => h.map(c => c.id === activeChat ? { ...c, messages: errorMsgs } : c));
                    setProcessing(false);
                }
            };

            const handleRegenerate = () => {
                if (processing) return;
                // Walk backwards past any trailing error/assistant messages to find the last user message
                let idx = messages.length - 1;
                while (idx >= 0 && messages[idx].role !== 'user') idx--;
                if (idx < 0) return;
                const userMsg = messages[idx].content;
                for (const k of [..._respCache.keys()]) {
                    if (k.includes(`::${sonnetModel}::`) && k.endsWith(userMsg.toLowerCase().trim().slice(0, 400))) {
                        _respCache.delete(k);
                    }
                }
                setMessages(messages.slice(0, idx));
                showToast('Regenerating\u2026', 'info');
                setTimeout(() => handleSend(userMsg), 100);
            };

            const stopGeneration = () => {
                if (abortRef.current) { abortRef.current.abort(); abortRef.current = null; }
                setFullModeConvo(null);
                setProcessing(false);
            };

            const handleEditMessage = (content, msgIdx) => {
                if (processing) return;
                setEditModal({ open: true, content, msgIdx });
            };

            const saveEditedMessage = (newContent) => {
                const capturedIdx = editModal.msgIdx;
                setEditModal({ open: false, content: '', msgIdx: null });
                if (capturedIdx == null || !newContent) return;
                setMessages(prev => prev.slice(0, capturedIdx));
                setQuickReplies([]);
                setTimeout(() => handleSend(newContent, undefined, true), 80);
            };

            const exportTranscript = () => {
                const chatTitle = history.find(c => c.id === activeChat)?.title || 'chat';
                const safeTitle = chatTitle.replace(/[^a-z0-9\s-]/gi, '').trim().replace(/\s+/g, '-').toLowerCase().slice(0, 48) || 'fibre-chat';
                const date = new Date().toISOString().slice(0, 10);
                const lines = messages.filter(m => m.role === 'user' || m.role === 'assistant').map(m => {
                    const speaker = m.role === 'user' ? 'You' : 'Fibre';
                    const ts = m.ts ? ` [${new Date(m.ts).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}]` : '';
                    return `${speaker}${ts}:\n${stripThinking(m.content)}`;
                }).join('\n\n---\n\n');
                const blob = new Blob([`# ${chatTitle}\n_Exported ${date}_\n\n---\n\n${lines}`], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `${safeTitle}-${date}.txt`; a.click();
                URL.revokeObjectURL(url);
                showToast('Transcript downloaded', 'success');
            };

            const formatTime = (ts) => {
                const d = new Date(ts);
                const now = new Date();
                const diff = now - d;
                if (diff < 60000) return 'just now';
                if (diff < 3600000) return `${Math.floor(diff/60000)}m`;
                if (diff < 86400000) return `${Math.floor(diff/3600000)}h`;
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            };


            const copyConversationMarkdown = () => {
                const md = '# ' + (history.find(c => c.id === activeChat)?.title || 'Chat') + '\n\n' + messages.filter(m => m.role === 'user' || m.role === 'assistant').map(m => `## ${m.role === 'user' ? 'You' : 'Fibre'}\n\n${stripThinking(m.content)}`).join('\n\n---\n\n');
                navigator.clipboard.writeText(md); showToast('Copied markdown', 'success');
            };
            const clearConversation = () => {
                const init = [{ role: 'system_display', content: 'init' }];
                setMessages(init);
                setQuickReplies([]);
                setChatSearchQuery('');
                setChatSearchOpen(false);
                setHistory(h => h.map(c => c.id === activeChat ? { ...c, messages: init, title: 'New chat' } : c));
                showToast('Chat cleared', 'info');
            };

            const summarizeChat = () => {
                if (messages.length <= 1) return;
                const transcript = messages.filter(m => m.role === 'user' || m.role === 'assistant').map(m => `${m.role}: ${stripThinking(m.content).slice(0, 500)}`).join('\n');
                handleSend('Summarize this conversation in clear bullet points:\n\n' + transcript.slice(0, 6000));
            };

            const paletteCommands = [
                { id: 'new', icon: 'plus', label: 'New chat', kbd: 'Ctrl+N', category: 'Chat', action: createChat },
                { id: 'search', icon: 'magnifying-glass', label: 'Search in chat', kbd: 'Ctrl+F', category: 'Chat', action: () => { setChatSearchOpen(true); setTimeout(() => chatSearchRef.current?.focus(), 40); } },
                { id: 'summarize', icon: 'list-bullets', label: 'Summarize conversation', category: 'Chat', action: summarizeChat },
                { id: 'clear', icon: 'trash', label: 'Clear chat', category: 'Chat', action: clearConversation },
                { id: 'export', icon: 'download-simple', label: 'Export transcript (.txt)', category: 'Export', desc: 'Download full chat as plain text', action: exportTranscript },
                { id: 'export-json', icon: 'file-code', label: 'Export as JSON', category: 'Export', desc: 'Structured JSON with metadata', action: () => {
                    const data = { title: history.find(c => c.id === activeChat)?.title || 'chat', exported: new Date().toISOString(), messages: messages.filter(m => m.role === 'user' || m.role === 'assistant').map(m => ({ role: m.role, content: stripThinking(m.content), ts: m.ts, reaction: m.reaction || null })) };
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = `fibre-${data.title.replace(/[^a-z0-9]/gi,'-').toLowerCase().slice(0,40)}.json`; a.click(); URL.revokeObjectURL(url);
                    showToast('Exported as JSON', 'success');
                }},
                { id: 'copy', icon: 'copy', label: 'Copy as Markdown', category: 'Export', action: copyConversationMarkdown },
                { id: 'live', icon: 'waveform', label: 'Fibre Live — voice conversation', category: 'Tools', action: () => setLiveOpen(true) },
                { id: 'ide', icon: 'folder-open', label: 'Open IDE / folder', category: 'Tools', action: openIdeFolder },
                { id: 'dark', icon: darkMode ? 'sun' : 'moon', label: darkMode ? 'Light mode' : 'Dark mode', category: 'Appearance', action: () => setDarkMode(d => !d) },
                { id: 'settings', icon: 'gear', label: 'Settings', category: 'Appearance', action: () => setSettingsOpen(true) },
                ...Object.values(SONNET_MODELS).map(m => ({ id: m.id, icon: 'cpu', label: `Model: ${m.label}`, category: 'Models', action: () => setSonnetModel(m.id) })),
            ];

            const searchMatchCount = chatSearchQuery
                ? messages.filter(m => (m.role === 'user' || m.role === 'assistant') && stripThinking(m.content || '').toLowerCase().includes(chatSearchQuery.toLowerCase())).length
                : 0;
            const activeTools = TOOL_MODES.filter(t => toolToggles[t.id]).map(t => t.label);

            // Apply font size preference to document
            useEffect(() => {
                const fs = FONT_SIZES.find(f => f.id === (settings.fontSize || 'md'));
                document.documentElement.style.setProperty('--chat-font-size', fs?.size || '14.5px');
            }, [settings.fontSize]);

            // Paste image from clipboard (Ctrl+V) — works in composer textarea and elsewhere
            useEffect(() => {
                const onPaste = (e) => {
                    const tag = e.target?.tagName;
                    if (tag === 'INPUT' && e.target?.type !== 'file') return;
                    if (tag === 'TEXTAREA' && e.target !== inputRef.current) return;
                    if (attachImageFromClipboard(e.clipboardData)) e.preventDefault();
                };
                document.addEventListener('paste', onPaste);
                return () => document.removeEventListener('paste', onPaste);
            }, []);

            useEffect(() => {
                const onKey = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); createChat(); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'b') { e.preventDefault(); setSidebarOpen(o => !o); }
                    if ((e.ctrlKey || e.metaKey) && e.key === '/') { e.preventDefault(); inputRef.current?.focus(); }
                    if (e.key === 'Escape') { setMentionOpen(false); setChatSearchOpen(false); setLiveOpen(false); }
                };
                document.addEventListener('keydown', onKey);
                return () => document.removeEventListener('keydown', onKey);
            }, []);

            // ─── Sable · first-load intro sequence ───
            useEffect(() => {
                const t = setTimeout(() => setIntro(false), 1500);
                return () => clearTimeout(t);
            }, []);

            // ─── Sable · pointer-reactive ambient light, parallax & glass sheen ───
            useEffect(() => {
                if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                const root = document.documentElement;
                let raf = 0, px = window.innerWidth / 2, py = window.innerHeight / 2, gx = 0, gy = 0, lit = null;
                const apply = () => {
                    raf = 0;
                    root.style.setProperty('--cursor-x', px + 'px');
                    root.style.setProperty('--cursor-y', py + 'px');
                    root.style.setProperty('--parallax-x', ((px / window.innerWidth) - 0.5).toFixed(3));
                    root.style.setProperty('--parallax-y', ((py / window.innerHeight) - 0.5).toFixed(3));
                    if (lit) { lit.style.setProperty('--gx', gx + 'px'); lit.style.setProperty('--gy', gy + 'px'); }
                };
                const onMove = (e) => {
                    px = e.clientX; py = e.clientY;
                    const glass = e.target.closest && e.target.closest('.sonnet-composer, .sonnet-bubble.user, .sonnet-bubble.assistant, .sonnet-quick-reply, .sonnet-tool-chip, .sonnet-quick-action, .sonnet-pill, .sonnet-suggestion, .sonnet-scroll-btn, .sonnet-search, .sonnet-pick-panel, .sonnet-dd-menu, .sonnet-model-menu, .sonnet-unified-menu, .sonnet-modal, .sonnet-cmd-box');
                    if (glass) {
                        const r = glass.getBoundingClientRect();
                        gx = e.clientX - r.left; gy = e.clientY - r.top;
                        if (lit && lit !== glass) lit.classList.remove('sable-glass-lit');
                        lit = glass; lit.classList.add('sable-glass-lit');
                    } else if (lit) { lit.classList.remove('sable-glass-lit'); lit = null; }
                    if (!raf) raf = requestAnimationFrame(apply);
                };
                window.addEventListener('pointermove', onMove, { passive: true });
                return () => { window.removeEventListener('pointermove', onMove); if (raf) cancelAnimationFrame(raf); };
            }, []);

            // ─── Sable · magnetic buttons ───
            useEffect(() => {
                if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                let cur = null;
                const reset = () => { if (cur) { cur.style.transform = ''; cur = null; } };
                const onMove = (e) => {
                    const el = e.target.closest && e.target.closest('[data-magnetic]');
                    if (cur && cur !== el) reset();
                    if (el) {
                        cur = el;
                        const r = el.getBoundingClientRect();
                        const s = parseFloat(el.dataset.magnetic) || 0.3;
                        const mx = (e.clientX - (r.left + r.width / 2)) * s;
                        const my = (e.clientY - (r.top + r.height / 2)) * s;
                        el.style.transform = `translate(${mx.toFixed(1)}px, ${my.toFixed(1)}px)`;
                    }
                };
                window.addEventListener('pointermove', onMove, { passive: true });
                window.addEventListener('pointerdown', reset);
                window.addEventListener('blur', reset);
                return () => { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerdown', reset); window.removeEventListener('blur', reset); };
            }, []);

            // ─── Sable · tactile click ripples ───
            useEffect(() => {
                const SEL = '.sonnet-nav-item, .sonnet-quick-action, .sonnet-btn-primary, .sonnet-suggestion, .sonnet-pill, .sonnet-quick-reply, .sonnet-tool-chip, .sonnet-rail-btn, .sonnet-cmd-item';
                const onDown = (e) => {
                    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                    const el = e.target.closest && e.target.closest(SEL);
                    if (!el) return;
                    const r = el.getBoundingClientRect();
                    const d = Math.max(r.width, r.height) * 1.7;
                    const rip = document.createElement('span');
                    rip.className = 'sable-ripple';
                    rip.style.width = rip.style.height = d + 'px';
                    rip.style.left = (e.clientX - r.left - d / 2) + 'px';
                    rip.style.top = (e.clientY - r.top - d / 2) + 'px';
                    el.appendChild(rip);
                    setTimeout(() => rip.remove(), 680);
                };
                document.addEventListener('pointerdown', onDown);
                return () => document.removeEventListener('pointerdown', onDown);
            }, []);

            // ─── Sable · sliding active indicator within the chat list ───
            useLayoutEffect(() => {
                const slider = chatSliderRef.current, container = sidebarListRef.current;
                if (!slider || !container) return;
                const active = container.querySelector('.sonnet-chat-item.active');
                if (!active) { slider.style.opacity = '0'; return; }
                const cr = container.getBoundingClientRect(), ar = active.getBoundingClientRect();
                slider.style.height = ar.height + 'px';
                slider.style.transform = `translateY(${(ar.top - cr.top + container.scrollTop).toFixed(1)}px)`;
                slider.style.opacity = '1';
            }, [activeChat, history, sidebarTab, sidebarSearchDebounced, sidebarOpen]);

            const h = new Date().getHours();
            const greetBase = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
            const greet = settings?.userName ? `${greetBase}, ${settings.userName}` : greetBase;
            return (
                <div className={`sonnet-app ${darkMode ? 'dark' : ''}${intro ? ' sable-intro' : ''}`}>
                    <AmbientBackground />
                    <CursorGlow />
                    {intro && (
                        <div className="sable-boot" aria-hidden="true">
                            <div className="sable-boot-mark"><SelvetLogo size={68} active /></div>
                            <div className="sable-boot-word">FIBRE</div>
                        </div>
                    )}
                    <div className={`sonnet-mobile-overlay ${sidebarOpen ? 'show' : ''}`} onClick={() => setSidebarOpen(false)} />

                    <aside className={`sonnet-sidebar ${sidebarOpen ? '' : 'collapsed'}`}>
                        <div className="sonnet-rail-only">
                            <button type="button" className="sonnet-rail-btn" onClick={() => setSidebarOpen(true)} title="Open sidebar"><Icon name="sidebar" size={16} /></button>
                            <span className="sonnet-rail-mag" data-magnetic="0.3"><button type="button" className="sonnet-rail-btn sonnet-rail-btn-new" onClick={createChat} title="New chat"><Icon name="plus" size={18} weight="bold" /></button></span>
                            <div className="sonnet-rail-spacer" />
                            <button type="button" className="sonnet-rail-btn" onClick={() => setDarkMode(d => !d)} title="Toggle theme"><Icon name={darkMode ? 'sun' : 'moon'} size={16} /></button>
                            <button type="button" className="sonnet-rail-btn" onClick={() => setSettingsOpen(true)} title="Settings"><Icon name="gear" size={16} /></button>
                        </div>
                        <div className="sonnet-sidebar-inner">
                        <div className="sonnet-sidebar-head">
                            <div className="sonnet-brand-lockup">
                                <SelvetLogo size={26} className="sonnet-brand-logo" />
                                <div className="sonnet-brand-text">
                                    <span className="sonnet-brand-name">Fibre</span>
                                    <span className="sonnet-brand-byline">By LAYRD INNO.</span>
                                </div>
                            </div>
                            <div className="sonnet-head-actions">
                                <button type="button" className="sonnet-icon-btn" onClick={() => { setSidebarSearch(''); document.querySelector('.sonnet-search')?.focus(); }} title="Search"><Icon name="magnifying-glass" size={15} /></button>
                            </div>
                        </div>

                                setSidebarSearch(e.target.value);
