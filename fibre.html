                                sidebarSearchTimerRef.current = setTimeout(() => setSidebarSearchDebounced(e.target.value), 200);
                            }} />
                        </div>
                        <div className="sonnet-recents-head">
                            <span>Recents</span>
                            <button type="button" className="sonnet-icon-btn" onClick={createChat} title="New chat"><Icon name="plus" size={13} /></button>
                        </div>
                        <div className="sonnet-chats" ref={sidebarListRef}>
                            <div className="sable-list-slider" ref={chatSliderRef} aria-hidden="true" />
                            {(() => {
                                const filtered = history
                                    .filter(c => sidebarTab === 'starred' ? starredChats.includes(c.id) : true)
                                    .filter(c => !sidebarSearchDebounced || c.title.toLowerCase().includes(sidebarSearchDebounced.toLowerCase()));
                                if (!filtered.length) return (
                                    <div className="sonnet-empty">
                                        <div className="sonnet-empty-icon"><Icon name={sidebarTab === 'starred' ? 'star' : 'chats'} size={18} /></div>
                                        {sidebarTab === 'starred'
                                            ? <><div>Star chats to find them here</div><div style={{ marginTop: 4, fontSize: 11, opacity: 0.7 }}>Click ··· on any chat to star it</div></>
                                            : sidebarSearchDebounced ? 'No chats match your search' : 'No conversations yet'
                                        }
                                        {!sidebarSearchDebounced && sidebarTab !== 'starred' && <div style={{ marginTop: 8 }}><button type="button" className="sonnet-btn-ghost" style={{ fontSize: 12, padding: '6px 14px' }} onClick={createChat}>Start a chat</button></div>}
                                    </div>
                                );
                                return groupChatsByDate(filtered).map(g => (
                                    <div key={g.label}>
                                        <div className="sonnet-group-label">{g.label}</div>
                                        {g.items.map(chat => {
                                            const chatTs = chat.timestamp || parseInt(chat.id) || 0;
                                            return (
                                                <div key={chat.id} className={`sonnet-chat-item ${activeChat === chat.id ? 'active' : ''}`} onClick={() => loadChat(chat.id)}>
                                                    <div style={{ minWidth: 0, flex: 1 }}>
                                                        {renamingChat === chat.id ? (
                                                            <input className="sonnet-search" style={{ padding: '4px 8px', fontSize: 12 }} defaultValue={chat.title} autoFocus
                                                                onBlur={e => finishRename(chat.id, e.target.value)}
                                                                onKeyDown={e => { if (e.key === 'Enter') finishRename(chat.id, e.target.value); if (e.key === 'Escape') setRenamingChat(null); }}
                                                                onClick={e => e.stopPropagation()} />
                                        ) : (
                                            <>
                                                <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                                                    {starredChats.includes(chat.id) && <Icon name="star" size={10} weight="fill" style={{ color: '#f59e0b', flexShrink: 0 }} />}
                                                    <div className="sonnet-chat-title" style={{ flex: 1, minWidth: 0 }}>{chat.title}</div>
                                                    {(() => { const cnt = (chat.messages || []).filter(m => m.role === 'user' || m.role === 'assistant').length; return cnt > 10 ? <span className="sonnet-msg-count">{cnt}</span> : null; })()}
                                                </div>
                                                {(() => {
                                                    const lastMsg = (chat.messages || []).slice().reverse().find(m => m.role === 'user' || m.role === 'assistant');
                                                    const preview = lastMsg ? stripThinking(lastMsg.content || '').replace(/\s+/g, ' ').trim().slice(0, 55) : '';
                                                    return preview ? <div className="sonnet-chat-preview">{preview}</div> : null;
                                                })()}
                                                {chatTs > 0 && <div className="sonnet-chat-ts">{relativeTime(chatTs)}</div>}
                                            </>
                                        )}
                                                    </div>
                                                    <ChatItemMenu
                                                        isStarred={starredChats.includes(chat.id)}
                                                        onStar={() => toggleStar({ stopPropagation: () => {} }, chat.id)}
                                                        onRename={() => startRename({ stopPropagation: () => {} }, chat.id)}
                                                        onDelete={() => deleteChat({ stopPropagation: () => {} }, chat.id)}
                                                        onDuplicate={() => {
                                                            const newId = Date.now().toString();
                                                            const copy = { ...chat, id: newId, title: chat.title + ' (copy)', timestamp: Date.now() };
                                                            setHistory(h => [copy, ...h]);
                                                            showToast('Chat duplicated', 'success');
                                                        }}
                                                    />
                                                </div>
                                            );
                                        })}
                                    </div>
                                ));
                            })()}
                        </div>
                        <div className="sonnet-user-foot">
                            <div className="sonnet-user-avatar">{(settings.userName || 'S').charAt(0).toUpperCase()}</div>
                            <div className="sonnet-user-info">
                                <div className="sonnet-user-name">{settings.userName || 'Fibre user'}</div>
                                <div className="sonnet-user-plan">{history.length} chat{history.length !== 1 ? 's' : ''} · {history.reduce((t, c) => t + (c.messages || []).filter(m => m.role === 'user' || m.role === 'assistant').length, 0)} msgs</div>
                            </div>
                            <button type="button" className="sonnet-icon-btn" onClick={() => setSettingsOpen(true)} title="Settings"><Icon name="gear" size={15} /></button>
                        </div>
                        </div>
                    </aside>

                    <div className="sonnet-main" style={{ position: 'relative' }}>
                        {processing && <div className="sonnet-progress"><div className="sonnet-progress-bar" /></div>}
                        {!isHero && (
                            <button type="button" className="sonnet-float-sidebar-btn" onClick={() => setSidebarOpen(o => !o)} title="Sidebar"><Icon name="sidebar" size={17} /></button>
                        )}
                        {isHero && (
                        <header className="sonnet-header minimal">
                            <div className="sonnet-header-left">
                                <button type="button" className="sonnet-icon-btn sonnet-sidebar-toggle" onClick={() => setSidebarOpen(o => !o)} title="Sidebar"><Icon name="sidebar" size={18} /></button>
                            </div>
                            <div className="sonnet-header-right">
                                {processing && <button type="button" className="sonnet-btn-ghost" style={{ padding: '6px 12px', fontSize: 12 }} onClick={stopGeneration}><Icon name="stop" size={13} weight="fill" /> Stop</button>}
                            </div>
                        </header>
                        )}
                        {!isHero && processing && (
                            <div className="sonnet-float-stop">
                                <button type="button" className="sonnet-btn-ghost" onClick={stopGeneration}><Icon name="stop" size={13} weight="fill" /> Stop</button>
                            </div>
                        )}
                        {chatSearchOpen && (
                            <div className="sonnet-chat-search">
                                <Icon name="magnifying-glass" size={14} style={{ color: 'var(--muted2)', flexShrink: 0 }} />
                                <input ref={chatSearchRef} placeholder="Search in this conversation…" value={chatSearchQuery}
                                    onChange={e => setChatSearchQuery(e.target.value)}
                                    onKeyDown={e => { if (e.key === 'Escape') { setChatSearchOpen(false); setChatSearchQuery(''); } }} />
                                {chatSearchQuery && <span className="sonnet-search-count">{searchMatchCount} match{searchMatchCount !== 1 ? 'es' : ''}</span>}
                                <button type="button" className="sonnet-icon-btn" onClick={() => { setChatSearchOpen(false); setChatSearchQuery(''); }}><Icon name="x" size={14} /></button>
                            </div>
                        )}

                        <div className={`sonnet-body${ideOpen ? ' ide-active' : ''}`}>
                            {ideOpen && ideWorkspace && (
                                <IDEPanel workspace={ideWorkspace} setWorkspace={setIdeWorkspace} activeFile={ideActiveFile} setActiveFile={setIdeActiveFile}
                                    onClose={() => setIdeOpen(false)} onAskAboutFile={askAboutIdeFile} onReopenFolder={openIdeFolder} onShowToast={showToast} />
                            )}
                            <div className="sonnet-chat-col">
                                {isHero && (
                                    <div className="sonnet-hero">
                                        {processing ? <SelvetLogo size={52} active /> : <SelvetLogoHover size={52} />}
                                        <h1 className="sonnet-hero-greet">{greet}.</h1>
                                        {(() => {
                                            const named = history.filter(c => c.title && !/^(New chat|New thread)$/i.test(c.title));
                                            const last = named[0];
                                            return named.length >= 2 && last ? (
                                                <p className="sonnet-hero-continue">
                                                    <button type="button" className="sonnet-continue-link" onClick={() => loadChat(last.id)}>
                                                        Continue &ldquo;{last.title.slice(0, 30)}{last.title.length > 30 ? '\u2026' : ''}&rdquo; <Icon name="arrow-right" size={11} />
                                                    </button>
                                                </p>
                                            ) : null;
                                        })()}
                                    </div>
                                )}
                                <div className={`sonnet-messages${dragOver ? ' drop-active' : ''}${isHero ? ' hero-msgs' : ''}`} ref={scrollRef}

                                    onDragLeave={() => setDragOver(false)}
                                    onDrop={e => { e.preventDefault(); setDragOver(false); const f = e.dataTransfer.files[0]; if (f) attachImageFile(f); }}>
                                    <div key={chatTransitionKey} className="sonnet-messages-inner sonnet-chat-fade">
                                        <MultiAgentPanel convo={fullModeConvo} />
                                        {!isHero && (
                                            <>
                                                {messages.map((msg, i) => {
                                                    if (msg.role === 'system_display') return null;
                                                    const prev = messages.slice(0, i).reverse().find(m => m.role === 'user' || m.role === 'assistant');
                                                    const dateLabel = msg.ts ? formatDateLabel(msg.ts) : '';
                                                    const showDate = dateLabel && dateLabel !== 'Today' && msg.ts && (!prev?.ts || formatDateLabel(msg.ts) !== formatDateLabel(prev.ts));
                                                    const isLast = i === messages.length - 1;
                                                    return (
                                                        <React.Fragment key={`${activeChat}-${i}`}>

                                                            <MessageBubble role={msg.role} content={msg.content} ts={msg.ts} imageThumb={msg.imageThumb}
                                                                isLatest={isLast} isFresh={i === freshMsgIdRef.current} isLatestMsg={isLast}
                                                                searchQuery={chatSearchQuery}
                                                                onSpeak={(text) => speakText(text, i)} isSpeaking={speakingIdx === i}
                                                                speakProgress={speakingIdx === i ? speakProgress : null}
                                                                onCopy={showToast} typeSpeed={THINKING_MODES[thinkingMode].speed}
                                                                isStreaming={!!msg.streaming}
                                                                onRegenerate={(isLast && (msg.role === 'assistant' || msg.role === 'error') && !msg.streaming) ? handleRegenerate : null}
                                                                onEdit={msg.role === 'user' ? (c) => handleEditMessage(c, i) : null}
                                                                quickReplies={isLast && msg.role === 'assistant' && !msg.streaming ? quickReplies : []}
                                                                onQuickReply={handleSend}
                                                                onOpenArtifact={(c) => { setArtifactContent(c); setArtifactOpen(true); }}
                                                                onRevealTick={() => scrollToBottomIfNeeded(true)}
                                                                msgReaction={msg.reaction || null}

                                                                    setHistory(h => h.map(c => c.id === activeChat ? { ...c, messages: messages.map((m2, j) => j === i ? { ...m2, reaction: r } : m2) } : c));

                                                        <button key={m.id} type="button" className="mention-item" onClick={() => { setInput(m.prefix); setMentionOpen(false); inputRef.current?.focus(); }}>

                                                <button type="button" className="sonnet-icon-btn" onClick={() => fileInputRef.current?.click()} title="Attach image"><Icon name="plus" size={18} /></button>
                                                {!isHero && (
                                                    <button type="button" className="sonnet-icon-btn" onClick={() => setMentionOpen(o => !o)} title="@ mentions"><Icon name="at" size={18} /></button>
                                                )}
                                                <div className="sonnet-input-wrap">
                                                    {!input && (
                                                        <span key={`ph-${placeholderIdx}-${Object.values(toolToggles).join('')}`} className="sonnet-ph-ghost" aria-hidden>
                                                            {isHero ? HERO_PLACEHOLDERS[placeholderIdx % HERO_PLACEHOLDERS.length] : (_toolPlaceholder || PLACEHOLDERS[placeholderIdx % PLACEHOLDERS.length])}
                                                        </span>
                                                    )}
                                                    <textarea ref={inputRef} value={input} disabled={processing} rows={1} placeholder=""
                                                    onChange={e => { setInput(e.target.value); e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px'; }}
                                                    onKeyDown={e => {
                                                        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
                                                        if (e.key === '@') setMentionOpen(true);
                                                        if (e.key === 'ArrowUp' && !input && inputHistory.length) {
                                                            e.preventDefault();
                                                            const next = Math.min(inputHistoryIdx + 1, inputHistory.length - 1);
                                                            setInputHistoryIdx(next);
                                                            setInput(inputHistory[next] || '');
                                                        }
                                                        if (e.key === 'ArrowDown' && inputHistoryIdx >= 0) {
                                                            e.preventDefault();
                                                            const next = inputHistoryIdx - 1;
                                                            setInputHistoryIdx(next);
                                                            setInput(next < 0 ? '' : inputHistory[next]);
                                                        }
                                                    }} />
                                                </div>
                                                {input.length > 60 && !processing && (
                                                    <button type="button" className="sonnet-icon-btn sonnet-clear-btn" title="Clear input" onClick={() => { setInput(''); if (inputRef.current) { inputRef.current.style.height = 'auto'; inputRef.current.focus(); } }}>
                                                        <Icon name="x-circle" size={15} weight="fill" />
                                                    </button>
                                                )}
                                                <FibreLiveMiniOrb active={liveOpen} onClick={() => setLiveOpen(true)} title="Fibre Live" />
                                                <button type="button" className="sonnet-icon-btn" onClick={toggleVoice} title={listening ? 'Stop recording' : `${FIBRE_ORAL_LABEL} voice input`} style={listening ? { color: '#dc2626' } : {}}><Icon name={listening ? 'microphone-slash' : 'microphone'} size={18} weight="fill" /></button>
                                                <span className="sonnet-send-wrap" data-magnetic="0.34">
                                                    <button
                                                        type="button"
                                                        className={`sonnet-send${processing ? ' stop-mode' : ''}`}
                                                        disabled={!processing && !input.trim() && !imageFile}
                                                        onClick={() => { if (processing) { stopGeneration(); } else { handleSend(); } }}
                                                        title={processing ? 'Stop generation' : 'Send message'}
                                                    >
                                                        <SendMorph stop={processing} />
                                                    </button>
                                                </span>
                                            </div>
                                            <div className="sonnet-composer-bar no-top-border">
                                                <div className="sonnet-composer-left">
                                                    {input.length > 140 && (
                                                        <span className={`sonnet-token-counter${input.length > 2000 ? ' warn' : ''}`}>
                                                            {input.trim().split(/\s+/).filter(Boolean).length}w · ~{Math.round(input.length / 4)} tok
                                                            {input.length > 2000 && <span className="sonnet-char-warn"> · {input.length}/2000</span>}
                                                        </span>
                                                    )}
                                                </div>
                                                <div className="sonnet-composer-right">
                                                    <UnifiedModelModePicker sonnetModel={sonnetModel} setSonnetModel={setSonnetModel} thinkingMode={thinkingMode} setThinkingMode={setThinkingMode} effort={effort} setEffort={setEffort} />
                                                </div>
                                            </div>
                                        </div>
                                        {isHero && (
                                            <div className="sonnet-quick-actions">
                                                {QUICK_ACTIONS.map(a => (
                                                    <button key={a.id} type="button" className={`sonnet-quick-action${a.id === 'pick' && pickOpen ? ' active' : ''}`} onClick={() => {
                                                        if (a.id === 'pick') { setPickOpen(o => !o); setPickHover(0); }
                                                        else { setPickOpen(false); setInput(a.prompt || ''); inputRef.current?.focus(); }
                                                    }}>
                                                        <Icon name={a.icon} size={13} /> {a.label}
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                        {isHero && pickOpen && (
                                            <SelvetPickPanel
                                                items={selvetPicks}
                                                loading={picksLoading}
                                                hoverIdx={pickHover}
                                                setHoverIdx={setPickHover}
                                                onSelect={(prompt) => { setInput(prompt); inputRef.current?.focus(); }}
                                                onClose={() => setPickOpen(false)}
                                                onRefresh={loadSelvetPicks}
                                            />
                                        )}
                                    </div>
                                </div>
                            </div>
                            <ArtifactPanel open={artifactOpen} onClose={() => setArtifactOpen(false)} content={artifactContent} />
                        </div>
                    </div>

                    <FibreLiveOverlay
                        open={liveOpen}
                        onClose={() => { setLiveOpen(false); stopSpeaking(); }}
                        voice={settings.fibreOralVoice || settings.ttsVoice || 'hannah'}
                        onTurn={runLiveVoiceTurn}
                        onSpeak={speakLiveText}
                        onStopSpeak={stopSpeaking}
                    />
                    <Toast message={toast.message} visible={toast.visible} type={toast.type} onHide={() => setToast({ visible: false, message: '', type: 'info' })} />
                    <SettingsModal open={settingsOpen} onClose={() => setSettingsOpen(false)} settings={settings} onSave={saveSettings} onClearAllChats={() => { setHistory([]); createChat(); showToast('All chats deleted', 'info'); }} />
                    <CommandPalette open={commandOpen} onClose={() => setCommandOpen(false)} commands={paletteCommands} />
                    <EditMessageModal open={editModal.open} content={editModal.content} onClose={() => setEditModal({ open: false, content: '', msgIdx: null })} onSave={saveEditedMessage} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SelvetApp />);
    </script>
</body>
</html>
