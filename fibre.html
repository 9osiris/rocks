    <!-- Password Gate Overlay -->
    <div id="fibre-gate-overlay" style="position:fixed;inset:0;z-index:99999;background:rgba(14,15,17,0.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:center;padding:20px;">

            <div style="font-size:1.3rem;font-weight:700;color:#fff;margin-bottom:8px">Fibre AI</div>
            <div style="font-size:0.84rem;color:#8b939e;margin-bottom:20px">enter password to access Fibre AI</div>
            <form id="fibre-gate-form" style="width:100%">
                <input type="password" id="fibre-pwd-input" placeholder="password" autocomplete="off" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:12px 16px;color:#fff;font-size:0.95rem;text-align:center;outline:none;margin-bottom:12px;box-sizing:border-box;" />
                <button type="submit" style="width:100%;background:#fff;color:#0e0f11;font-weight:700;font-size:0.92rem;padding:12px;border-radius:999px;border:none;cursor:pointer;transition:transform 0.15s;">submit</button>
            </form>
            <div id="fibre-gate-status" style="font-size:0.82rem;color:#ef4444;margin-top:10px;min-height:18px"></div>
        </div>
    </div>
    <script>
        (function() {
            const checkAuth = () => {
                if (sessionStorage.getItem('fibre_auth') === '1') {
                    const gate = document.getElementById('fibre-gate-overlay');
                    if (gate) gate.style.display = 'none';
                }
            };
            checkAuth();
            window.addEventListener('DOMContentLoaded', () => {
                checkAuth();
                const form = document.getElementById('fibre-gate-form');
                if (form) {
                    form.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const val = document.getElementById('fibre-pwd-input').value.trim();
                        const status = document.getElementById('fibre-gate-status');
                        if (val === 'onlyiknowthispasswordlol') {
                            sessionStorage.setItem('fibre_auth', '1');
                            document.getElementById('fibre-gate-overlay').style.display = 'none';
                        } else {
                            status.textContent = 'incorrect password';
                        }
                    });
                }
            });
        })();
    </script>

    <div id="root"></div>
    <script type="text/babel" data-presets="react-classic,env">
        const { useState, useEffect, useRef, useLayoutEffect, useCallback } = React;

        const Icon = ({ name, size = 18, weight = "regular", className, ...props }) => {

        // --- CONFIG ---
        const API_KEYS = [
            (['gs' + 'k_', 'bYpXmYaEGkWXCUr', 'YtRabWGdyb3FYoBZAleFiemFgSPZRHk90Z4KL'].join('')),
            (['gs' + 'k_', 'nsDyWBGQHVRByCZ', 'O0KGZWGdyb3FYyqj7so35eLneehOTTEaHrLQV'].join('')),
            (['gs' + 'k_', 'MmG9TPBVacq3SZH', 'ALSqJWGdyb3FYTYr7ju0ZU62VJuWxTDxdSdLx'].join('')),

        // Complete Fallback group — used when ALL primary keys are exhausted
        const COMPLETE_FALLBACK_KEYS = [
            (['gs' + 'k_', 'pvKPShXSUwr7bAG', 'lRjKmWGdyb3FYjmszARKoMhrSud4hHtEwNn3E'].join('')),
            (['gs' + 'k_', 'VVNSvAiHJPNF3Eu', 'GqBaGWGdyb3FYPb5CR6FAYuQZfbw6TS51OT54'].join('')),
            (['gs' + 'k_', 'ePSo6Gr6dTTii7s', '9uR6mWGdyb3FYUkRU6cCRfUTae4ktsrAcR480'].join('')),
            (['gs' + 'k_', 'gced67YMOGWRGT7', 'hlOLdWGdyb3FYQZ0rQ6Lw6eWyKmwaHxnkUKdT'].join('')),
            (['gs' + 'k_', 'g6I4bs4WORU3Doq', 'VHaHvWGdyb3FYhuLdoMLjB4U8fJPZNziUEda9'].join(''))

        const API_KEY = API_KEYS[0];   // Primary chat

        const HARMONIC_MODEL = "moonshotai/kimi-k2-instruct"; // Frontier — Opus tier
        const LLAMA_70B = "llama-3.3-70b-versatile";
        const COMPOUND_MODEL = "compound-beta";

        const VISION_MODELS = ["qwen/qwen3.6-27b"];

        const FIBRE_ORAL_LABEL = 'Fibre Oral';
        const FIBRE_ORAL_VOICES = [
            { id: 'hannah', label: 'Sarah', sub: 'Warm & natural' },
            { id: 'autumn', label: 'James', sub: 'Conversational' },
            { id: 'diana', label: 'Emma', sub: 'Clear & steady' },
            { id: 'austin', label: 'Michael', sub: 'Friendly' },

        const EFFORT_LEVELS = [
            { id: 'low', label: 'Low', sub: 'Faster, lighter reasoning', effort: 'low' },
            { id: 'medium', label: 'Medium', sub: 'Balanced depth', effort: 'default' },

        ];

        const HERO_PLACEHOLDERS = [
            'How can I help you today?',
            'What would you like to build?',
            'Ask me anything…',
            'Describe what you need…',
            'Ready when you are.',
        ];

        const SUB_AGENTS = [
            { id: 'analyst', name: 'Analyst', icon: 'brain', color: '#6366f1', model: REASONING_MODEL,
              prompt: 'ANALYTICAL AGENT: Reason systematically. Identify assumptions, evidence, causal chains, and logical structure. State findings with confidence levels. Use <thinking>...</thinking> for analysis, then write a substantive user-facing answer below it.' },
            { id: 'engineer', name: 'Engineer', icon: 'code', color: '#0ea5e9', model: AI_MODEL,
              prompt: 'ENGINEERING AGENT: Focus on implementation, architecture, code quality, edge cases, and practical solutions. Be precise and actionable. Use native reasoning or <thinking>...</thinking>, then write a clear actionable answer.' },
            { id: 'researcher', name: 'Researcher', icon: 'globe', color: '#10b981', model: LLAMA_70B,
              prompt: 'RESEARCH AGENT: Explore breadth of perspectives, recent developments, alternatives, and synthesize diverse viewpoints. Surface non-obvious insights. Provide both reasoning and a substantive synthesized answer.' },
        ];
        const makeThumbnail = (dataUrl) => new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX = 240;
                const aspect = img.width / img.height;
                const [w, h] = aspect > 1 ? [MAX, Math.round(MAX / aspect)] : [Math.round(MAX * aspect), MAX];
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', 0.65));
            };
            img.onerror = () => resolve(null);
            img.src = dataUrl;
        });

        // --- DOCUMENT BLOCK ---
        const DocumentBlock = ({ filename, docType, content }) => {
            const [copied, setCopied] = useState(false);
            const download = () => {
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = filename || 'document.txt';
                a.click(); URL.revokeObjectURL(url);
            };
            const copyDoc = () => { navigator.clipboard.writeText(content); setCopied(true); setTimeout(() => setCopied(false), 2000); };
            const ext = (filename || '').split('.').pop().toLowerCase();
            const iconMap = { md: 'file-text', txt: 'file-text', csv: 'table', json: 'code', html: 'code', css: 'code', js: 'code' };
            const icon = iconMap[ext] || 'file';
            return (
                <div className="doc-block sonnet-reveal-block">
                    <div className="doc-block-header">

                        <button type="button" onClick={copyDoc} className="doc-dl-btn" title={copied ? 'Copied!' : 'Copy'} style={{ marginRight: 4 }}>
                            <Icon name={copied ? 'check' : 'copy'} size={12} /> {copied ? 'Copied' : 'Copy'}
                        </button>
                        <button type="button" onClick={download} className="doc-dl-btn"><Icon name="download-simple" size={12} /> Download</button>
                    </div>
                    <div className="doc-block-body">{content}</div>
                </div>
            );
        };

        // --- CHART BLOCK ---
        const ChartBlock = ({ title, rows }) => {
            const vals = rows.map(r => r.value);
            const max = Math.max(...vals, 1);
            const total = vals.reduce((s, v) => s + v, 0);
            return (
                <div className="chart-block sonnet-reveal-block">
                    {title && <div className="chart-title">{title}</div>}
                    {rows.map((row, i) => {
                        const pct = total > 0 ? Math.round((row.value / total) * 100) : 0;
                        const barPct = (row.value / max) * 100;
                        return (
                        <div key={i} className="chart-bar-row">
                            <span className="chart-label" title={row.label}>{row.label}</span>
                            <div className="chart-bar-bg">
                                <div className="chart-bar-fill" style={{width: `${barPct}%`}}>
                                    {barPct > 12 && <span className="chart-bar-pct">{pct}%</span>}
                                </div>
                            </div>
                            <span className="chart-val">{row.value}</span>
                        </div>
                        );
                    })}
                </div>
            );
        };

        // --- SEMANTIC RESPONSE CACHE ---
        const _respCache = new Map();
        const _CACHE_TTL = 20 * 60 * 1000; // 20 min — shorter to keep answers fresh
        const _MAX_CACHE_SIZE = 60;
        // Cache key includes a short hash of the last assistant message to prevent cross-conversation cache hits
        // (same prompt in two different conversations with different context gets different cache slots)
        const _miniHash = (s) => { let h = 0; for (let i = 0; i < Math.min(s.length, 80); i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); };
        const _cacheKey = (prompt, model, mode, ctxHash = '') => `${model}::${mode}::${ctxHash}::${(prompt || '').toLowerCase().trim().slice(0, 400)}`;
        const getCachedResponse = (prompt, model, mode, ctxHash = '') => {
            const h = _respCache.get(_cacheKey(prompt, model, mode, ctxHash));
            return (h && Date.now() - h.ts < _CACHE_TTL) ? h.r : null;
        };
        const setCachedResponse = (prompt, model, mode, v, ctxHash = '') => {
            if (!v || v.length < 30) return;
            if (_respCache.size >= _MAX_CACHE_SIZE) {
                const oldest = [..._respCache.entries()].sort((a, b) => a[1].ts - b[1].ts)[0];
                if (oldest) _respCache.delete(oldest[0]);
            }
            _respCache.set(_cacheKey(prompt, model, mode, ctxHash), { r: v, ts: Date.now() });
        };

        // --- IMAGE COMPRESS — always JPEG, max 512px for reliable API payload ---
        const compressImageForVision = (dataUrl) => new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const MAX = 512;
                let { width, height } = img;
                const ratio = Math.min(MAX / width, MAX / height, 1);
                width = Math.round(width * ratio);
                height = Math.round(height * ratio);
                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                const compressed = canvas.toDataURL('image/jpeg', 0.7);
                resolve(compressed);
            };
            img.onerror = () => resolve(dataUrl);
            img.src = dataUrl;
        });

        // --- IMAGE ANALYSIS — tries every key × model combo until one works ---
        const _callVisionApi = async (model, imgUrl, apiKey, userQuestion = '') => {
            try {
                const q = (userQuestion || '').trim();
                const visionPrompt = q
                    ? `The user attached an image and asked: "${q.slice(0, 500)}"

Describe what is visible in this image, focusing on details needed to answer their question accurately. Include relevant visible text verbatim, key objects, people, colors, spatial relationships, and any charts/code/diagrams. Be specific and objective. Prioritize information that helps answer: "${q.slice(0, 200)}"`
                    : 'Describe this image comprehensively for an AI assistant that needs to answer questions about it. Cover: (1) main subject and what is happening, (2) all visible text — read it verbatim, (3) people — appearance, expressions, clothing, actions, (4) objects — their type, color, condition, position, (5) setting/environment — indoor/outdoor, background details, (6) color palette and lighting mood, (7) any data, charts, code, or diagrams — describe their content precisely, (8) anything unusual, notable, or potentially important. Be specific and objective.';
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                        body: JSON.stringify({
                        model,
                        messages: [{ role: 'user', content: [
                            { type: 'text', text: visionPrompt },
                            { type: 'image_url', image_url: { url: imgUrl } }
                        ]}],
                        max_tokens: 900
                    })
                });
                if (!res.ok) return null;
                const d = await res.json();
                return d.choices?.[0]?.message?.content || null;
            } catch { return null; }
        };

        const analyzeImage = async (dataUrl, userQuestion = '') => {
            try {
                const compressed = await compressImageForVision(dataUrl);
                const models = [...new Set(VISION_MODELS)];
                for (const model of models) {
                    for (const key of [...API_KEYS, ...COMPLETE_FALLBACK_KEYS]) {
                        const result = await _callVisionApi(model, compressed, key, userQuestion);
                        if (result) return result;
                    }
                }
                return null;
            } catch { return null; }
        };

        const stripMarkdownForSpeech = (text) => {
            if (!text) return '';
            return text
                .replace(/<(?:thinking|think|redacted_thinking)>[\s\S]*?<\/(?:thinking|think|redacted_thinking)>/gi, '')
                .replace(/```[\s\S]*?```/g, ' ')
                .replace(/`([^`]+)`/g, '$1')
                .replace(/!\[[^\]]*\]\([^)]+\)/g, '')
                .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
                .replace(/^#{1,6}\s+/gm, '')
                .replace(/[*_~>|]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        };

        const chunkTextForSpeech = (text, maxLen = 180) => {
            const clean = stripMarkdownForSpeech(text);
            if (!clean) return [];
            const sentences = clean.match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g) || [clean];
            const chunks = [];
            let buf = '';
            for (const raw of sentences) {
                const s = raw.trim();
                if (!s) continue;
                if (s.length > maxLen) {
                    if (buf.trim()) { chunks.push(buf.trim()); buf = ''; }
                    for (let i = 0; i < s.length; i += maxLen) chunks.push(s.slice(i, i + maxLen).trim());
                    continue;
                }
                const next = buf ? `${buf} ${s}` : s;
                if (next.length > maxLen) {
                    if (buf.trim()) chunks.push(buf.trim());
                    buf = s;
                } else buf = next;
            }
            if (buf.trim()) chunks.push(buf.trim());
            return chunks.filter(Boolean);
        };

        const pickBrowserVoice = () => {
            if (!('speechSynthesis' in window)) return null;
            const voices = window.speechSynthesis.getVoices();
            return voices.find(v => /Microsoft Aria|Microsoft Jenny|Microsoft Guy|Google US English|Natural|Samantha|Zira|Daniel/i.test(v.name))
                || voices.find(v => v.lang === 'en-US')
                || voices.find(v => v.lang.startsWith('en'))
                || null;
        };

        const fetchFibreOralAudio = async (input, voice, signal) => {
            const payload = JSON.stringify({
                model: FIBRE_ORAL_TTS_MODEL,
                input: input.slice(0, 200),
                voice: voice || 'hannah',
                response_format: 'wav',
            });
            for (const key of FIBRE_ORAL_SPEECH_KEYS) {
                if (signal?.aborted) return { ok: false, aborted: true };
                try {
                    const res = await fetch(FIBRE_ORAL_TTS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${key}` },
                        body: payload,
                        signal,
                    });
                    if (res.ok) {
                        const buffer = await res.arrayBuffer();
                        if (buffer.byteLength > 100) return { ok: true, buffer };
                    }
                } catch (e) {
                    if (e.name === 'AbortError') return { ok: false, aborted: true };
                }
            }
            return { ok: false };
        };

        const transcribeFibreOral = async (audioBlob) => {
            const form = new FormData();
            form.append('file', audioBlob, 'voice.webm');
            form.append('model', WHISPER_MODEL);
            form.append('language', 'en');
            form.append('response_format', 'json');
            for (const key of [...new Set([...COMPLETE_FALLBACK_KEYS, ...API_KEYS])]) {
                try {
                    const res = await fetch(WHISPER_API_URL, {
                        method: 'POST',
                        headers: { Authorization: `Bearer ${key}` },
                        body: form,
                    });
                    if (res.ok) {
                        const data = await res.json();
                        return (data.text || '').trim();
                    }
                } catch {}
            }
            return '';
        };

        // --- QUICK REPLY GENERATOR ---
        const generateQuickReplies = async (aiMsg, userMsg = '') => {
            try {
                const isCodeContext = /```[\s\S]*?```|function\s+\w|const\s+\w|class\s+\w|def\s+\w|import\s+|require\(/.test(aiMsg);
                const userCtx = userMsg ? `\nUser asked: "${userMsg.slice(0, 180)}"` : '';
                const codeHint = isCodeContext
                    ? '\nThis response contained code. Include at least one code-related follow-up: e.g. "Add error handling", "Make this TypeScript", "Write tests for this", "Explain line by line", "Optimize this function".'
                    : '';
                const r = await utilApiCall([
                    { role: 'system', content: `You generate short, natural follow-up messages that a USER would genuinely type next. Each must be directly tied to the specific content — not generic. Write exactly 3 messages. Rules: first-person or imperative voice, max 8 words each, varied in angle (e.g. dig deeper on one point, ask for a practical example, challenge an assumption, request a comparison, or ask a clarifying "what if"). NEVER use "Tell me more", "Can you explain", "Go on", or any generic phrases.${codeHint} Return ONLY a JSON array of 3 strings.` },
                    { role: 'user', content: `${userCtx}\nAI response:\n"${aiMsg.slice(0, 700)}"` }
                ], 280, true);
                const p = parseJsonArray(r);
                return Array.isArray(p) ? p.filter(s => typeof s === 'string' && s.trim().length > 2).slice(0, 3) : [];
            } catch { return []; }
        };

        // --- UTILITY API CALL (for titles, suggestions) — tries fast models with full key fallback ---
        const UTIL_MODELS = ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant', FAST_MODEL];
        // isJson=true → lower temp for reliable structured output
        const utilApiCall = async (messages, maxTokens = 300, isJson = false) => {
            const keys = [...new Set([UTIL_KEY, ...API_KEYS, ...COMPLETE_FALLBACK_KEYS])];
            const temperature = isJson ? 0.35 : 0.68;
            for (const model of UTIL_MODELS) {
                for (const key of keys) {
                    try {
                        const body = { model, messages, max_tokens: maxTokens, temperature };
                        // 8s timeout per attempt — prevents indefinite hang on slow API
                        const ctrl = new AbortController();
                        const tid = setTimeout(() => ctrl.abort(), 8000);
                        const res = await fetch(API_URL, {
                            method: 'POST',
                            signal: ctrl.signal,
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                            body: JSON.stringify(body)
                        });
                        clearTimeout(tid);
                        if (!res.ok) {
                            if (res.status === 401 || res.status === 403) break;
                            continue;
                        }
                        const data = await res.json();
                        return data.choices?.[0]?.message?.content || null;
                    } catch { continue; }
                }
            }
            return null;
        };

        const SUGGESTION_ICON_MAP = {
            code: 'code', python: 'code', debug: 'bug', api: 'code',
            write: 'pencil-simple', essay: 'article', story: 'book-open-text',
            explain: 'chats-circle', learn: 'graduation-cap', teach: 'book-open',
            math: 'calculator', science: 'atom', research: 'magnifying-glass',
            news: 'newspaper', world: 'globe', travel: 'airplane',
            food: 'cooking-pot', art: 'palette', music: 'music-notes',
            business: 'briefcase', idea: 'lightbulb', email: 'envelope',
            history: 'clock', space: 'planet', game: 'game-controller',
            plan: 'calendar-blank', health: 'heart', design: 'paint-brush',
        };
        const getIconForText = (text) => {
            const lower = (text || '').toLowerCase();

            const t = text.trim();
            const lower = t.toLowerCase();
            const trivial = /^(hi|hello|hey|yo|sup|what'?s up|thanks|thank you|ok|okay|yes|no|sure|good\s+(morning|afternoon|evening)|lol|haha|nice|cool|wow|great|awesome|got it|understood|perfect|sounds good|makes sense)[\s!.,?]*$/i.test(t);
            if (trivial || t.length < 20) return 'instant';

            // Personal / emotional messages — instant mode, warmth > analysis
            if (/\b(feel|feeling|stressed|anxious|sad|worried|struggling|hard time|difficult|overwhelmed|lonely|vent|talk to someone)\b/i.test(lower) && t.length < 150) return 'instant';

            // Simple factual one-liners → instant
            if (t.length < 45 && !/\b(code|debug|fix|implement|explain|calculate|compare|why|how does|difference)\b/i.test(lower)) return 'instant';

            // Short trivia/knowledge queries → instant (e.g. "What is the capital of France?")
            if (t.split(/\s+/).length <= 9 && /^(what|who|where|when|which|how many|how much|how long|how tall|how old|what year|what color)\b/i.test(lower) && !/\b(explain|compare|analyze|difference|between|why|how does)\b/i.test(lower)) return 'instant';

            // Heavy research / analysis → max
            const maxTriggers = /\b(research|analyze|analyse|compare.*in depth|evaluate|critique|philosophy|explain in depth|deep dive|comprehensive|thorough|everything about|all aspects|write a report|write an essay|pros and cons|best approach|how does .{3,40} work|step-by-step guide|full breakdown|in-depth|detailed explanation|complete overview|teach me everything|walk me through|full analysis)\b/i;
            if (maxTriggers.test(lower) || t.length > 220) return 'max';

            // Heavy code / engineering → max (needs careful reasoning)
            if (/\b(implement|build a|create a|architect|system design|data structure|algorithm|optimize|refactor|design pattern|full.?stack|write a program|write a complete)\b/i.test(lower)) return 'max';

            // Creative writing → max (needs planning)
            if (/\b(write a story|write an essay|write a poem|compose|screenplay|narrative|creative writing)\b/i.test(lower)) return 'max';

            // Math / proofs / derivations → always at least thinking
            if (/\b(math|proof|derive|integral|derivative|equation|formula|probability|calculate|solve for|matrix)\b/i.test(lower)) return 'thinking';

            // Debugging, fixes, code questions → thinking
            if (/\b(debug|fix|error|not working|broken|code|function|class|loop|async|api|query|sql|regex|algorithm|why (is|does|isn'?t|doesn'?t))\b/i.test(lower)) return 'thinking';

            // "Explain in detail / in depth / fully / thoroughly" → max, not just thinking
            if (/\b(explain\s+(in\s+detail|in\s+depth|fully|thoroughly|completely|step\s+by\s+step|from scratch|like i'?m|to a beginner))\b/i.test(lower)) return 'max';

            // Explanation / comparison → thinking
            if (/\b(why|explain|understand|how does|difference between|compare|vs\.?|what causes|what is the)\b/i.test(lower) && t.length > 40) return 'thinking';

            // Planning, scheduling, decisions → thinking
            if (/\b(plan|schedule|prioritize|decide|should i|is it worth|tradeoff|pros and cons|best way to|how to approach)\b/i.test(lower)) return 'thinking';

            // Anything moderately long → thinking
            if (t.length > 80) return 'thinking';

            return 'instant';
        };

        const calcMenuPos = (rect, estH, preferUp = false) => {
            const w = Math.max(rect.width, 220);
            const spaceBelow = window.innerHeight - rect.bottom;
            const spaceAbove = rect.top;
            const up = preferUp || (spaceBelow < estH + 12 && spaceAbove > spaceBelow);
            const left = Math.min(Math.max(8, rect.left), window.innerWidth - w - 8);
            const top = up ? Math.max(8, rect.top - estH - 8) : Math.min(rect.bottom + 8, window.innerHeight - estH - 8);
            return { top, left, width: w, up };
        };

        // --- STREAM REVEAL — medium typewriter pace with catchup mode ---
        const useStreamReveal = (targetText, isReceiving, onTick) => {
            const [display, setDisplay] = useState('');
            const indexRef = useRef(0);
            const targetRef = useRef('');
            const rafRef = useRef(null);
            const receivingRef = useRef(false);
            const pauseUntilRef = useRef(0);
            const onTickRef = useRef(onTick);
            const [isAnimating, setIsAnimating] = useState(false);
            useEffect(() => { onTickRef.current = onTick; }, [onTick]);

            useEffect(() => { targetRef.current = targetText || ''; }, [targetText]);

            useEffect(() => {
                if (isReceiving && !receivingRef.current) {
                    indexRef.current = 0;
                    pauseUntilRef.current = 0;
                    setDisplay('');
                }
                receivingRef.current = !!isReceiving;
            }, [isReceiving]);

            useEffect(() => {
                let lastTick = 0;
                const step = (now) => {
                    const target = targetRef.current;
                    const receiving = receivingRef.current;
                    if (indexRef.current > target.length) indexRef.current = target.length;

                    if (indexRef.current < target.length) {
                        if (now < pauseUntilRef.current) {
                            rafRef.current = requestAnimationFrame(step);
                            return;
                        }
                        if (!lastTick) lastTick = now;
                        const behind = target.length - indexRef.current;
                        // Catchup mode: if more than 300 chars behind, accelerate significantly
                        const catchupMode = receiving && behind > 300;
                        const tickMs = catchupMode ? 12 : (receiving ? 44 : 14);
                        const elapsed = now - lastTick;
                        if (elapsed >= tickMs) {
                            lastTick = now;
                            let add;
                            if (catchupMode) {
                                // Rapid catch-up: consume large chunks until within 120 chars
                                add = Math.min(behind - 120, behind > 600 ? 18 : 10);
                                add = Math.max(add, 4);
                            } else {
                                add = receiving
                                    ? (behind > 100 ? 2 : 1)
                                    : Math.min(behind, behind > 40 ? 12 : behind > 12 ? 6 : 3);
                            }
                            if (receiving && add > 1) {
                                const slice = target.slice(indexRef.current, indexRef.current + add);
                                const sp = slice.lastIndexOf(' ');
                                if (sp > 0) add = sp + 1;
                            }
                            indexRef.current = Math.min(indexRef.current + add, target.length);
                            setDisplay(target.slice(0, indexRef.current));
                            onTickRef.current?.();
                            const ch = target[indexRef.current - 1];
                            if (receiving && !catchupMode) {
                                if (/[.!?]/.test(ch)) pauseUntilRef.current = now + 130;
                                else if (ch === '\n') pauseUntilRef.current = now + 80;
                            }
                        }
                    }
                    setIsAnimating(indexRef.current < target.length);
                    rafRef.current = requestAnimationFrame(step);
                };
                rafRef.current = requestAnimationFrame(step);
                return () => { if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current = null; } };
            }, []);

            return { display, isAnimating };
        };

        const StreamMarkdown = ({ content, isReceiving, onRevealTick, onRevealComplete }) => {
            const { display: revealed, isAnimating } = useStreamReveal(content || '', isReceiving, onRevealTick);
            const active = isReceiving || isAnimating;

            useEffect(() => {
                if (!isReceiving && !isAnimating) onRevealComplete?.();
            }, [isReceiving, isAnimating, onRevealComplete]);

            return (
                <div className={`sonnet-stream-reveal${active ? ' is-streaming' : ''}`}>
                    <Markdown content={revealed} isStreaming={active} showStreamCaret={active} />
                </div>
            );
        };

        // --- SLOW TYPEWRITER (post-stream / non-streaming replay) ---
        const useTypewriter = (text, isActive, typeSpeed = 18) => {
            const [display, setDisplay] = useState('');
            const [complete, setComplete] = useState(false);
            const indexRef = useRef(0);
            const rafRef = useRef(null);
            const lastTimeRef = useRef(0);

            useEffect(() => {
                if (!text) return;
                if (text.startsWith('![')) { setDisplay(text); setComplete(true); return; }
                if (!isActive) { setDisplay(text); setComplete(true); return; }
                
                setDisplay(''); setComplete(false); indexRef.current = 0; lastTimeRef.current = 0;
                
                const speed = typeSpeed;
                
                const step = (timestamp) => {
                    if (!lastTimeRef.current) lastTimeRef.current = timestamp;
                    const elapsed = timestamp - lastTimeRef.current;
                    
                    if (elapsed >= speed) {
                        lastTimeRef.current = timestamp;
                        if (indexRef.current < text.length) {
                            const frames = Math.max(1, Math.floor(elapsed / speed));
                            const charsToAdd = Math.min(frames * 4, text.length - indexRef.current);
                            indexRef.current += charsToAdd;
                            setDisplay(text.slice(0, indexRef.current));
                        } else {
                            setDisplay(text);
                            setComplete(true);
                            return;
                        }
                    }
                    rafRef.current = requestAnimationFrame(step);
                };
                rafRef.current = requestAnimationFrame(step);
                return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
            }, [text, isActive]);

            return { display, complete };
        };

        // --- CODE BLOCK ---
        const LANG_COLORS = {
            python: '#3b82f6', py: '#3b82f6',
            javascript: '#f59e0b', js: '#f59e0b', jsx: '#f59e0b',
            typescript: '#6366f1', ts: '#6366f1', tsx: '#6366f1',
            rust: '#f97316', go: '#06b6d4', golang: '#06b6d4',
            css: '#ec4899', html: '#ef4444', sql: '#10b981',
            bash: '#6b7280', sh: '#6b7280', shell: '#6b7280',
            json: '#a78bfa', yaml: '#a78bfa', yml: '#a78bfa',
            ruby: '#dc2626', rb: '#dc2626', php: '#818cf8',
            java: '#f97316', kotlin: '#7c3aed', swift: '#f59e0b',
            cpp: '#3b82f6', 'c++': '#3b82f6', c: '#3b82f6',
        };

        const CodeBlock = ({ language, code }) => {
            const [copied, setCopied] = useState(false);
            const [wrapped, setWrapped] = useState(false);
            const handleCopy = () => { navigator.clipboard.writeText(code); setCopied(true); setTimeout(() => setCopied(false), 2000); };
            const lines = code.split('\n');
            const lang = (language || '').toLowerCase();
            const badgeColor = LANG_COLORS[lang];
            return (
                <div className={`code-wrap${wrapped ? ' code-wrap-wrap' : ''}`}>
                    <div className="code-header">
                        <span style={badgeColor ? { color: badgeColor } : {}}>{language || 'plaintext'}</span>
                        <span className="code-line-count">{lines.length} line{lines.length !== 1 ? 's' : ''}</span>
                        <div style={{ display: 'flex', gap: 4, marginLeft: 'auto' }}>
                            <button type="button" className="code-copy-btn" title={wrapped ? 'Disable wrap' : 'Wrap long lines'} onClick={() => setWrapped(w => !w)}>
                                <Icon name="arrows-out-line-horizontal" size={12} />
                            </button>
                            <button type="button" onClick={handleCopy} className="code-copy-btn">
                                {copied ? <Icon name="check" size={13} /> : <Icon name="copy" size={13} />}
                                {copied ? 'Copied' : 'Copy'}
                            </button>
                        </div>
                    </div>
                    <div className="code-body">
                        <table><tbody>{lines.map((line, i) => (
                            <tr key={i}>
                                <td>{i + 1}</td>
                                <td>{line || ' '}</td>
                            </tr>
                        ))}</tbody></table>
                    </div>
                </div>
            );
        };

        const sanitizeStreamingMarkdown = (text) => {
            if (!text) return text;
            return text
                .replace(/:::ide-(?:edit|patch)[\s\S]*$/i, '')
                .replace(/:::document[\s\S]*$/i, '')
                .replace(/:::chart[\s\S]*$/i, '');
        };

        // --- MARKDOWN ---
        const Markdown = ({ content, isStreaming, showStreamCaret }) => {
            if (!content || typeof content !== 'string') return null;
            const safeContent = isStreaming ? sanitizeStreamingMarkdown(content) : content;

            // --- Parse special blocks: :::document, :::chart ---
            const renderSpecialBlocks = (text) => {
                const allBlocks = [];

                let m;
                // collect :::document blocks
                const textCopy = text;
                const docRegex = /:::document([^\n]*)\n([\s\S]*?):::/g;
                while ((m = docRegex.exec(textCopy)) !== null) {
                    const meta = m[1].trim();
                    const fnMatch = meta.match(/filename=["']?([^"'\s]+)["']?/);
                    const typeMatch = meta.match(/type=["']?([^"'\s]+)["']?/);
                    allBlocks.push({ start: m.index, end: m.index + m[0].length, type: 'doc', filename: fnMatch?.[1] || 'document.txt', docType: typeMatch?.[1] || 'txt', content: m[2] });
                }
                // collect :::chart blocks
                const chartRegex = /:::chart([^\n]*)\n([\s\S]*?):::/g;
                while ((m = chartRegex.exec(textCopy)) !== null) {
                    const meta = m[1].trim();
                    const titleMatch = meta.match(/title=["']?([^"']+)["']?/);
                    const rows = m[2].trim().split('\n').map(line => {
                        const [label, val] = line.split(':').map(s => s.trim());
                        return { label: label || '', value: parseFloat(val) || 0 };
                    }).filter(r => r.label);
                    allBlocks.push({ start: m.index, end: m.index + m[0].length, type: 'chart', title: titleMatch?.[1] || '', rows });
                }

                if (allBlocks.length === 0) return null;

                allBlocks.sort((a, b) => a.start - b.start);
                const result = [];
                let cursor = 0;
                allBlocks.forEach((block, bi) => {
                    if (block.start > cursor) {
                        result.push(<Markdown key={`pre-${bi}`} content={textCopy.slice(cursor, block.start)} isStreaming={isStreaming} showStreamCaret={showStreamCaret && bi === allBlocks.length - 1 && block.start > cursor} />);
                    }
                    if (block.type === 'doc') {
                        result.push(<DocumentBlock key={`doc-${bi}`} filename={block.filename} docType={block.docType} content={block.content} />);
                    } else if (block.type === 'chart') {
                        result.push(<ChartBlock key={`chart-${bi}`} title={block.title} rows={block.rows} />);
                    }
                    cursor = block.end;
                });
                if (cursor < textCopy.length) result.push(<Markdown key="post" content={textCopy.slice(cursor)} isStreaming={isStreaming} showStreamCaret={showStreamCaret} />);
                return <>{result}</>;
            };

            const specialResult = renderSpecialBlocks(safeContent);
            if (specialResult) return <div className="prose-content">{specialResult}</div>;

            const renderLine = (line, j) => {
                if (!line.trim()) return <div key={j} className="h-1.5"/>;
                if (line.startsWith('![') && line.includes('](')) {
                    const url = line.match(/\((.*?)\)/)?.[1];
                    if (!url) return <p key={j}>{line}</p>;
                    return (<div key={j} className="md-image"><img src={url} alt="Generated" loading="lazy" /></div>);
                }
                if (line.trim() === '---' || line.trim() === '***' || line.trim() === '___') return <hr key={j} className="md-hr" />;
                if (line.startsWith('####')) return <h4 key={j}>{parseLine(line.replace(/^#+\s/, ''))}</h4>;
                if (line.startsWith('###')) return <h3 key={j}>{parseLine(line.replace(/^#+\s/, ''))}</h3>;
                if (line.startsWith('##')) return <h2 key={j}>{parseLine(line.replace(/^#+\s/, ''))}</h2>;
                if (line.startsWith('#')) return <h1 key={j}>{parseLine(line.replace(/^#+\s/, ''))}</h1>;
                if (line.startsWith('> ')) return <blockquote key={j} className="md-blockquote">{parseLine(line.slice(2))}</blockquote>;
                if (line.trim().match(/^- \[x\] /i)) return { __task: true, checked: true, content: line.trim().replace(/^- \[x\] /i, '') };
                if (line.trim().match(/^- \[ \] /)) return { __task: true, checked: false, content: line.trim().replace(/^- \[ \] /, '') };
                if (line.trim().startsWith('- ') || line.trim().startsWith('* ')) return { __ul: true, content: line.replace(/^\s*[-*]\s/, '') };
                if (line.trim().match(/^\d+\./)) return { __ol: true, content: line.replace(/^\s*\d+\.\s/, '') };
                if (line.trim().match(/^\[!(\w+)\]\s*(.*)/i)) {
                    const m = line.trim().match(/^\[!(\w+)\]\s*(.*)/i);
                    return <div key={j} className="md-callout"><strong>{m[1]}</strong>{m[2] ? ' — ' : ''}{parseLine(m[2] || '')}</div>;
                }
                if (line.trim().startsWith('|') && line.trim().endsWith('|')) return { __tableRow: line };
                return <p key={j}>{parseLine(line)}</p>;
            };

            let sections = safeContent.split('```');
            let pendingCode = null;
            if (isStreaming && sections.length % 2 === 0) {
                pendingCode = sections.pop();
            }

            // Group consecutive table rows
            const groupTableRows = (items) => {
                const out = [];
                let tableRows = null;
                items.forEach((item, idx) => {
                    if (item && item.__tableRow) {
                        if (!tableRows) tableRows = [];
                        const cells = item.__tableRow.split('|').slice(1, -1).map(c => c.trim());
                        // Skip separator rows like | --- | :---: | ---: |
                        if (cells.every(c => /^:?-{2,}:?$/.test(c.trim()))) return;
                        tableRows.push(cells);
                    } else {
                        if (tableRows) { out.push({ __table: tableRows }); tableRows = null; }
                        out.push(item);
                    }
                });
                if (tableRows) out.push({ __table: tableRows });
                return out;
            };

            const rawItems = sections.flatMap((sec, i) => {
                if (i % 2 === 1) {
                    const [lang, ...code] = sec.split('\n');
                    return [<CodeBlock key={`cb-${i}`} language={lang} code={code.join('\n')} />];
                }
                return sec.split('\n').map((line, j) => renderLine(line, `${i}-${j}`));
            });

            const grouped = groupTableRows(rawItems);

            if (pendingCode !== null) {
                const nl = pendingCode.indexOf('\n');
                const lang = nl === -1 ? pendingCode.trim() : pendingCode.slice(0, nl).trim();
                const code = nl === -1 ? '' : pendingCode.slice(nl + 1);
                grouped.push(
                    <div key="code-pending" className="code-wrap code-streaming">
                        <div className="code-header">
                            <span>{lang || 'code'}</span>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                <span className="code-streaming-label">writing…</span>
                                {code && <button type="button" className="code-copy-btn" title="Copy so far" onClick={() => navigator.clipboard.writeText(code).catch(() => {})}>
                                    <Icon name="copy" size={12} />
                                </button>}
                            </div>
                        </div>
                        <pre className="code-stream-pre"><code>{code}</code></pre>
                    </div>
                );
            }

            const groupLists = (items) => {
                const out = [];
                let ul = null, ol = null;
                const flush = () => {
                    if (ul?.length) { out.push(<ul key={`ul-${out.length}`}>{ul}</ul>); ul = null; }
                    if (ol?.length) { out.push(<ol key={`ol-${out.length}`}>{ol}</ol>); ol = null; }
                };
                items.forEach((item, idx) => {
                    if (!item) return;
                    if (item.__table) {
                        flush();
                        const [header, ...body] = item.__table;
                        out.push(
                            <div key={`tbl-${idx}`} className="overflow-x-auto my-2">
                                <table className="md-table">
                                    <thead><tr>{header.map((h, k) => <th key={k}>{h}</th>)}</tr></thead>
                                    <tbody>{body.map((row, ri) => <tr key={ri}>{row.map((cell, ci) => <td key={ci}>{parseLine(cell)}</td>)}</tr>)}</tbody>
                                </table>
                            </div>
                        );
                        return;
                    }
                    if (item.__ul) {
                        if (ol) { out.push(<ol key={`ol-${out.length}`}>{ol}</ol>); ol = null; }
                        if (!ul) ul = [];
                        ul.push(<li key={`uli-${ul.length}`}>{parseLine(item.content)}</li>);
                        return;
                    }
                    if (item.__ol) {
                        if (ul) { out.push(<ul key={`ul-${out.length}`}>{ul}</ul>); ul = null; }
                        if (!ol) ol = [];
                        ol.push(<li key={`oli-${ol.length}`}>{parseLine(item.content)}</li>);
                        return;
                    }
                    if (item.__task) {
                        flush();
                        out.push(
                            <div key={`task-${idx}`} className="md-task-item">
                                <input type="checkbox" defaultChecked={item.checked} disabled />
                                <span style={item.checked ? { textDecoration: 'line-through', opacity: 0.6 } : {}}>{parseLine(item.content)}</span>
                            </div>
                        );
                        return;
                    }
                    flush();
                    out.push(item);
                });
                flush();
                return out;
            };

            const finalItems = groupLists(grouped);
            // Inject stream caret at the end of the last paragraph-like element
            if (showStreamCaret && finalItems.length > 0) {
                const last = finalItems[finalItems.length - 1];
                if (React.isValidElement(last) && (last.type === 'p' || last.type === 'li')) {
                    const kids = last.props.children;
                    const kidsArr = Array.isArray(kids) ? kids : (kids != null ? [kids] : []);
                    finalItems[finalItems.length - 1] = React.cloneElement(last, {}, ...kidsArr, <span key="sc" className="stream-caret" aria-hidden="true" />);
                } else if (!React.isValidElement(last) || (last.type !== 'div' && last.type !== 'pre')) {
                    // For non-paragraph last elements (headings, etc.), append caret after
                    finalItems.push(<span key="sc-after" className="stream-caret" aria-hidden="true" />);
                }
                // For code blocks, tables, divs — caret stays visually after
            }
            return (
                <div className="prose-content">
                    {finalItems}
                </div>
            );
        };

        const addEmojiSpacing = (text) => {
            // Ensure emojis have a thin space on each side when adjacent to letters/digits
            if (!text || typeof text !== 'string') return text;
            return text
                .replace(/([a-zA-Z0-9\u00C0-\u024F])(\p{Emoji_Presentation}|\p{Extended_Pictographic})/gu, '$1\u202F$2')
                .replace(/(\p{Emoji_Presentation}|\p{Extended_Pictographic})([a-zA-Z0-9\u00C0-\u024F])/gu, '$1\u202F$2');
        };

        const parseLine = (text) => {
            if (!text) return null;
            const spacedText = addEmojiSpacing(text);
            // Token regex: code first, then bold (** before *), strikethrough, italic, link
            const TOKEN_RE = /(`[^`\n]+?`|\*\*(?:[^*]|\*(?!\*))+?\*\*|~~[^~\n]+?~~|\*(?:[^*\n])+?\*|_(?:[^_\n])+?_|\[[^\]]+\]\([^)\s]+\))/g;
            const parts = [];
            let last = 0, m;
            while ((m = TOKEN_RE.exec(spacedText)) !== null) {
                if (m.index > last) parts.push(spacedText.slice(last, m.index));
                parts.push(m[0]);
                last = m.index + m[0].length;
            }
            if (last < spacedText.length) parts.push(spacedText.slice(last));
            return parts.map((p, k) => {
                if (p.startsWith('**') && p.endsWith('**') && p.length > 4) return <strong key={k} style={{fontWeight:600, color:'inherit'}}>{parseLine(p.slice(2,-2))}</strong>;
                if (p.startsWith('`') && p.endsWith('`') && p.length > 2) return <code key={k}>{p.slice(1,-1)}</code>;
                if (p.startsWith('~~') && p.endsWith('~~') && p.length > 4) return <del key={k} style={{opacity:0.6}}>{p.slice(2,-2)}</del>;
                if ((p.startsWith('*') && p.endsWith('*') && p.length > 2) || (p.startsWith('_') && p.endsWith('_') && p.length > 2)) return <em key={k}>{p.slice(1,-1)}</em>;
                const linkMatch = p.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
                if (linkMatch) return <a key={k} href={linkMatch[2]} target="_blank" rel="noopener noreferrer" className="md-link">{linkMatch[1]}</a>;
                return p;
            });
        };

        // --- EXTRACT THINKING ---
        // Uses lastIndexOf for closing tag so nested <thinking> refs (model echoing
        // system prompt examples) don't cause the block to split too early.
        const extractThinking = (text) => {
            if (!text) return { thinking: '', answer: '' };
            const openIdx = text.search(/<(?:thinking|think)>/);
            if (openIdx === -1) return { thinking: '', answer: text };
            const openTag = text.slice(openIdx, openIdx + 10) === '<thinking>' ? '<thinking>' : '<think>';
            // Use LAST closing tag to handle any nested <thinking> tags
            let lastClose = text.lastIndexOf('</thinking>');
            if (lastClose === -1) lastClose = text.lastIndexOf('</think>');
            if (lastClose === -1) {
                // Still streaming — no closing tag yet, show everything as thinking
                return { thinking: text.slice(openIdx + openTag.length).trim(), answer: '' };
            }
            const closeTagLen = text.slice(lastClose, lastClose + 11) === '</thinking>' ? 11 : 8;
            const thinking = text.slice(openIdx + openTag.length, lastClose).trim();
            const answer = text.slice(lastClose + closeTagLen).replace(/^[\n\r\s]+/, '').trim();
            return { thinking, answer };
        };

        const stripThinking = (text) => {
            if (!text) return '';
            return text
                .replace(/<(?:thinking|think|redacted_thinking)>[\s\S]*?<\/(?:thinking|think|redacted_thinking)>/g, '')
                .replace(/<(?:thinking|think|redacted_thinking)>[\s\S]*/g, '')
                .replace(/<\/(?:thinking|think|redacted_thinking)>/g, '')
                .trim();
        };

        const parseInterleaved = (text) => {
            if (!text) return [];
            const segments = [];
            const re = /<(?:thinking|think|redacted_thinking)>([\s\S]*?)<\/(?:thinking|think|redacted_thinking)>/gi;
            let lastIdx = 0;
            let m;
            while ((m = re.exec(text)) !== null) {
                const before = text.slice(lastIdx, m.index).trim();
                if (before) segments.push({ type: 'answer', content: before });
                if (m[1].trim()) segments.push({ type: 'thinking', content: m[1].trim() });
                lastIdx = re.lastIndex;
            }
            let after = text.slice(lastIdx).trim();
            const openMatch = after.match(/<(?:thinking|think|redacted_thinking)>/i);
            if (openMatch) {
                const openIdx = after.indexOf(openMatch[0]);
                const ansBefore = after.slice(0, openIdx).trim();
                if (ansBefore) segments.push({ type: 'answer', content: ansBefore });
                const partial = after.slice(openIdx + openMatch[0].length).trim();
                if (partial) segments.push({ type: 'thinking', content: partial, partial: true });
            } else if (after) {
                segments.push({ type: 'answer', content: after });
            }
            if (!segments.length && text.trim()) segments.push({ type: 'answer', content: text.trim() });
            return segments;
        };

        // --- TWO-PHASE THINKING: reasoner model → writer model ---
        const countWords = (text) => (text || '').trim().split(/\s+/).filter(Boolean).length;

        const getTargetAnswerWords = (thinkingWords, { deep = false, attempt = 0 } = {}) => {
            const base = deep ? 0.5 : 0.4;
            const ratio = Math.min(base + attempt * 0.12, 0.7);
            return Math.min(Math.max(Math.round(thinkingWords * ratio), deep ? 150 : 80), 1600);
        };

        const needsAnswerSynthesis = (content, { deep = false } = {}) => {
            const { thinking, answer } = extractThinking(content);
            if (!thinking?.trim()) return false;
            const tWords = countWords(thinking);
            const aWords = countWords(answer);
            if (!aWords) return true;
            const minRatio = deep ? 0.42 : 0.35;
            if (aWords < 60 && tWords > 100) return true;
            if (tWords > 60 && aWords < tWords * minRatio) return true;
            if (deep && tWords > 200 && aWords < 150) return true;
            return aWords < 50 && tWords > 80;
        };

        const pickReasoningModel = (activeMode, fallback) =>
            activeMode === 'max' ? REASONING_MODEL : REASONING_MODEL;

        const buildModelExtras = (model, { thinking = false, effort = 'medium' } = {}) => {
            const extra = {};
            if (model.startsWith('openai/gpt-oss')) {
                if (thinking) extra.reasoning_effort = effort === 'high' ? 'high' : effort === 'low' ? 'low' : 'medium';
                extra.top_p = 0.9;
            } else if (model.startsWith('qwen/')) {
                extra.top_p = thinking ? 0.95 : 0.8;
                extra.top_k = 20;
                extra.min_p = 0;
                if (thinking) extra.reasoning_format = 'parsed';
            } else {
                extra.top_p = 0.9;
            }
            return extra;
        };

        const streamGroqChat = async ({ models, messages, keys, signal, temperature = 0.7, extra = {}, mode = 'content', onChunk, onUsage, thinkingOpts = {} }) => {
            const tryModels = [...new Set(models.filter(Boolean))];
            const tryKeys = keys || [API_KEY, FALLBACK_KEY, ...COMPLETE_FALLBACK_KEYS];
            let streamRes = null, usedModel = null;
            modelLoop: for (const model of tryModels) {
                const modelExtra = { ...buildModelExtras(model, thinkingOpts), ...extra };
                for (const key of tryKeys) {
                    try {
                        const r = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                            body: JSON.stringify({
                                model, messages, max_tokens: 8192, temperature,
                                stream: true, stream_options: { include_usage: true },
                                ...modelExtra,
                            }),
                            signal,
                        });
                        if (r.ok) { streamRes = r; usedModel = model; break modelLoop; }
                        if (r.status === 401 || r.status === 403) break modelLoop;
                    } catch (e) { if (e.name === 'AbortError') throw e; }
                }
            }
            if (!streamRes) return null;

            const reader = streamRes.body.getReader();
            const dec = new TextDecoder();
            let buf = '', reasoningBuf = '', contentBuf = '';

            streamLoop: while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += dec.decode(value, { stream: true });
                const lines = buf.split('\n');
                buf = lines.pop();
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const d = line.slice(6).trim();
                    if (d === '[DONE]') break streamLoop;
                    try {
                        const parsed = JSON.parse(d);
                        if (parsed.usage) onUsage?.(parsed.usage);
                        const deltaObj = parsed.choices?.[0]?.delta || {};
                        const reasoning = deltaObj.reasoning || '';
                        const delta = deltaObj.content || '';

                        if (mode === 'reasoning') {
                            if (reasoning) reasoningBuf += reasoning;
                            if (delta) contentBuf += delta;
                            const fromTags = extractThinking(contentBuf).thinking;
                            const displayThinking = (reasoningBuf || fromTags || contentBuf.replace(/<[^>]+>/g, '')).trim();
                            if (displayThinking) onChunk?.({ reasoning: displayThinking, display: `<thinking>${displayThinking}` });
                        } else if (mode === 'both') {
                            if (reasoning) reasoningBuf += reasoning;
                            if (delta) contentBuf += delta;
                            onChunk?.({ reasoning: reasoningBuf, content: contentBuf });
                        } else if (delta) {
                            contentBuf += delta;
                            onChunk?.({ content: contentBuf });
                        }
                    } catch {}
                }
            }

            if (mode === 'reasoning') {
                let thinking = reasoningBuf.trim();
                if (!thinking && contentBuf.trim()) {
                    const extracted = extractThinking(contentBuf);
                    thinking = extracted.thinking || contentBuf.replace(/<[^>]+>/g, '').trim();
                }
                return { thinking, content: '', model: usedModel };
            }
            if (mode === 'both') {
                let thinking = reasoningBuf.trim();
                let content = contentBuf.trim();
                if (!thinking && content) {
                    const ex = extractThinking(content);
                    thinking = ex.thinking;
                    content = ex.answer || stripThinking(content);
                } else if (thinking && content) {
                    content = stripThinking(content);
                }
                return { thinking, content, model: usedModel };
            }
            return { thinking: '', content: contentBuf.trim(), model: usedModel };
        };

        const synthesizeAnswerFromThinking = async (userQuery, thinking, systemBase, contextMsgs = [], extras = {}) => {
            const trimmed = (thinking || '').trim();
            if (!trimmed) return null;
            const tWords = countWords(trimmed);
            const minWords = extras.minWords || getTargetAnswerWords(tWords, { deep: extras.deep, attempt: extras.attempt || 0 });
            const deep = extras.deep ? SYNTHESIS_DEEP_PROMPT : '';
            const lengthNote = minWords > 80
                ? `\n\nLENGTH REQUIREMENT: Write at least ${minWords} words. Internal reasoning was ${tWords} words — your answer must match that depth with clear, structured prose. No tl;dr, no brief summary.`
                : '';
            const synthesisUser = [
                extras.toolContext || '',
                extras.visionContext ? `[Vision context from attached image: ${extras.visionContext}]` : '',
                `Question:\n${userQuery}`,
                `---\nInternal reasoning (use to inform your answer — do not quote verbatim or mention this section):\n${trimmed.slice(0, 14000)}`,
                lengthNote,
            ].filter(Boolean).join('\n\n');
            const messages = [
                { role: 'system', content: systemBase + SYNTHESIS_PROMPT + deep },
                ...contextMsgs.slice(-8),
                { role: 'user', content: synthesisUser },
            ];
            const writerModels = getWriterModels(extras.writerModel);
            const result = await streamGroqChat({
                models: writerModels,
                messages,
                keys: extras.keys,
                signal: extras.signal,
                temperature: extras.deep ? 0.72 : 0.68,
                extra: {},
                mode: 'content',
                thinkingOpts: { thinking: false },
            });
            return result?.content?.trim() || null;
        };

        const ensureQualityAnswer = async (thinkingText, accumulated, effectivePrompt, writerSystemBase, conversationMsgs, extras = {}) => {
            const thinking = thinkingText || extractThinking(accumulated).thinking;
            if (!thinking?.trim()) return accumulated;
            let wrapped = accumulated?.includes('<thinking>') ? accumulated : `<thinking>${thinking.trim()}</thinking>\n\n${stripThinking(accumulated)}`;
            const deep = extras.deep || countWords(thinking) > 150;
            let attempts = 0;
            while (needsAnswerSynthesis(wrapped, { deep }) && attempts < 3) {
                const minWords = getTargetAnswerWords(countWords(thinking), { deep, attempt: attempts });
                const better = await synthesizeAnswerFromThinking(effectivePrompt, thinking, writerSystemBase, conversationMsgs, {
                    ...extras, deep, attempt: attempts, minWords,
                });
                attempts++;
                if (!better) break;
                wrapped = `<thinking>${thinking.trim()}</thinking>\n\n${better}`;
            }
            return wrapped;
        };

        // --- LOGO — Fibre wavy "F" monogram (brush-stroke layers) ---
        const FIBRE_F_LINES = [
            'M 17.2 10.8 L 17.2 37.2',
            'M 17.2 10.8 L 34.8 10.6',
            'M 17.2 22.4 L 28.6 22.2',
            'M 16.4 10.9 L 16.4 37.1',
            'M 16.4 10.9 L 34.2 10.7',
            'M 16.4 22.5 L 28.0 22.3',
            'M 15.6 11.0 L 15.6 37.0',
            'M 15.6 11.0 L 33.6 10.8',
            'M 15.6 22.6 L 27.4 22.4',
            'M 14.8 11.1 L 14.8 36.9',
            'M 14.8 11.1 L 33.0 10.9',
            'M 14.8 22.7 L 26.8 22.5',
            'M 14.0 11.2 L 14.0 36.8',
            'M 14.0 11.2 L 32.4 11.0',
            'M 14.0 22.8 L 26.2 22.6',

                            <path key={`f-${i}`} className="selvet-logo-line" d={d} pathLength="100"
                                stroke="currentColor" strokeWidth="0.9" strokeLinecap="round" strokeLinejoin="round"
                                style={{ '--i': i, '--n': n }} />
