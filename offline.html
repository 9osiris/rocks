<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline - Osiris Watch</title>
  <meta name="theme-color" content="#0b0b0d" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      background: #0b0b0d; color: #ececee;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center; padding: 24px;
    }
    .wrap { max-width: 380px; }
    .badge {
      width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(45, 212, 191, 0.14); color: #2dd4bf;
    }
    .badge svg { width: 32px; height: 32px; }
    h1 { font-size: 1.4rem; margin-bottom: 10px; letter-spacing: -0.02em; }
    p { color: #8b8b95; font-size: 0.92rem; line-height: 1.6; margin-bottom: 24px; }
    button {
      appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600;
      background: #2dd4bf; color: #03201c; padding: 11px 24px; border-radius: 20px;
      transition: transform .15s ease, background .2s ease;
    }
    button:hover { background: #14b8a6; }
    button:active { transform: scale(0.96); }
    button:focus-visible { outline: 2px solid #2dd4bf; outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Osiris Watch needs a connection to stream. Check your internet and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
