<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Obsidian Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#090a0e"/>
    </linearGradient>

    <!-- Metallic Blue Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Primary Metallic Blue Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Specular Glass Highlight -->
    <linearGradient id="shine-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Outer Ambient Glow Filter -->
    <filter id="blue-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="6"/>

  <!-- Inner Glass Sheen -->
  <path d="M 40 136 C 40 83 83 40 136 40 L 376 40 C 429 40 472 83 472 136 C 472 83 429 40 376 40 L 136 40 C 83 40 40 83 40 136 Z" fill="url(#shine-grad)" opacity="0.4"/>

  <!-- Orbital Ring (Osiris "O") -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#accent-grad)" stroke-width="28" stroke-linecap="round" filter="url(#blue-glow)"/>

  <!-- Core Metallic Play Symbol (Watch "►") -->
  <path d="M 216 172 C 216 162.5 226.5 156.5 234.8 161.5 L 338.8 225.5 C 347.1 230.5 347.1 243.5 338.8 248.5 L 234.8 312.5 C 226.5 317.5 216 311.5 216 302 Z" fill="url(#accent-grad)"/>

  <!-- Play Symbol Specular Glare -->
  <path d="M 224 176 L 320 236 L 224 236 Z" fill="url(#shine-grad)" opacity="0.25"/>
</svg>
