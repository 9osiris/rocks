<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Obsidian Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="50%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <!-- Primary Metallic Blue Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Center Ambient Radial Glow -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Specular Glass Highlight -->
    <linearGradient id="glass-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Glow Filter for Play Symbol -->
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)"/>

  <!-- Inner Glass Sheen Overlay -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#glass-shine)"/>

  <!-- Center Ambient Radial Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#center-glow)"/>

  <!-- Optically Centered Bold Play Symbol (Watch "►") -->
  <path d="M 198 162 C 198 150.5 210.8 143.2 220.8 149.2 L 354.8 243.2 C 364.4 248.8 364.4 263.2 354.8 268.8 L 220.8 362.8 C 210.8 368.8 198 361.5 198 350 Z" fill="url(#accent-grad)" filter="url(#soft-glow)"/>

  <!-- Play Symbol Top Specular Highlight -->
  <path d="M 206 166 L 332 256 L 206 256 Z" fill="url(#glass-shine)" opacity="0.4"/>
</svg>
