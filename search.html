<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Osiris Watch - Search</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  <link rel="dns-prefetch" href="https://image.tmdb.org">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="orc-styles.css">
</head>
<body class="search-page">

  <header class="topnav" id="topnav"></header>

  <div class="app-shell">
    <main class="search-body">
      <h1 style="font-size:1.5rem;font-weight:800;margin-bottom:20px;letter-spacing:-.02em">Browse</h1>

      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="text" id="main-search-input" placeholder="Titles, actors, keywords…" autocomplete="off" aria-label="Search titles, actors, and keywords">
        <button id="search-clear" style="display:none;background:none;border:none;color:var(--text-dim);padding:4px;cursor:pointer" aria-label="Clear">✕</button>
      </div>

      <div class="filter-row">
        <button class="filter-chip on" data-filter="all">All</button>
        <button class="filter-chip" data-filter="movie">Movies</button>
        <button class="filter-chip" data-filter="tv">TV Shows</button>
        <button class="filter-chip filter-chip-ai" data-filter="ai"><span class="chip-spark">✦</span> AI <span class="chip-beta">Beta</span></button>
      </div>

      <div id="search-recent" class="search-recent" hidden></div>

      <p class="search-status" id="search-status"></p>
      <div class="search-grid" id="search-results"></div>
    </main>

    <footer class="page-foot">
      <p>Movie data from <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.</p>
      <p>Osiris Watch does not store or host media. Streams are provided by third-party services; legal concerns should be raised with those hosts directly. Osiris Watch is not responsible for content served by external providers.</p>
      <p>© 2026 Osiris Industries · <a href="/dmca">DMCA</a> · <a href="/settings">Settings</a></p>
    </footer>
  </div>

  <script src="orc-script.js"></script>
</body>
</html>
