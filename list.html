<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>My Lists — Osiris Watch</title>
  <meta name="description" content="View and manage your saved favorite movies and TV shows on Osiris Watch. Synchronized across devices with cloud account backup.">
  <link rel="canonical" href="https://www.osiris.rocks/list.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  <link rel="dns-prefetch" href="https://image.tmdb.org">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="orc-styles.css">
</head>
<body class="list-page">

  <header class="topnav" id="topnav"></header>

  <div class="app-shell">
    <main class="search-body list-body">
      <h1 class="list-page-title">My Lists</h1>
      
      <!-- Sub-Navigation Tabs matching Inspo Picture 1 -->
      <div class="list-main-tabs" role="tablist">
        <button type="button" class="list-tab-btn active" data-tab="watchlist" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
          Watchlist <span class="list-tab-badge" id="watchlist-count">0</span>
        </button>
        <button type="button" class="list-tab-btn" data-tab="folders" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Folders
        </button>
        <button type="button" class="list-tab-btn" data-tab="history" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          History
        </button>
      </div>

      <div class="list-controls-row">
        <div class="filter-row" id="list-filter-chips">
          <button type="button" class="filter-chip on" data-type="all">All</button>
          <button type="button" class="filter-chip" data-type="movie">Movies</button>
          <button type="button" class="filter-chip" data-type="tv">Series</button>
          <button type="button" class="filter-chip" data-type="recent">⇅ Newest</button>
        </div>
        <button type="button" class="btn-new-folder" id="btn-new-folder">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M12 11v6M9 14h6"/></svg>
          New Folder
        </button>
      </div>

      <p class="search-status" id="list-status"></p>
      <div class="search-grid" id="list-grid"></div>
    </main>

    <footer class="page-foot">
      <p>Movie data from <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.</p>
      <p>Osiris Watch does not store or host media. Streams are provided by third-party services.</p>

    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="orc-script.js"></script>
</body>
</html>
