<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>osiris</title>
  <meta name="description" content="Osiris - Full Stack Developer & AI Engineer">
  <meta name="theme-color" content="#0b0b0d">
  
  <link rel="icon" type="image/svg+xml" href="osirisweb.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="orc-styles.css">
  <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>
</head>
<body>
  <div class="top-corner-redirect">
    <a href="https://shuttletv.su">if you're here for OsirisWatch, click here.</a>
  </div>
  
  <div class="cursor-dot" id="cursor-dot"></div>

  <div class="app-shell centered">
    <div class="logo-wrap">
      <img src="osirisweb.svg" alt="osiris logo" class="profile-logo" draggable="false" />
      <div class="shine"></div>
    </div>
    
    <h1 class="hero-title">hello, im <span class="accent-gradient">osiris</span>.</h1>
    
    <p class="bio" id="typing-bio" style="min-height: 80px; opacity: 0; transition: opacity 0.5s ease;"></p>
    
    <p class="bio startup-bio" id="typing-bio-2" style="min-height: 80px; opacity: 0; transition: opacity 0.5s ease;"></p>

    <div class="countdown-container">
      <div class="countdown-label">FIBRE BETA RELEASE</div>
      <div class="countdown" id="fibre-countdown">00:00:00:00</div>
    </div>

    <div class="demo-link">
      <a href="#" id="demo-btn">see demos</a>
    </div>

    <h2 class="section-title">contact & socials</h2>
    <div class="link-container">
      <a href="https://discord.com/users/osirisplus" target="_blank" class="glass-btn">
        <div class="btn-icon"><i class="fa-brands fa-discord"></i></div>
        <div class="btn-text">
          <span class="upper">Discord</span>
          <span class="lower">@osirisplus</span>
        </div>
      </a>
      
      <a href="https://t.me/therealosiris" target="_blank" class="glass-btn">
        <div class="btn-icon"><i class="fa-brands fa-telegram"></i></div>
        <div class="btn-text">
          <span class="upper">Telegram</span>
          <span class="lower">@therealosiris</span>
        </div>
      </a>
      
      <a href="https://github.com/9osiris" target="_blank" class="glass-btn">
        <div class="btn-icon"><i class="fa-brands fa-github"></i></div>
        <div class="btn-text">
          <span class="upper">GitHub</span>
          <span class="lower">@9osiris</span>
        </div>
      </a>
    </div>
  </div>

  <div class="audio-widget" id="audio-widget">
    <img src="cover.jfif" class="album-art" alt="album cover" />
    <div class="audio-info">
      <span class="track-name">Guilt Trip</span>
      <span class="artist-name">Kanye West</span>
    </div>
    <canvas id="visualizer-canvas" class="visualizer-canvas" width="60" height="20"></canvas>
    <audio id="bg-audio" loop>
      <source src="guilt_trip.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script>
    document.getElementById('demo-btn').addEventListener('click', (e) => {
      e.preventDefault();
      alert("i didnt actually feel like putting the demos here rn so wait a few, thx.");
    });

    // Dynamic background mouse tracking
    document.addEventListener('mousemove', (e) => {
      const x = e.clientX / window.innerWidth;
      const y = e.clientY / window.innerHeight;
      document.body.style.setProperty('--mouse-x', x);
      document.body.style.setProperty('--mouse-y', y);
    });

    // Initialize Lenis Smooth Scroll
    const lenis = new Lenis({
      autoRaf: true,
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
    });

    // Terminal Typing Effect
    const bioText1 = "i specialize in full-stack software engineering, modern web design, and ai infrastructure. with 3 years pushing production code, 2 years shaping digital experiences, and 1.5 years architecting intelligent systems, i focus on building clean, highly performant software.";
    const bioText2 = "in december 2025, i founded an ai startup called Layered Innovation (LAYRD INNO.) where i engineered 'Fibre' a proprietary language model line optimized specifically for complex coding tasks and deep reasoning. fibre is slated for public release next year.";
    const bioElement1 = document.getElementById('typing-bio');
    const bioElement2 = document.getElementById('typing-bio-2');
    
    function typeText(element, text, callback) {
      let i = 0;
      element.innerHTML = '<span class="typed-text"></span><span class="cursor">|</span>';
      const textSpan = element.querySelector('.typed-text');
      const cursorSpan = element.querySelector('.cursor');
      
      // force reflow to ensure the fade-in animates properly
      void element.offsetWidth;
      element.style.opacity = '1';
      
      function typeChar() {
        if (i < text.length) {
          textSpan.innerHTML += text.charAt(i);
          i++;
          const typingSpeed = Math.random() * 20 + 10;
          setTimeout(typeChar, typingSpeed);
        } else {
          cursorSpan.style.display = 'none';
          if(callback) callback();
        }
      }
      setTimeout(typeChar, 200);
    }
    
    setTimeout(() => {
      typeText(bioElement1, bioText1, () => {
        typeText(bioElement2, bioText2);
      });
    }, 500);

    // Magnetic 3D Hover Effects
    const magneticElements = document.querySelectorAll('.glass-btn, #demo-btn');
    
    magneticElements.forEach(elem => {
      elem.addEventListener('mousemove', (e) => {
        const rect = elem.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        
        const rotateX = ((y - centerY) / centerY) * -10;
        const rotateY = ((x - centerX) / centerX) * 10;
        
        elem.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
      });
      
      elem.addEventListener('mouseleave', () => {
        elem.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
      });
    });

    // Fibre Countdown (11 months approx)
    const countdownEl = document.getElementById('fibre-countdown');
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + 334);
    
    setInterval(() => {
      const now = new Date().getTime();
      const distance = targetDate - now;
      
      if (distance < 0) {
        countdownEl.innerText = "DEPLOYED";
        return;
      }
      
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);
      
      countdownEl.innerText = 
        String(days).padStart(2, '0') + ":" + 
        String(hours).padStart(2, '0') + ":" + 
        String(minutes).padStart(2, '0') + ":" + 
        String(seconds).padStart(2, '0');
    }, 1000);

    // Real Web Audio API Visualizer
    const audioWidget = document.getElementById('audio-widget');
    const bgAudio = document.getElementById('bg-audio');
    const canvas = document.getElementById('visualizer-canvas');
    const ctx = canvas.getContext('2d');
    
    let audioContext;
    let analyser;
    let dataArray;
    let isPlaying = false;
    
    function drawResting() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for(let i=0; i<10; i++) {
         ctx.fillStyle = '#75757f';
         ctx.beginPath();
         ctx.roundRect(i * 6, canvas.height - 4, 4, 4, 2);
         ctx.fill();
      }
    }
    drawResting();
    
    function initAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        const source = audioContext.createMediaElementSource(bgAudio);
        source.connect(analyser);
        analyser.connect(audioContext.destination);
        analyser.fftSize = 64; 
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }
    
    function drawVisualizer() {
      if (!isPlaying) return;
      requestAnimationFrame(drawVisualizer);
      
      analyser.getByteFrequencyData(dataArray);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      let x = 0;
      for (let i = 0; i < 10; i++) {
        let v = dataArray[i] / 255;
        const barHeight = Math.max(v * canvas.height * 1.5, 4);
        
        ctx.fillStyle = '#ffffff'; 
        ctx.beginPath();
        const drawHeight = barHeight > canvas.height ? canvas.height : barHeight;
        ctx.roundRect(x, canvas.height - drawHeight, 4, drawHeight, 2);
        ctx.fill();
        x += 6;
      }
    }

    audioWidget.addEventListener('click', () => {
      initAudio();
      if (bgAudio.paused) {
        bgAudio.play().then(() => {
          isPlaying = true;
          audioWidget.classList.add('active');
          drawVisualizer();
        }).catch(e => console.error("Audio play failed:", e));
      } else {
        bgAudio.pause();
        isPlaying = false;
        audioWidget.classList.remove('active');
        drawResting();
      }
    });

    // Custom Cursor tracking
    const cursorDot = document.getElementById('cursor-dot');
    document.addEventListener('mousemove', (e) => {
      cursorDot.style.left = e.clientX + 'px';
      cursorDot.style.top = e.clientY + 'px';
    });
    
    const interactables = document.querySelectorAll('a, .audio-widget, .glass-btn, #demo-btn');
    interactables.forEach(el => {
      el.addEventListener('mouseenter', () => cursorDot.classList.add('hovering'));
      el.addEventListener('mouseleave', () => cursorDot.classList.remove('hovering'));
    });
  </script>
</body>
</html>
